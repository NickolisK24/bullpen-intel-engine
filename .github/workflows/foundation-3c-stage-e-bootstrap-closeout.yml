name: Foundation 3C Stage E Bootstrap Closeout

# THE FINAL INDEPENDENT VERIFICATION OF THE COMPLETED BOOTSTRAP.
#
# R6 wrote the last 99 games and left production at 109 completed / 0
# unresolved with 946 reconciled appearance rows. Stage E replays the ENTIRE
# 109-game bootstrap read-only and proves three things: production really is in
# that state, replaying all of it projects no mutation to any target, and the
# verification itself changed nothing.
#
# STAGE E AUTHORIZES NOTHING. It is not another write gate. There is no
# `--expected-plan-fingerprint` here because there is no write to authorize; the
# fingerprint it captures is a historical final-replay identity.
#
# THE SIX R1-R6 WORKFLOWS ARE GONE. They were removed in the same pull request
# that added this one, so none of them can be dispatched again. This workflow is
# the only Foundation 3C rollout workflow that remains, and it is temporary:
# Stage E2 deletes it after this verification passes. A workflow cannot verify
# production after merge and also delete itself in the same merged commit, which
# is the entire reason Stage E has two parts.
#
# SCOPE COMES FROM A REPOSITORY-PINNED MODULE, not from a second literal list in
# this file. `backend/scripts/stage_e_bootstrap_scope.py` imports the reviewed 99
# from the R5 helper and adds the reviewed ten, then emits the argument
# sequence and refuses unless it hashes to the approved digest. A hand-copied
# list here would be a second thing that can drift.
#
# DEAD LETTERS ARE REPORTED TWO WAYS. The governed bootstrap count must be zero.
# The global count was already 1,389 at R6 closeout and belongs to unrelated
# work. This workflow never claims the system has no dead letters.

on:
  workflow_dispatch:

concurrency:
  group: baseballos-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-e-bootstrap-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      GAME_DRIVEN_INGESTION_MODE: 'off'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
      REFERENCE_DATE: '2026-07-29'
      APPROVED_FULL_SCOPE_DIGEST: 'e8cde57b9fe1033077533f7bee0cc64fc5969aa7fa3fc64efdc672c26d08a804'
      SCOPE_ARGS_PATH: artifacts/stage-e-scope-args.txt
      BEFORE_STATE_PATH: artifacts/stage-e-before-state.json
      REPLAY_PATH: artifacts/stage-e-full-bootstrap-shadow.json
      AFTER_STATE_PATH: artifacts/stage-e-after-state.json
      SUMMARY_JSON_PATH: artifacts/stage-e-validation-summary.json
      SUMMARY_MARKDOWN_PATH: artifacts/stage-e-validation-summary.md
      CLOSEOUT_JSON_PATH: artifacts/stage-e-closeout.json
      CLOSEOUT_MARKDOWN_PATH: artifacts/stage-e-closeout.md
      MANIFEST_JSON_PATH: artifacts/stage-e-cleanup-manifest.json
      MANIFEST_MARKDOWN_PATH: artifacts/stage-e-cleanup-manifest.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate required secrets are present
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] \
             || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          echo "Required production secrets are present."

      - name: Create the artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts

      # The scope is emitted from the repository-pinned module and refused
      # unless it hashes to the approved digest. Nothing here reads an input,
      # the database, an API, a prior artifact, or the network.
      - name: Build and validate the pinned 109-game scope
        run: |
          set -euo pipefail
          python backend/scripts/stage_e_bootstrap_scope.py \
            --emit-arguments "$SCOPE_ARGS_PATH" \
            --expected-digest "$APPROVED_FULL_SCOPE_DIGEST" \
            --expected-game-count 109
          flag_count=$(grep -c -- '--only-game-pk' "$SCOPE_ARGS_PATH")
          if [ "$flag_count" -ne 109 ]; then
            echo "::error::Stage E scope did not emit exactly 109 games."
            exit 1
          fi
          echo "Stage E scope validated: 109 games, digest matches."

      - name: Capture the before state
        id: before
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/inspect_stage_e_bootstrap_state.py --phase before --output "$BEFORE_STATE_PATH"
          before_exit=$?
          set -e
          echo "before_exit=$before_exit" >> "$GITHUB_OUTPUT"

      # The one and only ingestion invocation. Shadow, exclusive, whole
      # bootstrap. No write mode and no fingerprint, because Stage E authorizes
      # nothing.
      - name: Run the exact 109-game bootstrap replay
        id: replay
        if: ${{ steps.before.outputs.before_exit == '0' }}
        run: |
          set -euo pipefail
          mapfile -t scope_args < "$SCOPE_ARGS_PATH"
          set +e
          python backend/scripts/game_driven_ingestion.py \
            --mode shadow \
            --reference-date "$REFERENCE_DATE" \
            "${scope_args[@]}" \
            --output "$REPLAY_PATH"
          replay_exit=$?
          set -e
          echo "replay_exit=$replay_exit" >> "$GITHUB_OUTPUT"

      - name: Capture the after state
        id: after
        if: ${{ always() && steps.before.outputs.before_exit == '0' }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/inspect_stage_e_bootstrap_state.py --phase after --output "$AFTER_STATE_PATH"
          after_exit=$?
          set -e
          echo "after_exit=$after_exit" >> "$GITHUB_OUTPUT"

      - name: Validate the complete Stage E closeout
        id: closeout
        if: ${{ always() }}
        env:
          REPOSITORY_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/validate_stage_e_bootstrap_closeout.py \
            --before-state "$BEFORE_STATE_PATH" \
            --replay "$REPLAY_PATH" \
            --after-state "$AFTER_STATE_PATH" \
            --summary-json "$SUMMARY_JSON_PATH" \
            --summary-markdown "$SUMMARY_MARKDOWN_PATH" \
            --closeout-json "$CLOSEOUT_JSON_PATH" \
            --closeout-markdown "$CLOSEOUT_MARKDOWN_PATH" \
            --repository-sha "$REPOSITORY_SHA" \
            --run-id "$WORKFLOW_RUN_ID"
          closeout_exit=$?
          set -e
          echo "closeout_exit=$closeout_exit" >> "$GITHUB_OUTPUT"

      - name: Generate the cleanup manifest
        id: manifest
        if: ${{ always() }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/build_stage_e_cleanup_manifest.py \
            --json "$MANIFEST_JSON_PATH" \
            --markdown "$MANIFEST_MARKDOWN_PATH"
          manifest_exit=$?
          set -e
          echo "manifest_exit=$manifest_exit" >> "$GITHUB_OUTPUT"

      - name: Scan artifacts for credential-shaped content
        id: scan
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          # Fail closed on anything credential-shaped reaching an artifact. The
          # matched text is never printed — only the filename and the category.
          forbidden = re.compile(
              r'postgresql://|postgres://|password\s*=|Authorization\s*:'
              r'|X-Admin-Token|ADMIN_API_TOKEN|SECRET_KEY|DATABASE_URL'
              r'|BASEBALLOS_ADMIN_API_TOKEN'
              r'|token\s*=|api[_-]?key\s*=|secret\s*=',
              re.IGNORECASE,
          )
          leaked = []
          for path in sorted(Path('artifacts').glob('*')):
              if path.is_file() and forbidden.search(path.read_text(errors='ignore')):
                  leaked.append(path.name)
                  path.unlink()
          if leaked:
              print(f"::error::Sanitization check failed for: {', '.join(leaked)}")
              raise SystemExit(1)
          print('Artifact sanitization check passed.')
          PY

      - name: Write the job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f "$SUMMARY_MARKDOWN_PATH" ]; then
            cat "$SUMMARY_MARKDOWN_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## FOUNDATION 3C STAGE E1 — FAILED'
              echo
              echo '- Failed invariant: `closeout_validation_produced_no_summary`'
              echo '- Artifact: `foundation-3c-stage-e-bootstrap-closeout`'
              echo '- No database writes were performed by Stage E.'
              echo '- Automated lane: off'
              echo '- Authoritative mode: unapproved'
              echo
              echo 'Do not enable any lane. Do not remove the Stage E'
              echo 'verification workflow. Do not proceed to E2.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$MANIFEST_MARKDOWN_PATH" ]; then
            cat "$MANIFEST_MARKDOWN_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the Stage E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-3c-stage-e-bootstrap-closeout
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the job unless Stage E passed
        if: ${{ always() }}
        env:
          CLOSEOUT_EXIT: ${{ steps.closeout.outputs.closeout_exit }}
          MANIFEST_EXIT: ${{ steps.manifest.outputs.manifest_exit }}
        run: |
          set -euo pipefail
          if [ "${CLOSEOUT_EXIT:-2}" != "0" ] || [ "${MANIFEST_EXIT:-2}" != "0" ]; then
            echo "::error::Stage E failed; see the job summary. Do not enable any lane and do not proceed to E2."
            exit 1
          fi
          echo "Stage E1 passed. The 109-game bootstrap is verified. Proceed to E2 cleanup."

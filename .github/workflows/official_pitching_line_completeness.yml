name: Official Pitching-Line Completeness Diagnostic (2026)

# Dispatch-only, READ-ONLY diagnostic. It identifies which official box-score pitching
# lines are absent, extra, misclassified, misassigned, duplicated, or statistically
# different in the local GameLog ledger. It performs no repair: no backfill, no
# reconciliation write, no change to the canonical aggregation or to any gate.

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        default: '2026'
        type: string
      as_of_date:
        description: As-of date (YYYY-MM-DD), inclusive
        required: true
        default: '2026-07-25'
        type: string
      detail_limit:
        description: Bounded detail count (0-500)
        required: true
        default: '100'
        type: string
      team_id:
        description: Optional MLB team id (blank = all teams)
        required: false
        default: ''
        type: string
      game_pk:
        description: Optional MLB gamePk (blank = all selected games)
        required: false
        default: ''
        type: string

concurrency:
  group: official-pitching-line-completeness-2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate diagnostic inputs
        env:
          SEASON: ${{ inputs.season }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
          TEAM_ID: ${{ inputs.team_id }}
          GAME_PK: ${{ inputs.game_pk }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          if ! [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then
            echo "::error::season must be a four-digit year."
            exit 1
          fi
          if ! [[ "$AS_OF_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::as_of_date must be YYYY-MM-DD."
            exit 1
          fi
          if ! [[ "$DETAIL_LIMIT" =~ ^[0-9]{1,3}$ ]] || [ "$DETAIL_LIMIT" -gt 500 ]; then
            echo "::error::detail_limit must be an integer between 0 and 500."
            exit 1
          fi
          if [ -n "$TEAM_ID" ] && ! [[ "$TEAM_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::team_id must contain only digits when provided."
            exit 1
          fi
          if [ -n "$GAME_PK" ] && ! [[ "$GAME_PK" =~ ^[0-9]+$ ]]; then
            echo "::error::game_pk must contain only digits when provided."
            exit 1
          fi
          echo "Read-only official pitching-line completeness inputs validated."

      - name: Run read-only completeness diagnostic
        working-directory: backend
        env:
          SEASON: ${{ inputs.season }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          DETAIL_LIMIT: ${{ inputs.detail_limit }}
          TEAM_ID: ${{ inputs.team_id }}
          GAME_PK: ${{ inputs.game_pk }}
          DIAGNOSTIC_OUTPUT_DIR: ${{ runner.temp }}/official-pitching-line-completeness-2026
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_OUTPUT_DIR"
          report_json="$DIAGNOSTIC_OUTPUT_DIR/official-pitching-line-completeness-2026.json"

          optional_args=()
          if [ -n "$TEAM_ID" ]; then
            optional_args+=(--team-id "$TEAM_ID")
          fi
          if [ -n "$GAME_PK" ]; then
            optional_args+=(--game-pk "$GAME_PK")
          fi

          set +e
          python scripts/run_official_pitching_line_completeness_2026.py \
            --season "$SEASON" \
            --as-of-date "$AS_OF_DATE" \
            --detail-limit "$DETAIL_LIMIT" \
            "${optional_args[@]}" \
            --compact \
            --output "$report_json"
          diagnostic_exit_code=$?
          set -e

          python - "$report_json" "$diagnostic_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding='utf-8'))
          reconciliations = payload.get('reconciliations') or {}
          counts_by_reason = payload.get('counts_by_reason') or {}
          details = payload.get('bounded_details') or []

          summary = [
              '## Official Pitching-Line Completeness Diagnostic (2026)',
              '',
              f"- Result: `{payload.get('result')}`",
              f"- Exit code: `{exit_code}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Decision reasons: `{payload.get('decision_reasons')}`",
              f"- Season / as-of: `{payload.get('season')}` / `{payload.get('as_of_date')}`",
              f"- Official games selected: `{payload.get('official_games_selected')}`",
              f"- Official games fetched: `{payload.get('official_games_fetched')}`",
              f"- Official team-game sides: `{payload.get('official_team_game_sides')}`",
              f"- Expected official starter lines: `{payload.get('expected_official_starter_lines')}`",
              f"- Official pitching lines: `{payload.get('official_pitching_lines')}`",
              f"- Official starter lines: `{payload.get('official_starter_lines')}`",
              f"- Official relief lines: `{payload.get('official_relief_lines')}`",
              f"- Local pitching lines: `{payload.get('local_pitching_lines')}`",
              f"- Local starter lines: `{payload.get('local_starter_lines')}`",
              f"- Local relief lines: `{payload.get('local_relief_lines')}`",
              f"- Exact matches: `{payload.get('exact_match_count')}`",
              f"- Missing local lines: `{payload.get('missing_local_line_count')}`",
              f"- Extra local lines: `{payload.get('extra_local_line_count')}`",
              f"- Missing local pitcher identities: `{payload.get('missing_local_pitcher_identity_count')}`",
              f"- Appearance-team mismatches: `{payload.get('appearance_team_mismatch_count')}`",
              f"- Role mismatches: `{payload.get('role_mismatch_count')}`",
              f"- Stat mismatches: `{payload.get('stat_mismatch_count')}`",
              f"- Duplicate local lines: `{payload.get('duplicate_local_line_count')}`",
              f"- Detail count: `{payload.get('detail_count')}` (bounded to "
              f"`{payload.get('bounded_detail_count')}`, truncated: `{payload.get('details_truncated')}`)",
              f"- Repair status: `{payload.get('repair_status')}`",
              f"- Foundation 3B gate: `{payload.get('foundation_3b_gate')}`",
              f"- Public reader gate: `{payload.get('public_reader_gate')}`",
              f"- Share Card performance gate: `{payload.get('share_card_performance_gate')}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
              '',
              '### Counts by reason',
          ]
          summary.extend(f"- `{reason}`: `{count}`" for reason, count in sorted(counts_by_reason.items()))
          summary.extend(('', '### Reconciliations'))
          summary.extend(f"- `{name}`: `{value}`" for name, value in sorted(reconciliations.items()))
          summary.extend(('', '### Bounded details (first 25)'))
          summary.extend(
              f"- game `{item.get('game_pk')}` · team `{item.get('team_id')}` · official pitcher "
              f"`{item.get('official_pitcher_id')}` · local pitcher `{item.get('local_pitcher_id')}` · "
              f"`{item.get('reason_codes')}`"
              for item in details[:25]
          )
          summary_path.write_text('\n'.join(summary) + '\n', encoding='utf-8')

          if payload.get('database_writes_performed') is not False:
              raise SystemExit('Diagnostic must not perform database writes.')
          if payload.get('mode') != 'read_only':
              raise SystemExit('Diagnostic must run in read_only mode.')
          PY

          exit "$diagnostic_exit_code"

      - name: Upload private diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-pitching-line-completeness-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/official-pitching-line-completeness-2026/
          if-no-files-found: error
          retention-days: 14

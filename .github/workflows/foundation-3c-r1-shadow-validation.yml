name: Foundation 3C R1 Shadow Validation

# ONE operation, fully pinned: a read-only shadow reconciliation of exactly the
# five games the first controlled Foundation 3C write already reconciled, at
# reference date 2026-07-29.
#
# Before PR #571 that replay projected 14 updates whose only changed field was
# the derived decimal innings companion — an applied write that never
# converged. R1 proves the repair: the same five games must now replay to zero
# mutations, with those 14 companion differences recognised and ignored rather
# than treated as official corrections.
#
# Nothing here is an input. The games, the date, and the mode are hard-coded so
# the run cannot be misconfigured from a phone — there is nothing to type and
# nothing to get wrong. A failed validation is a rollout stop, never a warning.
#
# It writes no baseball data. It relies on the merged Foundation 3C shadow
# path, which is logically read-only before any transaction handling, and adds
# no compensating write, cleanup, or write-and-roll-back of its own.

on:
  workflow_dispatch:

concurrency:
  group: foundation-3c-r1-shadow-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r1-shadow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      # Defense in depth. The CLI is given --mode shadow explicitly; this
      # additionally proves the run does not enable the automated lane.
      GAME_DRIVEN_INGESTION_MODE: 'off'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
      REPORT_PATH: artifacts/r1-original-five-shadow.json
      SUMMARY_JSON_PATH: artifacts/r1-validation-summary.json
      SUMMARY_MARKDOWN_PATH: artifacts/r1-validation-summary.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate required secrets are present
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] \
             || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          echo "Required production secrets are present."

      - name: Run the R1 shadow reconciliation
        id: shadow
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # A nonzero exit must still reach validation and artifact upload, so
          # the code is captured rather than thrown.
          set +e
          python backend/scripts/game_driven_ingestion.py --mode shadow --reference-date 2026-07-29 --only-game-pk 823518 --only-game-pk 824735 --only-game-pk 823761 --only-game-pk 824083 --only-game-pk 824327 --output "$REPORT_PATH"
          shadow_exit=$?
          set -e
          echo "shadow_exit=$shadow_exit" >> "$GITHUB_OUTPUT"

      - name: Validate the R1 report
        id: validate
        if: ${{ always() }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/validate_r1_shadow_report.py \
            --report "$REPORT_PATH" \
            --summary-json "$SUMMARY_JSON_PATH" \
            --summary-markdown "$SUMMARY_MARKDOWN_PATH"
          validation_exit=$?
          set -e
          echo "validation_exit=$validation_exit" >> "$GITHUB_OUTPUT"

      - name: Scan artifacts for credential-shaped content
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          # Fail closed on anything credential-shaped reaching an artifact.
          forbidden = re.compile(
              r'postgresql://|postgres://|password=|Authorization:|X-Admin-Token'
              r'|ADMIN_API_TOKEN|SECRET_KEY|DATABASE_URL',
              re.IGNORECASE,
          )
          leaked = []
          for path in sorted(Path('artifacts').glob('*')):
              if path.is_file() and forbidden.search(path.read_text(errors='ignore')):
                  leaked.append(path.name)
                  path.unlink()
          if leaked:
              print(f"::error::Sanitization check failed for: {', '.join(leaked)}")
              raise SystemExit(1)
          print('Artifact sanitization check passed.')
          PY

      - name: Write the job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f "$SUMMARY_MARKDOWN_PATH" ]; then
            cat "$SUMMARY_MARKDOWN_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## FOUNDATION 3C R1 — FAILED'
              echo
              echo '- Failed invariant: `shadow_command_produced_no_report`'
              echo '- Artifact: `r1-original-five-shadow.json`'
              echo
              echo 'This is a rollout stop. R2 must not begin.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the R1 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-3c-r1-shadow-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job unless R1 passed
        if: ${{ always() }}
        env:
          SHADOW_EXIT: ${{ steps.shadow.outputs.shadow_exit }}
          VALIDATION_EXIT: ${{ steps.validate.outputs.validation_exit }}
        run: |
          set -euo pipefail
          if [ "${SHADOW_EXIT:-2}" != "0" ]; then
            echo "::error::R1 shadow reconciliation exited ${SHADOW_EXIT:-2}."
            exit 1
          fi
          if [ "${VALIDATION_EXIT:-2}" != "0" ]; then
            echo "::error::R1 validation failed; see the job summary. Rollout stops here."
            exit 1
          fi
          echo "R1 passed."

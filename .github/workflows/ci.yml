name: CI

# Runs the backend and frontend test suites on every push and pull request so
# the green state asserted in the docs is actually enforced. Kept intentionally
# simple: install, test. No deploy, no sync, no secrets required.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseballos_ci_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseballos_ci_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_ci_migration_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run migrations on Postgres
        run: python -m flask db upgrade

  # Proves the four shards below still cover the whole backend suite: every test
  # collected on this commit is owned by exactly one shard, and no test is owned
  # twice. Needs no database, so it runs alongside the shards rather than gating
  # them. A new or renamed backend test file fails this job on purpose — shard
  # ownership is a reviewed change, never an automatic one.
  backend-collection-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Verify every backend test is owned by exactly one shard
        run: |
          set -euo pipefail
          python scripts/ci_shard.py verify | tee shard_verification.txt

      - name: Report shard coverage
        if: always()
        run: |
          {
            echo "### backend-collection-accounting"
            echo ""
            echo '```text'
            cat shard_verification.txt 2>/dev/null || echo 'verification produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The backend suite runs as four concurrent shards, each against its own
  # PostgreSQL database. The isolation is the point: concurrent test processes
  # sharing one database collide on create_all/drop_all DDL, on unique
  # constraints, and on the database-global advisory locks the sync services
  # take. Every test still runs, on PostgreSQL, before merge — the suite is
  # partitioned, not reduced.
  backend-postgres-tests:
    name: backend-postgres-tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseballos_ci_tests_${{ matrix.shard }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseballos_ci_tests_${{ matrix.shard }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AUTO_SYNC: 'false'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_ci_tests_${{ matrix.shard }}
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_ci_tests_${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Resolve the files this shard owns
        run: |
          set -euo pipefail
          python scripts/ci_shard.py files --shard "${{ matrix.shard }}" > shard_files.txt
          SHARD_FILE_COUNT="$(grep -c . shard_files.txt || true)"
          if [ "${SHARD_FILE_COUNT}" -lt 1 ]; then
            echo "shard ${{ matrix.shard }} resolved an empty file list" >&2
            exit 1
          fi
          echo "SHARD_FILE_COUNT=${SHARD_FILE_COUNT}" >> "$GITHUB_ENV"

      - name: Run this shard on its own Postgres database
        run: |
          set -euo pipefail
          python -u -m pytest $(tr '\n' ' ' < shard_files.txt) \
            -q -ra --tb=short --durations=25 --durations-min=1 \
            | tee shard_pytest.txt

      - name: Report shard result
        if: always()
        run: |
          {
            echo "### backend-postgres-tests shard ${{ matrix.shard }}/4"
            echo ""
            echo "- database: \`baseballos_ci_tests_${{ matrix.shard }}\`"
            echo "- assigned files: ${SHARD_FILE_COUNT:-unresolved}"
            echo "- result: \`$(tail -n 1 shard_pytest.txt 2>/dev/null || echo 'pytest produced no summary line')\`"
            echo ""
            echo "<details><summary>Files owned by this shard</summary>"
            echo ""
            echo '```text'
            cat shard_files.txt 2>/dev/null || echo 'shard file list unavailable'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The repository currently tracks a node_modules/ tree built on another
      # platform, and npm has a known optional-dependency bug that surfaces as
      # "Cannot find module @rollup/rollup-linux-x64-gnu". Removing the checked-in
      # install and the lockfile, then running a fresh `npm install` on the Linux
      # runner, regenerates the correct platform binaries reliably.
      - name: Clean checked-in install artifacts
        run: rm -rf node_modules package-lock.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

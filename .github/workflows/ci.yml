name: CI

# Runs the backend and frontend test suites on every push and pull request so
# the green state asserted in the docs is actually enforced. Kept intentionally
# simple: install, test. No deploy, no sync, no secrets required.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseballos_ci_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseballos_ci_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_ci_migration_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run migrations on Postgres
        run: python -m flask db upgrade

  # Proves the four shards below still cover the whole backend suite: every test
  # collected on this commit is owned by exactly one shard, and no test is owned
  # twice. Needs no database, so it runs alongside the shards rather than gating
  # them. A new or renamed backend test file fails this job on purpose — shard
  # ownership is a reviewed change, never an automatic one.
  backend-collection-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      # Full history, matching the shards. Collection imports every backend test
      # module, so this job must see the same repository shape the shards do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # requirements-dev.txt pulls in requirements.txt, so both files
          # determine the resolved install and both belong in the cache key.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Shard verification runs live pytest collection, so this job needs the
      # test dependencies rather than the runtime-only set.
      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify every backend test is owned by exactly one shard
        run: |
          set -euo pipefail
          python scripts/ci_shard.py verify | tee shard_verification.txt

      - name: Report shard coverage
        if: always()
        run: |
          {
            echo "### backend-collection-accounting"
            echo ""
            echo '```text'
            cat shard_verification.txt 2>/dev/null || echo 'verification produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The backend suite runs as four concurrent shards, each against its own
  # PostgreSQL database. The isolation is the point: concurrent test processes
  # sharing one database collide on create_all/drop_all DDL, on unique
  # constraints, and on the database-global advisory locks the sync services
  # take. Every test still runs, on PostgreSQL, before merge — the suite is
  # partitioned, not reduced.
  backend-postgres-tests:
    name: backend-postgres-tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseballos_ci_tests_${{ matrix.shard }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseballos_ci_tests_${{ matrix.shard }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AUTO_SYNC: 'false'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_ci_tests_${{ matrix.shard }}
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_ci_tests_${{ matrix.shard }}
    steps:
      # Full history, not the default shallow single-branch fetch. Several
      # behaviour-freeze guards diff the branch against origin/main to prove a
      # frozen public or legacy contract was not touched. Without that ref the
      # diff command fails, the helper swallows the error, and the guard skips —
      # a green suite that never ran its own trust check. fetch-depth: 0 fetches
      # every head, so origin/main resolves on push and pull_request alike.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # requirements-dev.txt pulls in requirements.txt, so both files
          # determine the resolved install and both belong in the cache key.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # These shards run pytest directly.
      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Resolve the files this shard owns
        run: |
          set -euo pipefail
          python scripts/ci_shard.py files --shard "${{ matrix.shard }}" > shard_files.txt
          SHARD_FILE_COUNT="$(grep -c . shard_files.txt || true)"
          if [ "${SHARD_FILE_COUNT}" -lt 1 ]; then
            echo "shard ${{ matrix.shard }} resolved an empty file list" >&2
            exit 1
          fi
          echo "SHARD_FILE_COUNT=${SHARD_FILE_COUNT}" >> "$GITHUB_ENV"

      - name: Run this shard on its own Postgres database
        run: |
          set -euo pipefail
          python -u -m pytest $(tr '\n' ' ' < shard_files.txt) \
            -q -ra --tb=short --durations=25 --durations-min=1 \
            | tee shard_pytest.txt

      - name: Report shard result
        if: always()
        run: |
          {
            echo "### backend-postgres-tests shard ${{ matrix.shard }}/4"
            echo ""
            echo "- database: \`baseballos_ci_tests_${{ matrix.shard }}\`"
            echo "- assigned files: ${SHARD_FILE_COUNT:-unresolved}"
            echo "- result: \`$(tail -n 1 shard_pytest.txt 2>/dev/null || echo 'pytest produced no summary line')\`"
            echo ""
            echo "<details><summary>Files owned by this shard</summary>"
            echo ""
            echo '```text'
            cat shard_files.txt 2>/dev/null || echo 'shard file list unavailable'
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install exactly what the committed lockfile says, and nothing else. The
      # lockfile is never deleted or regenerated here: CI that rewrites its own
      # inputs cannot prove anything about the tree that ships.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        run: npm test

      # Unit tests exercise modules; they do not prove the production bundle
      # compiles. A broken import, a bad asset reference, or a resolution failure
      # passes every test and fails the build. Both are required.
      - name: Build the production frontend bundle
        run: npm run build

  # Dependency risk, audited on every push and pull request. The jobs above prove
  # the application behaves; this one proves the tree it ships is still one we
  # have looked at.
  #
  # It is deliberately its own job. Folding it into the test jobs would let a
  # scanner outage or a brand-new advisory mask the real behavioural signal, and
  # it runs in parallel so it adds no wall-clock time.
  #
  # Nothing here upgrades, fixes, or rewrites anything: no `npm audit fix`, no
  # `npm update`, no `pip install --upgrade`. The job is read-only with respect to
  # repository content, and it requests no write permission.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned on purpose. An unpinned scanner makes the gate non-reproducible and
      # lets a tool release change CI behaviour without review. It is installed as
      # an isolated CI tool and is deliberately absent from both backend manifests,
      # so its own transitive tree never enlarges the surface being audited.
      - name: Install the dependency scanner
        run: pip install "pip-audit==2.10.1"

      # requirements-file mode, not environment mode. Environment mode also audits
      # the runner's virtualenv furniture (setuptools and friends), which
      # BaseballOS neither declares nor controls — that would force an
      # --ignore-vuln entry on day one and poison the mechanism.
      #
      # backend/requirements.txt is the production surface. requirements-dev.txt
      # still carries the pytest advisory by design (#601 Slice B); auditing it
      # here would make production CI permanently red for a test-only tool.
      #
      # One bounded retry, because a registry blip is not a vulnerability. If both
      # attempts fail the step fails loudly: "the scanner could not run" must never
      # be reported as "nothing was found".
      - name: Audit backend runtime dependencies
        id: backend_audit
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python -m pip_audit \
                 -r backend/requirements.txt \
                 --strict \
                 --progress-spinner off > backend_audit.txt 2>&1; then
              echo "backend audit clean on attempt ${attempt}"
              cat backend_audit.txt
              exit 0
            fi
            if grep -qiE 'known vulnerabilit|Found [0-9]+ known' backend_audit.txt; then
              echo "::error::backend runtime dependencies have known advisories"
              cat backend_audit.txt
              exit 1
            fi
            echo "scanner did not complete on attempt ${attempt}:"
            cat backend_audit.txt
            if [ "${attempt}" -eq 1 ]; then sleep 15; fi
          done
          echo "::error::pip-audit failed to complete; refusing to report a clean audit"
          exit 1

      - name: Report backend audit result
        if: always()
        run: |
          {
            echo "### Backend runtime audit"
            echo ""
            echo "- manifest: \`backend/requirements.txt\` (production surface)"
            echo "- scanner: \`pip-audit==2.10.1\`, requirements-file mode, \`--strict\`"
            echo "- checked: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo '```text'
            cat backend_audit.txt 2>/dev/null || echo 'the scanner produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same deterministic install the test job uses. --no-audit stays: the audit
      # is run explicitly below so its output can be captured and evaluated, rather
      # than relying on npm's implicit install-time check.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # npm exits non-zero merely because advisories exist, so its status cannot
      # distinguish "found advisories" from "could not run". The JSON is captured
      # here and judged by the evaluator; a missing or unparseable report fails.
      - name: Capture frontend production audit
        working-directory: frontend
        run: |
          set -uo pipefail
          npm audit --omit=dev --json > ../npm-audit-production.json || true
          if [ ! -s ../npm-audit-production.json ]; then
            echo "::error::npm audit produced no output; refusing to report a clean audit"
            exit 1
          fi
          python -c "import json,sys; json.load(open('../npm-audit-production.json'))" || {
            echo "::error::npm audit output is not valid JSON; refusing to report a clean audit"
            exit 1
          }

      # The gate. Unknown, expired, stale, mismatched, duplicated or
      # missing-metadata acceptances all fail here.
      - name: Verify frontend production advisories against reviewed exceptions
        run: |
          set -euo pipefail
          python backend/scripts/verify_dependency_audit.py \
            --audit npm-audit-production.json \
            --accepted .github/dependency-audit-accepted.json \
            --repo-root . | tee frontend_audit.txt

      - name: Report frontend production audit result
        if: always()
        run: |
          {
            echo "### Frontend production audit"
            echo ""
            echo "- scope: \`npm audit --omit=dev\` (production dependencies)"
            echo "- exceptions: \`.github/dependency-audit-accepted.json\`"
            echo ""
            echo '```text'
            cat frontend_audit.txt 2>/dev/null || echo 'the evaluator produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Informational only, and deliberately so. Dev/build advisories do not ship
      # to a browser, so they are outside the production gate — but they are not
      # allowed to disappear either. Advisory-positive exit is normalised here on
      # purpose; a scanner that cannot run or emits unparseable JSON still fails.
      - name: Frontend dev/build informational audit
        working-directory: frontend
        run: |
          set -uo pipefail
          npm audit --json > ../npm-audit-full.json || true
          if [ ! -s ../npm-audit-full.json ]; then
            echo "::error::npm audit (full) produced no output"
            exit 1
          fi
          python - <<'PY' > ../dev_audit_summary.txt
          import json
          with open('../npm-audit-full.json', encoding='utf-8') as handle:
              report = json.load(handle)
          counts = report.get('metadata', {}).get('vulnerabilities', {})
          rows = report.get('vulnerabilities', {})
          production = {'react-router', 'react-router-dom'}
          dev_rows = sorted(name for name in rows if name not in production)
          print('Full dependency tree (production + dev/build)')
          print(f"  total advisory rows : {counts.get('total', 'unknown')}")
          for level in ('critical', 'high', 'moderate', 'low', 'info'):
              if counts.get(level):
                  print(f'  {level:<20}: {counts[level]}')
          print()
          print(f'  dev/build rows      : {len(dev_rows)}')
          for name in dev_rows:
              print(f'    - {name} ({rows[name].get("severity")})')
          print()
          print('  Blocking: no. Dev/build advisories are reported for visibility;')
          print('  they are not part of the production gate and must never be')
          print('  listed in the production accepted-risk file.')
          PY
          cat ../dev_audit_summary.txt

      - name: Report dev/build informational audit
        if: always()
        run: |
          {
            echo "### Frontend dev/build informational audit"
            echo ""
            echo '```text'
            cat dev_audit_summary.txt 2>/dev/null || echo 'the summary was not produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

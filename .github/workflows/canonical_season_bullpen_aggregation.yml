# Canonical Season Bullpen Aggregation Audit (Foundation 3A).
#
# Manual, dispatch-only, READ-ONLY. Runs the single canonical team-level season bullpen
# aggregation over completed regular-season relief appearances (historical appearance-team
# authority), optionally validated independently against official MLB box scores. It writes
# no application database data — there is no confirmation phrase and no fingerprint because
# there is no write path. No public metric is exposed by this workflow.
name: Canonical Season Bullpen Aggregation Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: local_only (default) or official_validation (independent MLB check)
        required: true
        default: local_only
        type: choice
        options:
          - local_only
          - official_validation
      season:
        description: Season year (e.g. 2026)
        required: true
        default: '2026'
        type: string
      as_of_date:
        description: Inclusive official game-date boundary (YYYY-MM-DD)
        required: true
        default: '2026-07-25'
        type: string
      team_detail_limit:
        description: Max per-team detail rows in the report (0-200)
        required: false
        default: '40'
        type: string
      mismatch_detail_limit:
        description: Max bounded mismatch rows in the report (0-200)
        required: false
        default: '60'
        type: string

concurrency:
  group: canonical-season-bullpen-aggregation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          SEASON: ${{ inputs.season }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          TEAM_DETAIL_LIMIT: ${{ inputs.team_detail_limit }}
          MISMATCH_DETAIL_LIMIT: ${{ inputs.mismatch_detail_limit }}
        run: |
          set -euo pipefail
          if [ "$MODE" != 'local_only' ] && [ "$MODE" != 'official_validation' ]; then
            echo "::error::mode must be local_only or official_validation."
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ]; then
            echo "::error::Missing DATABASE_URL or SECRET_KEY repository secret."
            exit 1
          fi
          if ! printf '%s' "$SEASON" | grep -Eq '^[0-9]{4}$'; then
            echo "::error::season must be a 4-digit year."
            exit 1
          fi
          if ! printf '%s' "$AS_OF_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::as_of_date must be YYYY-MM-DD."
            exit 1
          fi
          if ! printf '%s' "$TEAM_DETAIL_LIMIT" | grep -Eq '^[0-9]+$'; then
            echo "::error::team_detail_limit must be an integer."
            exit 1
          fi
          if ! printf '%s' "$MISMATCH_DETAIL_LIMIT" | grep -Eq '^[0-9]+$'; then
            echo "::error::mismatch_detail_limit must be an integer."
            exit 1
          fi
          echo "Read-only aggregation: no confirmation phrase or fingerprint (no write path)."

      - name: Run canonical season bullpen aggregation
        working-directory: backend
        env:
          MODE: ${{ inputs.mode }}
          SEASON: ${{ inputs.season }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          TEAM_DETAIL_LIMIT: ${{ inputs.team_detail_limit }}
          MISMATCH_DETAIL_LIMIT: ${{ inputs.mismatch_detail_limit }}
          AGG_OUTPUT_DIR: ${{ runner.temp }}/canonical-season-bullpen-aggregation-2026
        run: |
          set -euo pipefail
          mkdir -p "$AGG_OUTPUT_DIR"
          report_json="$AGG_OUTPUT_DIR/canonical-season-bullpen-aggregation-2026.json"

          validation_flag=""
          if [ "$MODE" = 'official_validation' ]; then
            validation_flag="--official-validation"
          fi

          echo "=== canonical season bullpen aggregation starting (read-only, mode=$MODE) ==="
          set +e
          python scripts/run_2026_season_bullpen_aggregation.py \
            --season "$SEASON" \
            --as-of-date "$AS_OF_DATE" \
            --team-detail-limit "$TEAM_DETAIL_LIMIT" \
            --mismatch-detail-limit "$MISMATCH_DETAIL_LIMIT" \
            $validation_flag \
            --compact \
            --output "$report_json"
          agg_exit_code=$?
          set -e

          python - "$report_json" "$agg_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          report_path = Path(sys.argv[1])
          agg_exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])

          try:
              payload = json.loads(report_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              summary_path.write_text(
                  '## Canonical Season Bullpen Aggregation\n\n'
                  f'- Exit code: `{agg_exit_code}`\n'
                  f'- Result: invalid JSON artifact (`{type(exc).__name__}`)\n',
                  encoding='utf-8',
              )
              raise SystemExit('Aggregation did not produce a valid JSON artifact.')

          local = payload.get('local_aggregation') or {}
          totals = local.get('league_totals') or {}
          recon = payload.get('reconciliations') or {}
          official = payload.get('official_validation') or {}
          lines = [
              '## Canonical Season Bullpen Aggregation',
              '',
              f"- Result: `{payload.get('result')}`",
              f"- Exit code: `{agg_exit_code}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Season: `{(payload.get('inputs') or {}).get('season')}`",
              f"- As-of date: `{(payload.get('inputs') or {}).get('as_of_date')}`",
              f"- Teams returned: `{local.get('team_count')}`",
              f"- Teams complete: `{local.get('teams_complete')}`",
              f"- Teams partial: `{local.get('teams_partial')}`",
              f"- Teams unavailable: `{local.get('teams_unavailable')}`",
              f"- Relief appearances: `{totals.get('relief_appearances')}`",
              f"- Bullpen outs: `{totals.get('bullpen_outs')}`",
              f"- Earned runs: `{totals.get('earned_runs')}`",
              f"- Team totals reconcile: `{recon.get('team_totals_reconcile')}`",
              f"- League totals reconcile: `{recon.get('league_totals_reconcile')}`",
              f"- Bullpen-outs reconcile: `{recon.get('bullpen_outs_reconcile')}`",
              f"- Official games fetched: `{official.get('games_fetched')}`",
              f"- Official API calls: `{official.get('api_calls')}`",
              f"- Teams matched: `{official.get('teams_matched')}`",
              f"- Teams mismatched: `{official.get('teams_mismatched')}`",
              f"- Mandatory mismatch count: `{official.get('mandatory_metric_mismatches')}`",
              f"- Foundation 3 status: `{payload.get('foundation_3_status')}`",
              f"- Public reader gate: `{payload.get('public_reader_gate')}`",
              f"- Share Card performance gate: `{payload.get('share_card_performance_gate')}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
          ]
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if payload.get('database_writes_performed') is not False:
              raise SystemExit('Aggregation must not perform database writes.')
          PY

          echo "=== canonical season bullpen aggregation result: exit $agg_exit_code ==="
          exit "$agg_exit_code"

      - name: Upload aggregation artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-season-bullpen-aggregation-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-season-bullpen-aggregation-2026/
          if-no-files-found: error
          retention-days: 14

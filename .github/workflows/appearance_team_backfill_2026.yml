name: Appearance Team Backfill 2026

# Foundation 2 of 6. Governed, resumable, auditable 2026 historical team-at-appearance
# backfill. Manual dispatch only — never on a schedule or push. DRY RUN IS THE DEFAULT
# (zero writes, deterministic plan + fingerprint). APPLY requires the exact
# confirmation phrase and, optionally, an approved fingerprint; both are validated
# before the job can write. The private JSON artifact is the audit record of each run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry_run / apply (backfill) or residual_audit (read-only classify)
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
          - residual_audit
      confirmation:
        description: Required for apply; must be exactly RUN_2026_APPEARANCE_TEAM_BACKFILL
        required: false
        default: ''
        type: string
      start_date:
        description: Inclusive backfill window start (official game date, YYYY-MM-DD)
        required: true
        default: '2026-01-01'
        type: string
      end_date:
        description: Inclusive backfill window end (official game date, YYYY-MM-DD)
        required: true
        default: '2026-12-31'
        type: string
      batch_size:
        description: Maximum distinct games processed this run (keyset-paginated)
        required: true
        default: '200'
        type: string
      after_game_date:
        description: Keyset cursor to resume after (YYYY-MM-DD); pair with after_game_pk
        required: false
        default: ''
        type: string
      after_game_pk:
        description: Keyset cursor to resume after (game_pk); pair with after_game_date
        required: false
        default: ''
        type: string
      expected_fingerprint:
        description: Optional approved batch fingerprint; apply is refused unless it matches
        required: false
        default: ''
        type: string
      campaign_start_date:
        description: residual_audit only — campaign window start (YYYY-MM-DD)
        required: true
        default: '2026-01-01'
        type: string
      campaign_end_date:
        description: residual_audit only — approved campaign cutoff (YYYY-MM-DD, not wall clock)
        required: true
        default: '2026-07-25'
        type: string

concurrency:
  group: appearance-team-backfill-2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate inputs and apply confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          AFTER_GAME_DATE: ${{ inputs.after_game_date }}
          AFTER_GAME_PK: ${{ inputs.after_game_pk }}
          CAMPAIGN_START_DATE: ${{ inputs.campaign_start_date }}
          CAMPAIGN_END_DATE: ${{ inputs.campaign_end_date }}
        run: |
          set -euo pipefail
          if [ "$MODE" = 'apply' ] && [ "$CONFIRMATION" != 'RUN_2026_APPEARANCE_TEAM_BACKFILL' ]; then
            echo "::error::apply mode requires confirmation=RUN_2026_APPEARANCE_TEAM_BACKFILL."
            exit 1
          fi
          if [ "$MODE" = 'apply' ] && [ -z "${EXPECTED_FINGERPRINT:-}" ]; then
            echo "::error::apply mode requires an approved dry-run fingerprint (expected_fingerprint)."
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ]; then
            echo "::error::Missing DATABASE_URL or SECRET_KEY repository secret."
            exit 1
          fi
          for value in "$START_DATE" "$END_DATE"; do
            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::start_date and end_date must use YYYY-MM-DD format."
              exit 1
            fi
          done
          if [[ ! "$BATCH_SIZE" =~ ^[0-9]+$ ]]; then
            echo "::error::batch_size must contain only digits."
            exit 1
          fi
          if [ -n "$AFTER_GAME_DATE" ] && [[ ! "$AFTER_GAME_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::after_game_date must be empty or YYYY-MM-DD."
            exit 1
          fi
          if [ -n "$AFTER_GAME_PK" ] && [[ ! "$AFTER_GAME_PK" =~ ^[0-9]+$ ]]; then
            echo "::error::after_game_pk must be empty or contain only digits."
            exit 1
          fi
          # both-or-neither cursor parts are enforced by the CLI (--after-game-date
          # / --after-game-pk), so no cross-check is needed here.
          # residual_audit is read-only: no confirmation or fingerprint is required
          # because no write is possible; only its campaign dates are validated.
          if [ "$MODE" = 'residual_audit' ]; then
            for value in "$CAMPAIGN_START_DATE" "$CAMPAIGN_END_DATE"; do
              if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::campaign_start_date and campaign_end_date must use YYYY-MM-DD format."
                exit 1
              fi
            done
          fi
          echo "Backfill inputs validated for mode=$MODE."

      - name: Run 2026 appearance-team backfill
        if: ${{ inputs.mode != 'residual_audit' }}
        working-directory: backend
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          AFTER_GAME_DATE: ${{ inputs.after_game_date }}
          AFTER_GAME_PK: ${{ inputs.after_game_pk }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          BACKFILL_OUTPUT_DIR: ${{ runner.temp }}/appearance-team-backfill-2026
        run: |
          set -euo pipefail
          mkdir -p "$BACKFILL_OUTPUT_DIR"
          report_json="$BACKFILL_OUTPUT_DIR/appearance-team-backfill-2026.json"

          backfill_command=(
            python scripts/run_2026_appearance_team_backfill.py
            --start-date "$START_DATE"
            --end-date "$END_DATE"
            --batch-size "$BATCH_SIZE"
            --compact
            --output "$report_json"
          )
          if [ "$MODE" = 'apply' ]; then
            backfill_command+=(--apply --confirm "$CONFIRMATION")
          fi
          if [ -n "$AFTER_GAME_DATE" ] && [ -n "$AFTER_GAME_PK" ]; then
            backfill_command+=(--after-game-date "$AFTER_GAME_DATE" --after-game-pk "$AFTER_GAME_PK")
          fi
          if [ -n "$EXPECTED_FINGERPRINT" ]; then
            backfill_command+=(--expected-fingerprint "$EXPECTED_FINGERPRINT")
          fi

          echo "=== 2026 appearance-team backfill starting (mode=$MODE) ==="
          set +e
          "${backfill_command[@]}"
          run_exit_code=$?
          set -e

          python - "$report_json" "$run_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          report_path = Path(sys.argv[1])
          run_exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])

          try:
              payload = json.loads(report_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              summary_path.write_text(
                  '## 2026 Appearance-Team Backfill\n\n'
                  f'- Exit code: `{run_exit_code}`\n'
                  f'- Result: invalid JSON artifact (`{type(exc).__name__}`)\n',
                  encoding='utf-8',
              )
              raise SystemExit('Backfill did not produce a valid JSON artifact.')

          coverage_after = payload.get('coverage_after') or {}
          lines = [
              '## 2026 Appearance-Team Backfill',
              '',
              f"- Exit code: `{run_exit_code}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Result: `{payload.get('result')}`",
              f"- Games selected: `{payload.get('games_selected')}`",
              f"- Appearances targeted: `{payload.get('appearances_targeted')}`",
              f"- Appearances resolved: `{payload.get('proposed_resolved')}`",
              f"- Appearances unresolved: `{payload.get('proposed_unresolved')}`",
              f"- Appearances conflict: `{payload.get('proposed_conflict')}`",
              f"- API calls: `{payload.get('api_calls')}`",
              f"- Games committed: `{payload.get('games_committed')}`",
              f"- Games failed: `{payload.get('failed_game_count')}`",
              f"- Batch fingerprint: `{payload.get('batch_fingerprint')}`",
              f"- Next cursor: `{payload.get('next_cursor')}`",
              f"- Exhausted: `{payload.get('exhausted')}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
              f"- Invalid stored states (after): `{coverage_after.get('invalid_stored_states')}`",
              f"- 2026 legacy-NULL remaining (after): `{coverage_after.get('season_null_legacy')}`",
          ]
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if int(coverage_after.get('invalid_stored_states') or 0) > 0:
              raise SystemExit('Invalid stored appearance-team states detected after the run.')
          PY

          echo "=== 2026 appearance-team backfill result: exit $run_exit_code ==="
          exit "$run_exit_code"

      - name: Upload backfill report artifact
        if: ${{ always() && inputs.mode != 'residual_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: appearance-team-backfill-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/appearance-team-backfill-2026/
          if-no-files-found: error
          retention-days: 14

      - name: Run 2026 residual appearance-team audit
        if: ${{ inputs.mode == 'residual_audit' }}
        working-directory: backend
        env:
          SEASON: '2026'
          CAMPAIGN_START_DATE: ${{ inputs.campaign_start_date }}
          CAMPAIGN_END_DATE: ${{ inputs.campaign_end_date }}
          RESIDUAL_OUTPUT_DIR: ${{ runner.temp }}/appearance-team-residual-audit-2026
        run: |
          set -euo pipefail
          mkdir -p "$RESIDUAL_OUTPUT_DIR"
          report_json="$RESIDUAL_OUTPUT_DIR/appearance-team-residual-audit-2026.json"

          echo "=== 2026 residual appearance-team audit starting (read-only) ==="
          set +e
          python scripts/run_2026_residual_audit.py \
            --season "$SEASON" \
            --campaign-start-date "$CAMPAIGN_START_DATE" \
            --campaign-end-date "$CAMPAIGN_END_DATE" \
            --compact \
            --output "$report_json"
          audit_exit_code=$?
          set -e

          python - "$report_json" "$audit_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          report_path = Path(sys.argv[1])
          audit_exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])

          try:
              payload = json.loads(report_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              summary_path.write_text(
                  '## 2026 Residual Appearance-Team Audit\n\n'
                  f'- Exit code: `{audit_exit_code}`\n'
                  f'- Result: invalid JSON artifact (`{type(exc).__name__}`)\n',
                  encoding='utf-8',
              )
              raise SystemExit('Residual audit did not produce a valid JSON artifact.')

          population = payload.get('residual_population') or {}
          coverage = payload.get('coverage') or {}
          categories = payload.get('primary_categories') or {}
          lines = [
              '## 2026 Residual Appearance-Team Audit',
              '',
              f"- Exit code: `{audit_exit_code}`",
              f"- Result: `{payload.get('result')}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Total residual rows: `{population.get('total_rows')}`",
              f"- Distinct residual games: `{population.get('distinct_games')}`",
              f"- Exact backfill-eligible rows: `{payload.get('exact_backfill_eligible_rows')}`",
              f"- Unclassified rows: `{payload.get('unclassified_rows')}`",
              f"- Category totals reconcile: `{payload.get('category_totals_reconcile')}`",
              f"- Invalid stored states: `{coverage.get('invalid_stored_states')}`",
              f"- 2026 legacy-NULL: `{coverage.get('season_null_legacy')}`",
              f"- Foundation 2 status: `{payload.get('foundation_2_status')}`",
              f"- Foundation 3 gate: `{payload.get('foundation_3_gate')}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
              '',
              '### Primary categories (row_count)',
          ]
          for name in sorted(categories):
              lines.append(f"- `{name}`: `{categories[name].get('row_count')}`")
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if payload.get('database_writes_performed') is not False:
              raise SystemExit('Residual audit must not perform database writes.')
          PY

          echo "=== 2026 residual audit result: exit $audit_exit_code ==="
          exit "$audit_exit_code"

      - name: Upload residual audit artifact
        if: ${{ always() && inputs.mode == 'residual_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: appearance-team-residual-audit-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/appearance-team-residual-audit-2026/
          if-no-files-found: error
          retention-days: 14

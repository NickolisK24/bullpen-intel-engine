name: Manual Game-Driven No-Op Write Qualification

# Manual, one-game, no-op write qualification.
#
# Proves the game-driven ingestion lane can enter its governed write-capable
# code path for exactly ONE completed game while mutating no baseball data.
#
# This workflow is deliberately isolated from BaseballOS Bullpen Sync. It has
# only workflow_dispatch: no schedule, no push, no pull_request, no
# workflow_run, no repository_dispatch, and no retry that could re-enter a
# write. Nothing in the scheduled pipeline can invoke it.
#
# What a PASS does NOT mean: it does not activate automated writes, does not
# grant authoritative publication, does not enable backfill, does not change
# the daily or postgame lanes (both remain shadow), and does not retire the
# legacy sync writer. It authorizes nothing about any future run.
#
# The lane's own completion ledger (its work item and checkpoint) DOES advance
# on the canonical write path, independently of whether the plan mutates
# anything. That is reported honestly in the evidence artifact as lane
# bookkeeping. Baseball data mutations must be exactly zero.
#
# Required repository secrets (same governed pattern as the authorized sync
# jobs): DATABASE_URL, SECRET_KEY, BASEBALLOS_ADMIN_API_TOKEN.

on:
  workflow_dispatch:
    inputs:
      game_pk:
        description: >-
          EXACTLY ONE completed MLB gamePk. One positive integer only — no
          list, no comma, no range, no date, no wildcard.
        required: true
        type: string
      expected_head_sha:
        description: >-
          Full 40-character commit SHA this qualification must run against.
          Must equal the resolved GITHUB_SHA or the run refuses.
        required: true
        type: string
      confirmation:
        description: >-
          Must be exactly QUALIFY_NOOP_GAME_<game_pk>, e.g.
          QUALIFY_NOOP_GAME_824488.
        required: true
        type: string
      operator_note:
        description: >-
          Optional free-text note for the evidence artifact. Never affects
          authorization and is sanitized before it is recorded.
        required: false
        default: ''
        type: string

# Share the production sync writer lane so this can never race a scheduled or
# manual production writer. cancel-in-progress stays false: cancelling a run
# mid-transaction is exactly what must not happen.
concurrency:
  group: baseballos-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  noop-write-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every condition is also re-validated inside the script, which trusts none
    # of these. A guard that trusts its caller is not a guard.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'NickolisK24/bullpen-intel-engine'
      && github.ref == 'refs/heads/main'
      && github.actor == github.repository_owner

    steps:
      - name: Refuse an unauthorized invocation
        env:
          GAME_PK: ${{ inputs.game_pk }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RESOLVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Exactly one positive integer. Anything with a separator, a range, a
          # date, or a wildcard is refused rather than reinterpreted.
          if ! printf '%s' "$GAME_PK" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Refused: game_pk must be exactly one positive integer."
            exit 1
          fi

          if ! printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refused: expected_head_sha must be a full 40-character hex SHA."
            exit 1
          fi

          if [ "$EXPECTED_HEAD_SHA" != "$RESOLVED_SHA" ]; then
            echo "Refused: expected_head_sha does not match the resolved commit."
            exit 1
          fi

          if [ "$CONFIRMATION" != "QUALIFY_NOOP_GAME_${GAME_PK}" ]; then
            echo "Refused: confirmation must be exactly QUALIFY_NOOP_GAME_<game_pk>."
            exit 1
          fi

          echo "Authorization preconditions satisfied."

      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the no-op write qualification
        id: qualification
        continue-on-error: true
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          # The lane mode is supplied by the qualification itself, per phase.
          # It is deliberately NOT set here: every other step in this job keeps
          # the deployed default of off.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -uo pipefail
          cd backend
          exit_code=0
          python scripts/run_game_driven_noop_qualification.py \
            --game-pk "${{ inputs.game_pk }}" \
            --expected-head-sha "${{ inputs.expected_head_sha }}" \
            --confirmation "${{ inputs.confirmation }}" \
            --operator-note "${{ inputs.operator_note }}" \
            --artifact-dir ../artifacts/manual-noop-write-qualification \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          # Exit with the qualification's own code so this step's outcome is
          # its real verdict. continue-on-error keeps the job going so the
          # evidence is still scanned and uploaded; the final gate re-fails.
          exit "$exit_code"

      # The artifact is scanned BEFORE it is uploaded, using the one shared
      # forbidden-content contract. An unsafe or unreadable artifact is never
      # published.
      - name: Scan the evidence artifact
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          exit_code=0
          python backend/scripts/scan_forbidden_artifact_content.py \
            --directory artifacts/manual-noop-write-qualification \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Upload the evidence artifact
        id: upload
        continue-on-error: true
        if: ${{ steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: game-driven-noop-qualification-${{ github.run_id }}
          path: artifacts/manual-noop-write-qualification
          retention-days: 30
          if-no-files-found: error

      - name: Append the qualification summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          path = pathlib.Path(
              'artifacts/manual-noop-write-qualification/qualification-summary.json'
          )
          print('## Manual no-op write qualification\n')
          if not path.exists():
              print('No evidence document was produced. Result: UNPROVEN.')
              raise SystemExit(0)

          doc = json.loads(path.read_text(encoding='utf-8'))
          identity = doc.get('identity') or {}
          verdict = doc.get('verdict') or {}
          execution = doc.get('execution') or {}
          plan = doc.get('plan') or {}
          scope = plan.get('scope') or {}
          post = doc.get('post_execution') or {}
          baseball = execution.get('baseball_data_effects') or {}
          ledger = execution.get('lane_bookkeeping_effects') or {}

          print(f"**Verdict: {verdict.get('result')}**\n")
          print('| field | value |')
          print('| :--- | :--- |')
          print(f"| qualification type | `{identity.get('qualification_type')}` |")
          print(f"| requested game | {identity.get('requested_game_pk')} |")
          print(f"| commit | `{identity.get('commit_sha')}` |")
          print(f"| exact scope match | {scope.get('execution_scope_exact_match')} |")
          print(f"| finality proven | "
                f"{(doc.get('game_authority') or {}).get('finality_proven_by_planner')} |")
          print(f"| planned rows | {(plan.get('write_plan') or {}).get('planned_row_count')} |")
          print(f"| planned already matching | "
                f"{(plan.get('write_plan') or {}).get('planned_unchanged_count')} |")
          print(f"| source revision match | "
                f"{(doc.get('game_authority') or {}).get('source_revision_match')} |")
          print(f"| plan fingerprint match | {plan.get('plan_fingerprint_match')} |")
          print(f"| before/after digest match | {post.get('state_digest_match')} |")
          print(f"| realization all matching | {post.get('already_matching_rows')} |")
          print(f"| artifact | game-driven-noop-qualification-{identity.get('workflow_run_id')} |")

          print('\n**Baseball data effects (all must be zero)**\n')
          print('| counter | value |')
          print('| :--- | ---: |')
          for key in sorted(baseball):
              print(f'| `{key}` | {baseball[key]} |')

          print('\n**Lane completion ledger (not baseball data)**\n')
          print('| counter | value |')
          print('| :--- | ---: |')
          for key in sorted(ledger):
              print(f'| `{key}` | {ledger[key]} |')

          for reason in verdict.get('failed_reasons') or ():
              print(f'\n- FAILED: `{reason}`')
          for reason in verdict.get('unproven_reasons') or ():
              print(f'\n- UNPROVEN: `{reason}`')

          print(f"\n{verdict.get('non_authorization_statement')}")
          PY

      # The final gate runs AFTER the artifact was scanned and uploaded, so a
      # failing qualification still leaves reviewable evidence behind. A missing
      # scan or a failed upload is UNPROVEN, never PASS.
      - name: Final qualification gate
        run: |
          set -euo pipefail

          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "UNPROVEN: the evidence artifact could not be proven safe."
            exit 1
          fi

          if [ "${{ steps.upload.outcome }}" != "success" ]; then
            echo "UNPROVEN: the evidence artifact did not upload."
            exit 1
          fi

          if [ "${{ steps.qualification.outcome }}" != "success" ]; then
            echo "The qualification did not return PASS. See the artifact."
            exit 1
          fi

          echo "Manual no-op write qualification: PASS."
          echo "This does not authorize scheduled writes, automated writes,"
          echo "authoritative publication, backfill, or future mutations."

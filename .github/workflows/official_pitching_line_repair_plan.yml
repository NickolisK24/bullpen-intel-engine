name: Official Pitching-Line Repair Plan (2026)

# Dispatch-only, READ-ONLY planner. It produces a reviewable repair manifest describing
# which official MLB identities must exist, which official pitching lines have no local
# GameLog, and which stored rows differ from official evidence. It plans only: there is no
# apply input, no fingerprint-acceptance input, and no database mutation command anywhere in
# this workflow. The full manifest ships in the private artifact; the step summary carries a
# bounded preview only.

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        default: '2026'
        type: string
      as_of_date:
        description: As-of date (YYYY-MM-DD), inclusive
        required: true
        default: '2026-07-25'
        type: string
      preview_limit:
        description: Bounded step-summary preview size (0-500); does not affect the manifest
        required: true
        default: '100'
        type: string
      team_id:
        description: Optional MLB team id (blank = all teams). Scoped runs are not apply eligible.
        required: false
        default: ''
        type: string
      game_pk:
        description: Optional MLB gamePk (blank = all games). Scoped runs are not apply eligible.
        required: false
        default: ''
        type: string

concurrency:
  group: official-pitching-line-repair-plan-2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate repair-plan inputs
        env:
          SEASON: ${{ inputs.season }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          PREVIEW_LIMIT: ${{ inputs.preview_limit }}
          TEAM_ID: ${{ inputs.team_id }}
          GAME_PK: ${{ inputs.game_pk }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || \
             [ -z "${SECRET_KEY:-}" ] || \
             [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          if ! [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then
            echo "::error::season must be a four-digit year."
            exit 1
          fi
          if ! [[ "$AS_OF_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::as_of_date must be YYYY-MM-DD."
            exit 1
          fi
          if ! [[ "$PREVIEW_LIMIT" =~ ^[0-9]{1,3}$ ]] || [ "$PREVIEW_LIMIT" -gt 500 ]; then
            echo "::error::preview_limit must be an integer between 0 and 500."
            exit 1
          fi
          if [ -n "$TEAM_ID" ] && ! [[ "$TEAM_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::team_id must contain only digits when provided."
            exit 1
          fi
          if [ -n "$GAME_PK" ] && ! [[ "$GAME_PK" =~ ^[0-9]+$ ]]; then
            echo "::error::game_pk must contain only digits when provided."
            exit 1
          fi
          echo "Read-only official pitching-line repair-plan inputs validated."

      - name: Generate read-only repair plan
        working-directory: backend
        env:
          SEASON: ${{ inputs.season }}
          AS_OF_DATE: ${{ inputs.as_of_date }}
          PREVIEW_LIMIT: ${{ inputs.preview_limit }}
          TEAM_ID: ${{ inputs.team_id }}
          GAME_PK: ${{ inputs.game_pk }}
          PLAN_OUTPUT_DIR: ${{ runner.temp }}/official-pitching-line-repair-plan-2026
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_OUTPUT_DIR"
          report_json="$PLAN_OUTPUT_DIR/official-pitching-line-repair-plan-2026.json"

          optional_args=()
          if [ -n "$TEAM_ID" ]; then
            optional_args+=(--team-id "$TEAM_ID")
          fi
          if [ -n "$GAME_PK" ]; then
            optional_args+=(--game-pk "$GAME_PK")
          fi

          set +e
          python scripts/run_official_pitching_line_repair_plan_2026.py \
            --season "$SEASON" \
            --as-of-date "$AS_OF_DATE" \
            --preview-limit "$PREVIEW_LIMIT" \
            "${optional_args[@]}" \
            --compact \
            --output "$report_json"
          plan_exit_code=$?
          set -e

          python - "$report_json" "$plan_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding='utf-8'))
          reconciliations = payload.get('reconciliations') or {}
          actions_by_type = payload.get('actions_by_type') or {}
          blocking = payload.get('blocking_counts_by_reason') or {}
          coverage = payload.get('workload_field_coverage') or {}
          no_action = payload.get('no_action_confirmations') or {}
          preview = payload.get('bounded_preview') or []
          baseline = payload.get('baseline_comparison') or {}

          summary = [
              '## Official Pitching-Line Repair Plan (2026)',
              '',
              f"- Result: `{payload.get('result')}`",
              f"- Exit code: `{exit_code}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Plan status: `{payload.get('plan_status')}`",
              f"- Plan scope: `{payload.get('plan_scope')}`",
              f"- Repair apply gate: `{payload.get('repair_apply_gate')}`",
              f"- Decision reasons: `{payload.get('decision_reasons')}`",
              f"- Baseline matches accepted diagnostic: "
              f"`{payload.get('baseline_matches_accepted_diagnostic')}`",
              f"- Official pitching lines: `{payload.get('official_pitching_lines')}`",
              f"- Exact matches: `{payload.get('exact_match_count')}`",
              f"- Missing lines: `{payload.get('missing_line_count')}`",
              f"- Defective matched lines: `{payload.get('defective_matched_line_count')}`",
              f"- Defect-line action count: `{payload.get('defect_line_action_count')}`",
              f"- Unique identities requiring creation: "
              f"`{payload.get('unique_identities_requiring_creation')}`",
              f"- Missing lines dependent on identity creation: "
              f"`{payload.get('missing_lines_dependent_on_identity_creation')}`",
              f"- Missing lines using an existing identity: "
              f"`{payload.get('missing_lines_using_existing_identity')}`",
              f"- GameLog inserts planned: `{payload.get('game_log_inserts_planned')}`",
              f"- Existing GameLogs requiring updates: "
              f"`{payload.get('existing_game_logs_requiring_updates')}`",
              f"- Role corrections planned: `{payload.get('role_corrections_planned')}`",
              f"- Stat correction rows planned: `{payload.get('stat_correction_rows_planned')}`",
              f"- Repair manifest action count: "
              f"`{payload.get('repair_manifest_action_count')}`",
              f"- Repair manifest fingerprint: "
              f"`{payload.get('repair_manifest_fingerprint')}`",
              f"- Prior production fingerprint: "
              f"`{payload.get('prior_production_manifest_fingerprint')}`",
              f"- Preview limit: `{payload.get('preview_limit')}` "
              f"(truncated: `{payload.get('preview_truncated')}`)",
              f"- Foundation 3B gate: `{payload.get('foundation_3b_gate')}`",
              f"- Public reader gate: `{payload.get('public_reader_gate')}`",
              f"- Share Card performance gate: "
              f"`{payload.get('share_card_performance_gate')}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
              '',
              '### Actions by type',
          ]
          summary.extend(f"- `{name}`: `{count}`" for name, count in sorted(actions_by_type.items()))
          summary.extend(('', '### No-action confirmations'))
          summary.extend(f"- `{name}`: `{count}`" for name, count in sorted(no_action.items()))
          summary.extend(('', '### Workload field coverage'))
          summary.extend(f"- `{name}`: `{count}`" for name, count in sorted(coverage.items()))
          summary.extend(('', '### Blocking reasons'))
          summary.extend(f"- `{name}`: `{count}`" for name, count in sorted(blocking.items()))
          summary.extend(('', '### Baseline comparison'))
          summary.extend(
              f"- `{name}`: expected `{item.get('expected_value')}` observed "
              f"`{item.get('observed_value')}` difference `{item.get('difference')}`"
              for name, item in sorted(baseline.items())
          )
          summary.extend(('', '### Reconciliations'))
          summary.extend(f"- `{name}`: `{value}`" for name, value in sorted(reconciliations.items()))
          summary.extend(('', '### Bounded manifest preview (first 25)'))
          summary.extend(
              f"- `{item.get('action_id')}` · `{item.get('action_type')}` · "
              f"safe_to_apply `{item.get('safe_to_apply')}` · "
              f"blocking `{item.get('blocking_reasons')}`"
              for item in preview[:25]
          )
          summary.append('')
          summary.append(
              'The full repair manifest is in the private artifact and is never truncated.')
          summary_path.write_text('\n'.join(summary) + '\n', encoding='utf-8')

          if payload.get('database_writes_performed') is not False:
              raise SystemExit('Repair plan must not perform database writes.')
          if payload.get('mode') != 'read_only':
              raise SystemExit('Repair plan must run in read_only mode.')
          PY

          exit "$plan_exit_code"

      - name: Upload private repair-plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-pitching-line-repair-plan-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/official-pitching-line-repair-plan-2026/
          if-no-files-found: error
          retention-days: 14

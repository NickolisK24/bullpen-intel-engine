name: Foundation 3C R5 Remaining Window Shadow Authorization

# THE FINAL READ-ONLY GATE BEFORE A 99-GAME PRODUCTION WRITE.
#
# R4 wrote five games and left production at 10 completed / 99 unresolved. R5
# runs the ENTIRE remaining window — all 99 — in one shadow pass and produces
# the reviewed authorization package R6 will be built from.
#
# Read-only in every sense that matters: `--mode shadow`, no checkpoint, no work
# item, no publication. Both state snapshots set the transaction read-only and
# require a write probe to be REFUSED before reading a row, and the validator
# fails on any difference between them.
#
# THE SCOPE IS HARD-CODED BELOW AND NOWHERE ELSE. It is not read from a workflow
# input, an API, an environment variable, a database query, a previous run's
# artifact, or a command substitution. The production database is used to VERIFY
# this list, never to define it. There are no inputs at all, so there is nothing
# to redirect from a phone: not the date, not the game set, not the mode.
#
# ONE PASS, NO SUBDIVISION. No `--max-games`, no `--time-budget-seconds`, no
# batching. Both of those options are already refused by the CLI under exclusive
# scope, and both default to None, so nothing can truncate the run silently. A
# run that stopped early would be `status: incomplete` and would fail.
#
# Concurrency joins `baseballos-sync`, the repository's existing production
# write-serialization group. R5 does not write, but its authorization is only
# meaningful if production held still while it was produced — so it must not run
# beside the scheduled sync, intraday repair, or R4.

on:
  workflow_dispatch:

concurrency:
  group: baseballos-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r5-remaining-window-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      # The scheduled lane stays disabled throughout. The single shadow command
      # below is explicit and is the only ingestion invocation in this workflow.
      GAME_DRIVEN_INGESTION_MODE: 'off'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
      REFERENCE_DATE: '2026-07-29'
      BEFORE_STATE_PATH: artifacts/r5-before-state.json
      SHADOW_PATH: artifacts/r5-remaining-window-shadow.json
      AFTER_STATE_PATH: artifacts/r5-after-state.json
      SUMMARY_JSON_PATH: artifacts/r5-validation-summary.json
      SUMMARY_MARKDOWN_PATH: artifacts/r5-validation-summary.md
      AUTHORIZATION_JSON_PATH: artifacts/r5-reviewed-authorization.json
      AUTHORIZATION_MARKDOWN_PATH: artifacts/r5-reviewed-authorization.md
      MANIFEST_JSON_PATH: artifacts/r5-r6-command-manifest.json
      MANIFEST_MARKDOWN_PATH: artifacts/r5-r6-command-manifest.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate required secrets are present
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] \
             || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          echo "Required production secrets are present."

      - name: Create the artifacts directory
        run: |
          set -euo pipefail
          mkdir -p artifacts

      - name: Capture the before state
        id: before
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/inspect_r5_remaining_state.py --phase before --output "$BEFORE_STATE_PATH"
          before_exit=$?
          set -e
          echo "before_exit=$before_exit" >> "$GITHUB_OUTPUT"

      # The one and only ingestion invocation. Shadow, exclusive, whole window.
      - name: Run the exact 99-game remaining-window shadow
        id: shadow
        if: ${{ steps.before.outputs.before_exit == '0' }}
        run: |
          set -euo pipefail

          # The reviewed R5 scope, in canonical processing order. Literal
          # values only — nothing here is derived at runtime.
          R5_GAME_PKS=(
            823519
            822784
            824732
            824896
            822873
            824166
            824650
            824893
            824406
            822785
            823042
            824247
            823759
            823352
            824248
            822707
            823434
            824812
            822952
            823601
            823843
            824733
            824573
            822872
            823680
            823031
            823196
            824244
            822704
            823197
            823841
            824734
            823435
            822948
            823355
            824811
            823679
            823758
            824571
            822869
            823027
            823600
            822950
            822706
            823354
            824730
            824810
            823599
            823840
            824246
            823678
            823755
            824572
            823028
            822870
            823194
            823433
            822868
            823353
            823839
            824245
            822705
            823597
            824570
            823025
            824001
            824977
            823195
            824490
            822949
            823350
            823838
            824243
            822703
            824489
            823676
            824569
            823026
            824003
            823275
            824976
            823193
            823923
            823837
            823351
            822702
            823596
            824242
            823192
            823273
            822947
            823598
            824487
            823677
            824567
            823022
            824002
            824973
            823924
          )

          # Refuse to run a scope that is not exactly 99 unique games. A typo
          # that dropped or duplicated a line would otherwise produce a
          # confident report about the wrong window.
          if [ "${#R5_GAME_PKS[@]}" -ne 99 ]; then
            echo "::error::R5 scope must contain exactly 99 games."
            exit 1
          fi
          unique_count=$(printf '%s\n' "${R5_GAME_PKS[@]}" | sort -u | wc -l)
          if [ "$unique_count" -ne 99 ]; then
            echo "::error::R5 scope contains duplicate game identifiers."
            exit 1
          fi

          scope_args=()
          for game_pk in "${R5_GAME_PKS[@]}"; do
            scope_args+=(--only-game-pk "$game_pk")
          done

          set +e
          python backend/scripts/game_driven_ingestion.py \
            --mode shadow \
            --reference-date "$REFERENCE_DATE" \
            "${scope_args[@]}" \
            --output "$SHADOW_PATH"
          shadow_exit=$?
          set -e
          echo "shadow_exit=$shadow_exit" >> "$GITHUB_OUTPUT"

      - name: Capture the after state
        id: after
        if: ${{ always() && steps.before.outputs.before_exit == '0' }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/inspect_r5_remaining_state.py --phase after --output "$AFTER_STATE_PATH"
          after_exit=$?
          set -e
          echo "after_exit=$after_exit" >> "$GITHUB_OUTPUT"

      - name: Validate the complete R5 report and state comparison
        id: validate
        if: ${{ always() }}
        env:
          REPOSITORY_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/validate_r5_remaining_shadow.py \
            --before-state "$BEFORE_STATE_PATH" \
            --shadow "$SHADOW_PATH" \
            --after-state "$AFTER_STATE_PATH" \
            --summary-json "$SUMMARY_JSON_PATH" \
            --summary-markdown "$SUMMARY_MARKDOWN_PATH" \
            --authorization-json "$AUTHORIZATION_JSON_PATH" \
            --authorization-markdown "$AUTHORIZATION_MARKDOWN_PATH" \
            --manifest-json "$MANIFEST_JSON_PATH" \
            --manifest-markdown "$MANIFEST_MARKDOWN_PATH" \
            --repository-sha "$REPOSITORY_SHA" \
            --run-id "$WORKFLOW_RUN_ID"
          validate_exit=$?
          set -e
          echo "validate_exit=$validate_exit" >> "$GITHUB_OUTPUT"

      - name: Scan artifacts for credential-shaped content
        id: scan
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          # Fail closed on anything credential-shaped reaching an artifact. The
          # matched text is never printed — only the filename and the category.
          forbidden = re.compile(
              r'postgresql://|postgres://|password\s*=|Authorization\s*:'
              r'|X-Admin-Token|ADMIN_API_TOKEN|SECRET_KEY|DATABASE_URL'
              r'|BASEBALLOS_ADMIN_API_TOKEN'
              r'|token\s*=|api[_-]?key\s*=|secret\s*=',
              re.IGNORECASE,
          )
          leaked = []
          for path in sorted(Path('artifacts').glob('*')):
              if path.is_file() and forbidden.search(path.read_text(errors='ignore')):
                  leaked.append(path.name)
                  path.unlink()
          if leaked:
              print(f"::error::Sanitization check failed for: {', '.join(leaked)}")
              raise SystemExit(1)
          print('Artifact sanitization check passed.')
          PY

      - name: Write the job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f "$SUMMARY_MARKDOWN_PATH" ]; then
            cat "$SUMMARY_MARKDOWN_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## FOUNDATION 3C R5 — FAILED'
              echo
              echo '- Failed invariant: `validation_produced_no_summary`'
              echo '- Artifact: `foundation-3c-r5-remaining-window-shadow`'
              echo '- No database writes were performed.'
              echo
              echo 'R6 is blocked pending founder review.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the R5 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-3c-r5-remaining-window-shadow
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the job unless R5 passed
        if: ${{ always() }}
        env:
          VALIDATE_EXIT: ${{ steps.validate.outputs.validate_exit }}
        run: |
          set -euo pipefail
          if [ "${VALIDATE_EXIT:-2}" != "0" ]; then
            echo "::error::R5 failed; see the job summary. R6 is blocked."
            exit 1
          fi
          echo "R5 passed. Review the authorization package before implementing R6."

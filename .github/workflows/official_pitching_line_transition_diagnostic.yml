name: Official Pitching-Line Transition Diagnostic (2026)

# Dispatch-only, READ-ONLY forensic diagnostic for ONE moved pitching line: official MLB
# person 805299 in game 825058 for official team 109, stored locally as GameLog 43765. It
# answers only which side of that line changed after the accepted diagnostic ran.
#
# It diagnoses. It never repairs. There is no apply input, no fingerprint-acceptance input, no
# baseline amendment, and no database mutation command anywhere in this workflow. The target
# is fixed in the service and cannot be redirected from here. The complete artifact ships
# privately; the step summary carries a bounded view only.

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: >-
          Type the fixed target key to confirm: 825058:805299:109
        required: true
        default: ''
        type: string

concurrency:
  group: official-pitching-line-transition-diagnostic-2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate diagnostic inputs
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || \
             [ -z "${SECRET_KEY:-}" ] || \
             [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          if [ "$CONFIRM_TARGET" != "825058:805299:109" ]; then
            echo "::error::confirm_target must be exactly 825058:805299:109."
            exit 1
          fi
          echo "Read-only transition-diagnostic inputs validated."

      - name: Run read-only transition diagnostic
        working-directory: backend
        env:
          REPORT_DIR: ${{ runner.temp }}/official-pitching-line-transition-diagnostic-2026
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          report_json="$REPORT_DIR/official-pitching-line-transition-diagnostic-2026.json"

          set +e
          python scripts/run_official_pitching_line_transition_diagnostic_2026.py \
            --compact \
            --output "$report_json"
          diagnostic_exit_code=$?
          set -e

          python - "$report_json" "$diagnostic_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding='utf-8'))
          target = payload.get('target') or {}
          comparison = payload.get('current_comparison') or {}
          official_change = payload.get('official_change_evidence') or {}
          local_change = payload.get('local_change_evidence') or {}
          reconciliations = payload.get('reconciliations') or {}
          sources = payload.get('historical_evidence_sources_checked') or []
          questions = payload.get('unresolved_questions') or []

          summary = [
              '## Official Pitching-Line Transition Diagnostic (2026)',
              '',
              f"- Result: `{payload.get('result')}`",
              f"- Exit code: `{exit_code}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Classification: `{payload.get('authority_transition_classification')}`",
              f"- Confidence: `{payload.get('confidence')}`",
              f"- Decision reasons: `{payload.get('decision_reasons')}`",
              '',
              '### Target',
              f"- Game: `{target.get('mlb_game_pk')}` on `{target.get('game_date')}`",
              f"- Official person: `{target.get('official_mlb_person_id')}`",
              f"- Appearance team: `{target.get('appearance_team_id')}`",
              f"- Local GameLog: `{target.get('local_game_log_id')}`",
              f"- Field: `{target.get('field')}`",
              '',
              '### Current comparison',
              f"- Current official value: `{comparison.get('current_official_value')}`",
              f"- Current local value: `{comparison.get('current_local_value')}`",
              f"- Values differ: `{comparison.get('values_differ')}`",
              f"- Proves which side changed: "
              f"`{comparison.get('proves_which_side_changed')}`",
              '',
              '### Historical evidence',
              f"- Evidence found: `{payload.get('historical_evidence_found')}`",
              f"- Prior official value retained: "
              f"`{official_change.get('prior_official_value_retained')}`",
              f"- Prior local value retained: "
              f"`{local_change.get('prior_local_value_retained')}`",
              f"- Row was corrected after ingestion: "
              f"`{local_change.get('row_was_corrected_after_ingestion')}`",
              '',
              '#### Sources checked',
          ]
          summary.extend(f"- `{name}`" for name in sources)
          summary.extend(('', '### Unresolved questions'))
          summary.extend(f"- {item.get('question')}" for item in questions)
          summary.extend(('', '### Reconciliations'))
          summary.extend(
              f"- `{name}`: `{value}`" for name, value in sorted(reconciliations.items()))
          summary.extend((
              '',
              f"- Accepted defect baseline modified: "
              f"`{payload.get('accepted_defect_baseline_modified')}`",
              f"- Repair actions applied: `{payload.get('repair_actions_applied')}`",
              f"- Approved fingerprints: `{payload.get('approved_manifest_fingerprints')}`",
              f"- Repair apply gate: `{payload.get('repair_apply_gate')}`",
              f"- Foundation 3B gate: `{payload.get('foundation_3b_gate')}`",
              f"- Public reader gate: `{payload.get('public_reader_gate')}`",
              f"- Share Card performance gate: "
              f"`{payload.get('share_card_performance_gate')}`",
              f"- Database writes performed: "
              f"`{payload.get('database_writes_performed')}`",
              '',
              'The complete evidence artifact is private and is never truncated.',
          ))
          summary_path.write_text('\n'.join(summary) + '\n', encoding='utf-8')

          if payload.get('database_writes_performed') is not False:
              raise SystemExit('Transition diagnostic must not perform database writes.')
          if payload.get('mode') != 'read_only':
              raise SystemExit('Transition diagnostic must run in read_only mode.')
          if payload.get('approved_manifest_fingerprints'):
              raise SystemExit('Transition diagnostic must approve no fingerprint.')
          if payload.get('accepted_defect_baseline_modified') is not False:
              raise SystemExit('Transition diagnostic must not modify the accepted baseline.')
          PY

          exit "$diagnostic_exit_code"

      - name: Upload private transition-diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-pitching-line-transition-diagnostic-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/official-pitching-line-transition-diagnostic-2026/
          if-no-files-found: error
          retention-days: 14

name: Phantom GameLog Reconciliation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; apply requires approved fingerprint and confirmation
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      game_log_id:
        description: Exact GameLog primary key
        required: true
        default: '41040'
        type: string
      game_pk:
        description: Expected MLB gamePk guard
        required: true
        default: '824262'
        type: string
      game_date:
        description: Expected official game date guard (YYYY-MM-DD)
        required: true
        default: '2026-06-23'
        type: string
      pitcher_mlb_id:
        description: Expected stable MLB pitcher id guard
        required: true
        default: '445276'
        type: string
      confirmation:
        description: Apply only — exact production confirmation phrase
        required: false
        default: ''
        type: string
      expected_fingerprint:
        description: Apply only — exact approved dry-run fingerprint
        required: false
        default: ''
        type: string

concurrency:
  group: phantom-game-log-reconciliation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate guarded inputs
        env:
          MODE: ${{ inputs.mode }}
          GAME_LOG_ID: ${{ inputs.game_log_id }}
          GAME_PK: ${{ inputs.game_pk }}
          GAME_DATE: ${{ inputs.game_date }}
          PITCHER_MLB_ID: ${{ inputs.pitcher_mlb_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          if [ "$MODE" != 'dry_run' ] && [ "$MODE" != 'apply' ]; then
            echo "::error::mode must be dry_run or apply."
            exit 1
          fi
          for value in "$GAME_LOG_ID" "$GAME_PK" "$PITCHER_MLB_ID"; do
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::identity guards must contain only digits."
              exit 1
            fi
          done
          if ! [[ "$GAME_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::game_date must be YYYY-MM-DD."
            exit 1
          fi
          if [ "$MODE" = 'apply' ]; then
            if [ "$CONFIRMATION" != 'RUN_PHANTOM_GAME_LOG_RECONCILIATION' ]; then
              echo "::error::Apply confirmation phrase is incorrect."
              exit 1
            fi
            if ! [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Apply requires a 64-character lowercase SHA-256 fingerprint."
              exit 1
            fi
          fi
          echo "Guarded phantom GameLog reconciliation inputs validated."

      - name: Run guarded reconciliation
        working-directory: backend
        env:
          MODE: ${{ inputs.mode }}
          GAME_LOG_ID: ${{ inputs.game_log_id }}
          GAME_PK: ${{ inputs.game_pk }}
          GAME_DATE: ${{ inputs.game_date }}
          PITCHER_MLB_ID: ${{ inputs.pitcher_mlb_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
          OUTPUT_DIR: ${{ runner.temp }}/phantom-game-log-reconciliation
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          report_json="$OUTPUT_DIR/phantom-game-log-reconciliation.json"
          apply_args=()
          if [ "$MODE" = 'apply' ]; then
            apply_args=(
              --apply
              --confirmation "$CONFIRMATION"
              --expected-fingerprint "$EXPECTED_FINGERPRINT"
            )
          fi

          set +e
          python scripts/run_phantom_game_log_reconciliation.py \
            --game-log-id "$GAME_LOG_ID" \
            --game-pk "$GAME_PK" \
            --game-date "$GAME_DATE" \
            --pitcher-mlb-id "$PITCHER_MLB_ID" \
            "${apply_args[@]}" \
            --compact \
            --output "$report_json"
          reconciliation_exit_code=$?
          set -e

          python - "$report_json" "$reconciliation_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding='utf-8'))
          plan = payload.get('plan') or {}
          target = plan.get('target') or {}
          official = plan.get('official_evidence') or {}
          stats = target.get('zero_stat_signature') or {}
          lines = [
              '## Phantom GameLog Reconciliation',
              '',
              f"- Result: `{payload.get('result')}`",
              f"- Exit code: `{exit_code}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Decision reasons: `{payload.get('decision_reasons')}`",
              f"- GameLog id: `{target.get('game_log_id')}`",
              f"- GamePk: `{target.get('game_pk')}`",
              f"- Game date: `{target.get('game_date')}`",
              f"- Pitcher: `{target.get('pitcher_name')}` (`{target.get('pitcher_mlb_id')}`)",
              f"- Stored zero-stat signature: `{stats}`",
              f"- Official pitching line count: `{official.get('pitching_line_count')}`",
              f"- Target pitcher present in official pitching lines: `{official.get('target_pitcher_present')}`",
              f"- Proposed action: `{plan.get('proposed_action')}`",
              f"- Fingerprint: `{plan.get('fingerprint')}`",
              f"- Rows deleted: `{payload.get('rows_deleted', 0)}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
          ]
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          exit "$reconciliation_exit_code"

      - name: Upload private reconciliation artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phantom-game-log-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/phantom-game-log-reconciliation/
          if-no-files-found: error
          retention-days: 14

name: Manual Game 824487 Source Revision Audit

# Read-only diagnostic for ONE game and TWO retained scheduled daily runs.
#
# Game 824487 (represented date 2026-07-29) recorded two different source
# revisions across scheduled daily runs 30902544622 and 30999087370 while
# agreeing on everything else about it: 12 appearances both times, all 12
# classified unchanged both times, and an identical per-game
# reconciliation-plan fingerprint both times. The later run's shadow activation
# observer FAILED on source_revision_match even though the public daily sync
# succeeded, snapshot 353 was published and served, the appearance ledger
# reconciled completely, and the game-driven shadow lane completed all 94
# planned games with zero writes.
#
# A source revision is NOT a hash of the raw MLB response. It is
# game_appearance_extraction.appearance_set_fingerprint — SHA-256 over the
# deterministic normalized appearance matrix over 14 governed fields. Two
# digests prove that the normalized input or its code path changed; they cannot
# reveal WHICH field, because SHA-256 is not invertible. This audit never
# guesses one.
#
# It is read-only three ways: the acquire-only public sync advisory lock, a
# PostgreSQL read-only transaction with a bounded write probe that must be
# REFUSED, and before/after full-content fingerprints across every scope the
# game touches. It does not rerun either historical daily sync, does not repair
# game 824487, does not update its source revision, does not reset its
# checkpoint, does not publish or select a snapshot, and does not change any
# mode or authority.

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: >-
          Full 40-character lowercase commit SHA on main this audit must run
          against. Must equal the resolved GITHUB_SHA or the run refuses. This
          is the commit the AUDIT runs at; both incident head SHAs are locked
          in code.
        required: true
        type: string
      confirmation:
        description: >-
          Must be exactly AUDIT_GAME_824487_SOURCE_REVISION_30999087370.
        required: true
        type: string
      operator_note:
        description: >-
          Optional note for the evidence artifact. Informational only: it can
          never affect authorization or any verdict, and is sanitized before it
          is recorded.
        required: false
        default: ''
        type: string

# Share the production sync writer lane so the audit can never overlap a
# production writer. cancel-in-progress stays false.
concurrency:
  group: baseballos-sync
  cancel-in-progress: false

# contents: read to check out the reviewed commit and read repository history
#           at both incident SHAs.
# actions:  read to DOWNLOAD both incident runs' artifacts by run id.
# Nothing here writes to contents, actions, packages, or any other scope.
permissions:
  contents: read
  actions: read

jobs:
  source-revision-audit:
    runs-on: ubuntu-latest
    # Bounded by two artifact downloads, one symbol-level history comparison,
    # two fingerprint passes, and at most two upstream MLB calls.
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'NickolisK24/bullpen-intel-engine'
      && github.ref == 'refs/heads/main'
      && github.actor == github.repository_owner

    steps:
      # SHELL BOUNDARY (established in PR #604). No `${{ }}` expression may
      # appear inside any `run:` script: GitHub substitutes into the script text
      # before bash parses it, so an expression holding operator input becomes
      # shell code in a step carrying production credentials. Every input
      # crosses through env: and is read only as a quoted variable.
      - name: Refuse an unauthorized invocation
        env:
          INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_OPERATOR_NOTE: ${{ inputs.operator_note }}
          RESOLVED_SHA: ${{ github.sha }}
          RESOLVED_REPOSITORY: ${{ github.repository }}
          RESOLVED_REF: ${{ github.ref }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY_PRESENT: ${{ secrets.SECRET_KEY }}
          SECRET_ADMIN_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$RESOLVED_REPOSITORY" != "NickolisK24/bullpen-intel-engine" ]; then
            echo "Refused: this audit runs only in NickolisK24/bullpen-intel-engine."
            exit 1
          fi

          if [ "$RESOLVED_REF" != "refs/heads/main" ]; then
            echo "Refused: this audit runs only from main."
            exit 1
          fi

          if ! printf '%s' "$INPUT_EXPECTED_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refused: expected_main_sha must be 40 lowercase hex characters."
            exit 1
          fi

          if [ "$INPUT_EXPECTED_MAIN_SHA" != "$RESOLVED_SHA" ]; then
            echo "Refused: expected_main_sha does not match the resolved commit."
            exit 1
          fi

          if [ "$INPUT_CONFIRMATION" != "AUDIT_GAME_824487_SOURCE_REVISION_30999087370" ]; then
            echo "Refused: confirmation must be exactly AUDIT_GAME_824487_SOURCE_REVISION_30999087370."
            exit 1
          fi

          # Every secret the audit needs must be present BEFORE any artifact is
          # downloaded or any database session is opened. Presence only: no
          # value is echoed, compared, or recorded.
          if [ -z "${SECRET_DATABASE_URL:-}" ]; then
            echo "Refused: DATABASE_URL secret is absent."
            exit 1
          fi
          if [ -z "${SECRET_KEY_PRESENT:-}" ]; then
            echo "Refused: SECRET_KEY secret is absent."
            exit 1
          fi
          if [ -z "${SECRET_ADMIN_TOKEN:-}" ]; then
            echo "Refused: BASEBALLOS_ADMIN_API_TOKEN secret is absent."
            exit 1
          fi

          # The note is never interpreted, expanded, or used in a decision.
          printf 'Operator note supplied: %s characters.\n' \
            "$(printf '%s' "$INPUT_OPERATOR_NOTE" | wc -c)"

          echo "Authorization preconditions satisfied."
          echo "Scope is locked in code: game 824487, runs 30902544622 and 30999087370."

      # Full history: the audit compares code at BOTH incident head SHAs, so a
      # shallow clone would make Question 3 unprovable rather than answered.
      - name: Check out the reviewed commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # ── Incident evidence, addressed by EXACT run id and EXACT name ───────
      # Both downloads happen BEFORE the database advisory lock is acquired, so
      # a slow or failing artifact fetch can never hold the public sync writer
      # lane. Each download is non-blocking: a missing REQUIRED artifact must
      # become an UNPROVEN verdict inside the evidence document — where a
      # reader can see which artifact was absent — not a bare step failure that
      # produces no document at all.
      - name: Download the prior clean run's shadow artifact
        id: download-prior
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: game-driven-shadow-30902544622
          path: source-revision-evidence/game-driven-shadow-30902544622
          run-id: 30902544622
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the failed observer run's shadow artifact
        id: download-later
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: game-driven-shadow-30999087370
          path: source-revision-evidence/game-driven-shadow-30999087370
          run-id: 30999087370
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report incident evidence availability
        if: ${{ always() }}
        env:
          PRIOR_OUTCOME: ${{ steps.download-prior.outcome }}
          LATER_OUTCOME: ${{ steps.download-later.outcome }}
        run: |
          set -uo pipefail
          echo "game-driven-shadow-30902544622 download: $PRIOR_OUTCOME"
          echo "game-driven-shadow-30999087370 download: $LATER_OUTCOME"
          echo "Availability is recorded here and proven again inside the audit."

      # Artifact IDs, sizes, expiry, and digests as GitHub reports them TODAY.
      # A digest GitHub no longer exposes is UNVERIFIED (honest); a digest that
      # is present and different is FAILED. Non-blocking: unavailable metadata
      # must not stop the evidence document from being produced.
      - name: Record incident artifact metadata
        id: artifact-metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          RUNS = {
              '30902544622': 'game-driven-shadow-30902544622',
              '30999087370': 'game-driven-shadow-30999087370',
          }
          target = pathlib.Path('source-revision-evidence')
          target.mkdir(parents=True, exist_ok=True)
          out = target / 'artifact-metadata.json'

          api = os.environ.get('GH_API', 'https://api.github.com')
          repo = os.environ.get('GH_REPO', '')
          token = os.environ.get('GH_TOKEN', '')
          collected = {}

          for run_id, wanted in RUNS.items():
              url = (
                  f'{api}/repos/{repo}/actions/runs/{run_id}'
                  f'/artifacts?per_page=100'
              )
              request = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except (urllib.error.URLError, ValueError, OSError):
                  print(
                      f'Artifact metadata for run {run_id} could not be '
                      'retrieved; its digest will be reported as not exposed.'
                  )
                  continue
              for entry in payload.get('artifacts') or ():
                  if entry.get('name') == wanted:
                      collected[wanted] = {
                          'artifact_id': entry.get('id'),
                          'size_in_bytes': entry.get('size_in_bytes'),
                          'expired': entry.get('expired'),
                          'created_at': entry.get('created_at'),
                          'expires_at': entry.get('expires_at'),
                          'digest': entry.get('digest'),
                      }

          out.write_text(
              json.dumps(collected, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          for name in sorted(RUNS.values()):
              record = collected.get(name)
              if record is None:
                  print(f'{name}: metadata not returned by the API')
              else:
                  print(
                      f"{name}: id={record.get('artifact_id')} "
                      f"expired={record.get('expired')} "
                      f"digest_present={bool(record.get('digest'))}"
                  )
          PY

      - name: Run the read-only source-revision audit
        id: audit
        continue-on-error: true
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # ADMIN_API_TOKEN is required for APPLICATION STARTUP ONLY:
          #   config.py:96   APP_ENV != production refuses a non-local
          #                  DATABASE_URL, so reaching production requires
          #                  APP_ENV=production;
          #   config.py:231  APP_ENV=production refuses to boot without
          #                  ADMIN_API_TOKEN.
          # Booting against the production database is therefore impossible
          # without it. Its presence authorizes no admin endpoint and no write:
          # the audit never reads this value, makes no HTTP call to this
          # service, and invokes no admin endpoint.
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          # No BASEBALLOS_SYNC_URL and no publication token: nothing here calls
          # a sync endpoint, publishes a snapshot, or dispatches a workflow.
          AUTO_SYNC: 'false'
          # The lane is never RUN by this audit, but the deployed shadow
          # posture is asserted explicitly so no code path this audit touches
          # can read a write-capable mode from the environment.
          GAME_DRIVEN_INGESTION_MODE: 'shadow'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_OPERATOR_NOTE: ${{ inputs.operator_note }}
        run: |
          set -uo pipefail
          cd backend
          exit_code=0
          python scripts/run_game_source_revision_audit.py \
            --expected-main-sha "$INPUT_EXPECTED_MAIN_SHA" \
            --confirmation "$INPUT_CONFIRMATION" \
            --operator-note "$INPUT_OPERATOR_NOTE" \
            --evidence-dir ../source-revision-evidence \
            --artifact-dir ../artifacts/game-824487-source-revision-audit \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # The repository's established scanner, run BEFORE upload. A scanner
      # failure fails the workflow and the artifact never leaves the runner.
      - name: Scan the evidence artifact
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          exit_code=0
          python backend/scripts/scan_forbidden_artifact_content.py \
            --directory artifacts/game-824487-source-revision-audit \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # Upload BEFORE the final gate so a FAILED or UNPROVEN diagnostic still
      # leaves a reviewable artifact. The gate below still preserves FAILED and
      # UNPROVEN — evidence survival never converts a bad result into success.
      - name: Upload the evidence artifact
        id: upload
        continue-on-error: true
        if: ${{ steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: game-824487-source-revision-audit-${{ github.run_id }}
          path: artifacts/game-824487-source-revision-audit
          retention-days: 90
          if-no-files-found: error

      - name: Append the audit summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          base = pathlib.Path('artifacts/game-824487-source-revision-audit')
          path = base / 'source-revision-audit.json'
          print('## Game 824487 source-revision audit\n')
          if not path.exists():
              print('No evidence document was produced. Result: UNPROVEN.')
              raise SystemExit(0)

          doc = json.loads(path.read_text(encoding='utf-8'))
          verdict = doc.get('verdict') or {}
          classification = verdict.get('classification') or {}
          proof = doc.get('read_only_proof') or {}
          artifacts = doc.get('evidence_artifacts') or {}
          drift = doc.get('code_drift') or {}
          calls = doc.get('source_call_report') or {}
          matrix = doc.get('field_matrix_summary') or {}

          print(f"**Result: {verdict.get('result')}**\n")
          print('| field | value |')
          print('| :--- | :--- |')
          print(f"| game | {(doc.get('incident') or {}).get('game_pk')} |")
          print('| prior run | 30902544622 |')
          print('| failed run | 30999087370 |')
          print(f"| audit commit | `{(doc.get('identity') or {}).get('commit_sha')}` |")
          for key in (
              'root_condition', 'current_materiality', 'persistence',
              'historical_field_identification', 'checkpoint_state',
          ):
              print(f"| {key} | `{classification.get(key)}` |")
          print(f"| required artifacts present | {artifacts.get('all_required_present')} |")
          print(f"| revision change proven | {artifacts.get('revision_change_proven')} |")
          print(f"| plan fingerprint stable | {artifacts.get('plan_fingerprint_stable')} |")
          print(f"| prior row-level values retained | {artifacts.get('prior_row_level_values_retained')} |")
          print(f"| semantic code drift | `{drift.get('semantic_drift_targets')}` |")
          print(f"| revision-affecting drift | `{drift.get('source_revision_affecting_drift')}` |")
          print(f"| read-only transaction | {proof.get('transaction_read_only_enabled')} |")
          print(f"| write probe refused | {proof.get('read_only_probe_refused')} |")
          print(f"| fingerprint scopes match | {proof.get('fingerprint_scopes_match')} |")
          print(f"| changed scopes | {proof.get('changed_fingerprint_scopes')} |")
          print(f"| source calls issued | {calls.get('total_calls_issued')} |")
          print(f"| reported equals actual | {calls.get('reported_equals_actual')} |")
          print(f"| field matrix rows | {matrix.get('row_count')} |")
          print(f"| differing rows | {len(matrix.get('differing_rows') or ())} |")

          questions = doc.get('questions') or []
          if questions:
              print('\n**Questions**\n')
              print('| id | answered | question |')
              print('| :--- | :--- | :--- |')
              for question in questions:
                  print(
                      f"| {question.get('question_id')} "
                      f"| {question.get('answered')} "
                      f"| {question.get('question')} |"
                  )

          for reason in verdict.get('failed_reasons') or ():
              print(f'\n- FAILED: `{reason}`')
          for reason in verdict.get('unproven_reasons') or ():
              print(f'\n- UNPROVEN: `{reason}`')

          print(f"\n{doc.get('explanation')}")
          print(f"\n{verdict.get('dead_letter_backlog_note')}")
          print(f"\n{verdict.get('non_authorization_statement')}")
          PY

      # Ordered after scan and upload so a failing diagnostic still leaves
      # reviewable evidence. This gate never converts FAILED or UNPROVEN into
      # success, and there is no continue-on-error on it.
      - name: Final audit gate
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail

          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "UNPROVEN: the evidence artifact could not be proven safe."
            exit 1
          fi

          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "UNPROVEN: the evidence artifact did not upload."
            exit 1
          fi

          if [ "${AUDIT_EXIT_CODE:-}" = "1" ]; then
            echo "FAILED: a contract violation was observed. See the artifact."
            exit 1
          fi

          if [ "${AUDIT_EXIT_CODE:-}" = "2" ]; then
            echo "UNPROVEN: the question could not be resolved. See the artifact."
            exit 1
          fi

          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "The audit did not complete. See the artifact."
            exit 1
          fi

          echo "Source-revision audit completed read-only."
          echo "This audit authorizes no mutation. It does not repair game 824487,"
          echo "does not backfill, does not update a source revision, does not reset"
          echo "or advance a checkpoint, does not create or modify a work item, does"
          echo "not publish or select a snapshot, does not change any ingestion mode"
          echo "or publication authority, does not weaken a validator, and does not"
          echo "run a migration."

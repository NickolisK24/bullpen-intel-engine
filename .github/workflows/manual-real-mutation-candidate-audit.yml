name: Manual Real-Mutation Qualification Candidate Audit

# Read-only audit that identifies completed durable game-driven work items whose
# current canonical shadow plan is exactly ONE governed statistical correction,
# to ONE existing row, on ONE field whose source authority the repository has
# resolved — and which are therefore eligible targets for the Manual
# Game-Driven Real-Mutation Qualification.
#
# Why it exists: D-042 established that operator intuition cannot pick a
# qualification candidate, and that reasoning applies with more force here. A
# no-op candidate is merely a settled game; a real-mutation candidate is a game
# the lane intends to CHANGE, so picking the wrong one is how an unreviewed
# mutation reaches production.
#
# Read-only, three ways — the same machinery the no-op candidate audit already
# proves in production: the public sync advisory lock (acquire-only, it never
# touches SyncRun rows), a PostgreSQL read-only transaction with a refused write
# probe, and before/after content fingerprints across every table the shadow
# path can reach.
#
# Finding zero eligible candidates is a COMPLETED audit, not a failure. Given a
# clean shadow corpus, zero is the expected first answer. Nothing here creates a
# work item, advances a checkpoint, commits, dispatches the write
# qualification, or authorizes any write.

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: >-
          Full 40-character lowercase commit SHA this audit must run against.
          Must equal the resolved GITHUB_SHA or the run refuses.
        required: true
        type: string
      confirmation:
        description: >-
          Must be exactly AUDIT_REAL_MUTATION_CANDIDATES.
        required: true
        type: string
      lookback_days:
        description: 'Completion-date lookback window. 1-120.'
        required: false
        default: '30'
        type: string
      candidate_limit:
        description: 'Maximum candidates evaluated. 1-50.'
        required: false
        default: '20'
        type: string
      eligible_target_count:
        description: >-
          Stop after this many eligible candidates. 1-10, and must not exceed
          candidate_limit.
        required: false
        default: '5'
        type: string
      operator_note:
        description: >-
          Optional note for the evidence artifact. Informational only: it can
          never affect authorization or eligibility, and is sanitized before it
          is recorded.
        required: false
        default: ''
        type: string

# Share the production sync writer lane so the audit can never overlap a
# production writer. cancel-in-progress stays false.
concurrency:
  group: baseballos-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate-audit:
    runs-on: ubuntu-latest
    # Bounded by the candidate cap: 50 candidates x one box-score fetch each,
    # plus discovery and two fingerprint passes.
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'NickolisK24/bullpen-intel-engine'
      && github.ref == 'refs/heads/main'
      && github.actor == github.repository_owner

    steps:
      # SHELL BOUNDARY (established in PR #604). No `${{ }}` expression may
      # appear inside any `run:` script: GitHub substitutes into the script text
      # before bash parses it, so an expression holding operator input becomes
      # shell code in a step carrying production credentials. Every input
      # crosses through env: and is read only as a quoted variable.
      - name: Refuse an unauthorized invocation
        env:
          INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          INPUT_CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
          INPUT_ELIGIBLE_TARGET_COUNT: ${{ inputs.eligible_target_count }}
          INPUT_OPERATOR_NOTE: ${{ inputs.operator_note }}
          RESOLVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$INPUT_EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refused: expected_head_sha must be 40 lowercase hex characters."
            exit 1
          fi

          if [ "$INPUT_EXPECTED_HEAD_SHA" != "$RESOLVED_SHA" ]; then
            echo "Refused: expected_head_sha does not match the resolved commit."
            exit 1
          fi

          if [ "$INPUT_CONFIRMATION" != "AUDIT_REAL_MUTATION_CANDIDATES" ]; then
            echo "Refused: confirmation must be exactly AUDIT_REAL_MUTATION_CANDIDATES."
            exit 1
          fi

          bounded() {
            printf '%s' "$1" | grep -Eq '^[0-9]+$' \
              && [ "$1" -ge "$2" ] && [ "$1" -le "$3" ]
          }

          if ! bounded "$INPUT_LOOKBACK_DAYS" 1 120; then
            echo "Refused: lookback_days must be an integer within 1-120."
            exit 1
          fi

          if ! bounded "$INPUT_CANDIDATE_LIMIT" 1 50; then
            echo "Refused: candidate_limit must be an integer within 1-50."
            exit 1
          fi

          if ! bounded "$INPUT_ELIGIBLE_TARGET_COUNT" 1 10; then
            echo "Refused: eligible_target_count must be an integer within 1-10."
            exit 1
          fi

          if [ "$INPUT_ELIGIBLE_TARGET_COUNT" -gt "$INPUT_CANDIDATE_LIMIT" ]; then
            echo "Refused: eligible_target_count cannot exceed candidate_limit."
            exit 1
          fi

          # The note is never interpreted, expanded, or used in a decision.
          printf 'Operator note supplied: %s characters.\n' \
            "$(printf '%s' "$INPUT_OPERATOR_NOTE" | wc -c)"

          echo "Authorization preconditions satisfied."

      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the read-only candidate audit
        id: audit
        continue-on-error: true
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Required for APPLICATION STARTUP ONLY, on the same reasoning the
          # no-op candidate audit records: APP_ENV=production refuses to boot
          # without it, and reaching the production database requires
          # APP_ENV=production. The audit itself never reads this value, makes
          # no HTTP call, and invokes no admin endpoint.
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          # No BASEBALLOS_SYNC_URL and no publication token: nothing here calls
          # a sync endpoint or publishes.
          AUTO_SYNC: 'false'
          # GAME_DRIVEN_INGESTION_MODE is deliberately NOT set. The audit passes
          # the canonical shadow mode explicitly, per candidate, in code.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          INPUT_CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
          INPUT_ELIGIBLE_TARGET_COUNT: ${{ inputs.eligible_target_count }}
          INPUT_OPERATOR_NOTE: ${{ inputs.operator_note }}
        run: |
          set -uo pipefail
          cd backend
          exit_code=0
          python scripts/run_real_mutation_candidate_audit.py \
            --expected-head-sha "$INPUT_EXPECTED_HEAD_SHA" \
            --confirmation "$INPUT_CONFIRMATION" \
            --lookback-days "$INPUT_LOOKBACK_DAYS" \
            --candidate-limit "$INPUT_CANDIDATE_LIMIT" \
            --eligible-target-count "$INPUT_ELIGIBLE_TARGET_COUNT" \
            --operator-note "$INPUT_OPERATOR_NOTE" \
            --artifact-dir ../artifacts/real-mutation-candidate-audit \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Scan the evidence artifact
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          exit_code=0
          python backend/scripts/scan_forbidden_artifact_content.py \
            --directory artifacts/real-mutation-candidate-audit \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Upload the evidence artifact
        id: upload
        continue-on-error: true
        if: ${{ steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-mutation-candidate-audit-${{ github.run_id }}
          path: artifacts/real-mutation-candidate-audit
          retention-days: 30
          if-no-files-found: error

      - name: Append the audit summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          path = pathlib.Path(
              'artifacts/real-mutation-candidate-audit/'
              'candidate-audit-summary.json'
          )
          print('## Real-mutation qualification candidate audit\n')
          if not path.exists():
              print('No evidence document was produced. Result: UNPROVEN.')
              raise SystemExit(0)

          doc = json.loads(path.read_text(encoding='utf-8'))
          identity = doc.get('identity') or {}
          verdict = doc.get('verdict') or {}
          proof = doc.get('read_only_proof') or {}
          discovery = doc.get('discovery') or {}
          evaluation = doc.get('evaluation') or {}

          print(f"**Result: {verdict.get('result')}**\n")
          print('| field | value |')
          print('| :--- | :--- |')
          print(f"| commit | `{identity.get('commit_sha')}` |")
          print(f"| read-only enabled | {proof.get('read_only_enabled')} |")
          print(f"| write probe refused | "
                f"{proof.get('read_only_probe_refused')} |")
          print(f"| durable write attempts | "
                f"{proof.get('durable_write_attempts')} |")
          print(f"| fingerprints match | {proof.get('fingerprints_match')} |")
          print(f"| changed tables | {proof.get('changed_tables')} |")
          print(f"| completed work items | "
                f"{discovery.get('completed_work_items_found')} |")
          print(f"| candidate pool size | "
                f"{discovery.get('candidate_pool_size')} |")
          print(f"| candidates evaluated | "
                f"{evaluation.get('candidates_evaluated')} |")
          print(f"| stop reason | `{evaluation.get('stop_reason')}` |")
          print(f"| eligible candidates | "
                f"{verdict.get('eligible_candidate_count')} |")
          print(f"| eligible game pks | {verdict.get('eligible_game_pks')} |")
          print(f"| artifact | real-mutation-candidate-audit-"
                f"{identity.get('workflow_run_id')} |")

          eligible = doc.get('eligible_candidates') or []
          if eligible:
              print('\n**Eligible candidates**\n')
              print('| game | pitcher | field | stored value '
                    '| source revision | plan fingerprint |')
              print('| ---: | ---: | :--- | ---: | :--- | :--- |')
              for entry in eligible:
                  print(
                      f"| {entry.get('game_pk')} "
                      f"| {entry.get('pitcher_mlb_id')} "
                      f"| `{entry.get('field')}` "
                      f"| {entry.get('stored_value')} "
                      f"| `{(entry.get('source_revision') or '')[:16]}` "
                      f"| `{(entry.get('plan_fingerprint') or '')[:16]}` |"
                  )
          else:
              print('\nNo eligible candidate. This is a completed audit, not a '
                    'failure.\n')

          counts = evaluation.get('classification_counts') or {}
          if counts:
              print('\n**Classifications**\n')
              print('| classification | count |')
              print('| :--- | ---: |')
              for key in sorted(counts):
                  print(f'| `{key}` | {counts[key]} |')

          for reason in verdict.get('failed_reasons') or ():
              print(f'\n- FAILED: `{reason}`')
          for reason in verdict.get('unproven_reasons') or ():
              print(f'\n- UNPROVEN: `{reason}`')

          print(f"\n{verdict.get('non_authorization_statement')}")
          PY

      # A completed audit that found nothing is a success. Only a broken
      # read-only contract, an unprovable evaluation, or an unpublishable
      # artifact fails this job.
      - name: Final audit gate
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail

          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "UNPROVEN: the evidence artifact could not be proven safe."
            exit 1
          fi

          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "UNPROVEN: the evidence artifact did not upload."
            exit 1
          fi

          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "The candidate audit did not complete. See the artifact."
            exit 1
          fi

          echo "Real-mutation candidate audit complete."
          echo "This audit authorizes nothing. A candidate it reports must"
          echo "still be re-planned and re-reviewed by the qualification"
          echo "itself before any mutation is authorized."

name: BaseballOS Production Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production maintenance operation to run
        required: true
        type: choice
        options:
          - migrate
          - ledger_backfill
          - phase0h_snapshot_audit
          - appearance_team_audit
      confirmation:
        description: Type the operation-specific production confirmation phrase
        required: true
        type: string
      audit_window:
        description: Phase 0H audit window in days; ratification gate requires 14
        required: true
        default: '14'
        type: string
      audit_recent_row_limit:
        description: Phase 0H operator audit recent row limit; web route remains request-safe
        required: true
        default: '256'
        type: string
      appearance_team_since:
        description: Foundation 1 production cutover timestamp (ISO-8601 with timezone)
        required: false
        default: ''
        type: string
      appearance_team_row_limit:
        description: Maximum non-resolved appearance rows in the private audit artifact
        required: true
        default: '50'
        type: string
      season:
        description: Regular season year for ledger backfill
        required: true
        default: '2026'
        type: string
      start_date:
        description: Schedule ingestion start date (YYYY-MM-DD)
        required: true
        default: '2026-03-30'
        type: string
      through_date:
        description: Ledger coverage end date (YYYY-MM-DD)
        required: true
        default: '2026-07-09'
        type: string
      pitcher_mlb_id:
        description: Optional MLB pitcher ID; leave empty to backfill all pitchers
        required: false
        default: '621112'
        type: string

concurrency:
  group: baseballos-production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate confirmation and production secrets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          expected_confirmation='RUN_PRODUCTION_MAINTENANCE'
          if [ "$OPERATION" = 'phase0h_snapshot_audit' ]; then
            expected_confirmation='RUN_PHASE0H_PRODUCTION_AUDIT'
          elif [ "$OPERATION" = 'appearance_team_audit' ]; then
            expected_confirmation='RUN_APPEARANCE_TEAM_PRODUCTION_AUDIT'
          fi
          if [ "$CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::Confirmation must be exactly $expected_confirmation for operation=$OPERATION."
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Production maintenance confirmation and required secrets validated."

      - name: Validate ledger backfill inputs
        if: ${{ inputs.operation == 'ledger_backfill' }}
        env:
          SEASON: ${{ inputs.season }}
          START_DATE: ${{ inputs.start_date }}
          THROUGH_DATE: ${{ inputs.through_date }}
          PITCHER_MLB_ID: ${{ inputs.pitcher_mlb_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SEASON" =~ ^[0-9]{4}$ ]]; then
            echo "::error::season must contain exactly four digits."
            exit 1
          fi
          if [[ ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::start_date must use YYYY-MM-DD format."
            exit 1
          fi
          if [[ ! "$THROUGH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::through_date must use YYYY-MM-DD format."
            exit 1
          fi
          if [ -n "$PITCHER_MLB_ID" ] && [[ ! "$PITCHER_MLB_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::pitcher_mlb_id must be empty or contain only digits."
            exit 1
          fi
          echo "Ledger backfill inputs validated."

      - name: Validate Phase 0H audit inputs
        if: ${{ inputs.operation == 'phase0h_snapshot_audit' }}
        env:
          AUDIT_WINDOW: ${{ inputs.audit_window }}
          AUDIT_RECENT_ROW_LIMIT: ${{ inputs.audit_recent_row_limit }}
        run: |
          set -euo pipefail
          if [ "$AUDIT_WINDOW" != '14' ]; then
            echo "::error::Phase 0H production ratification requires audit_window=14."
            exit 1
          fi
          if [[ ! "$AUDIT_RECENT_ROW_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::audit_recent_row_limit must contain only digits."
            exit 1
          fi
          if [ "$AUDIT_RECENT_ROW_LIMIT" -lt 64 ] || [ "$AUDIT_RECENT_ROW_LIMIT" -gt 512 ]; then
            echo "::error::audit_recent_row_limit must be between 64 and 512."
            exit 1
          fi
          echo "Phase 0H audit inputs validated."

      - name: Validate Foundation 1 appearance-team audit inputs
        if: ${{ inputs.operation == 'appearance_team_audit' }}
        env:
          APPEARANCE_TEAM_SINCE: ${{ inputs.appearance_team_since }}
          APPEARANCE_TEAM_ROW_LIMIT: ${{ inputs.appearance_team_row_limit }}
        run: |
          set -euo pipefail
          python - "$APPEARANCE_TEAM_SINCE" "$APPEARANCE_TEAM_ROW_LIMIT" <<'PY'
          from datetime import datetime
          import sys

          cutover = sys.argv[1].strip()
          row_limit = sys.argv[2].strip()
          if not cutover:
              raise SystemExit(
                  'appearance_team_since is required for appearance_team_audit.'
              )
          candidate = cutover[:-1] + '+00:00' if cutover.endswith('Z') else cutover
          try:
              parsed = datetime.fromisoformat(candidate)
          except ValueError:
              raise SystemExit(
                  'appearance_team_since must be a valid ISO-8601 timestamp.'
              )
          if parsed.tzinfo is None:
              raise SystemExit(
                  'appearance_team_since must include an explicit timezone.'
              )
          if not row_limit.isdigit():
              raise SystemExit(
                  'appearance_team_row_limit must contain only digits.'
              )
          if int(row_limit) < 1 or int(row_limit) > 100:
              raise SystemExit(
                  'appearance_team_row_limit must be between 1 and 100.'
              )
          PY
          echo "Foundation 1 appearance-team audit inputs validated."

      - name: Run production migration
        if: ${{ inputs.operation == 'migrate' }}
        working-directory: backend
        run: |
          set -euo pipefail
          echo "=== Production migration starting ==="
          echo "--- Current migration revision (before upgrade) ---"
          flask db current
          echo "--- Applying migrations ---"
          flask db upgrade
          echo "--- Current migration revision (after upgrade) ---"
          flask db current
          echo "=== Production migration completed ==="

      - name: Run production ledger backfill
        if: ${{ inputs.operation == 'ledger_backfill' }}
        working-directory: backend
        env:
          SEASON: ${{ inputs.season }}
          START_DATE: ${{ inputs.start_date }}
          THROUGH_DATE: ${{ inputs.through_date }}
          PITCHER_MLB_ID: ${{ inputs.pitcher_mlb_id }}
        run: |
          set -euo pipefail
          schedule_summary_file="$(mktemp)"
          backfill_summary_file="$(mktemp)"
          trap 'rm -f "$schedule_summary_file" "$backfill_summary_file"' EXIT

          validate_summary() {
            local summary_file="$1"
            local summary_kind="$2"
            python - "$summary_file" "$summary_kind" <<'PY'
          import json
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          summary_kind = sys.argv[2]
          summary = None
          decoder = json.JSONDecoder()

          for index in range(len(lines) - 1, -1, -1):
              raw_line = lines[index]
              candidate = raw_line.strip()
              if not candidate:
                  continue
              try:
                  parsed = json.loads(candidate)
              except json.JSONDecodeError:
                  if not raw_line.startswith('{'):
                      continue
                  try:
                      parsed, _ = decoder.raw_decode('\n'.join(lines[index:]))
                  except json.JSONDecodeError:
                      continue
              if isinstance(parsed, dict):
                  summary = parsed
                  break

          if summary is None:
              raise SystemExit('No JSON summary object found in command output.')

          if summary_kind == 'schedule':
              if summary.get('status') != 'ok':
                  raise SystemExit(
                      'Schedule ingestion did not complete successfully: '
                      f"status={summary.get('status')!r}"
                  )
          elif summary_kind == 'backfill':
              if int(summary.get('pitchers_total', 0)) <= 0:
                  raise SystemExit('Ledger backfill matched no pitchers.')
              failure_fields = (
                  'fetch_failures',
                  'records_failed',
                  'coverage_records_incomplete',
              )
              failures = {
                  field: int(summary.get(field, 0))
                  for field in failure_fields
                  if int(summary.get(field, 0)) > 0
              }
              if failures:
                  raise SystemExit(
                      f'Ledger backfill reported incomplete work: {failures}'
                  )
          else:
              raise SystemExit(f'Unknown summary kind: {summary_kind!r}')
          PY
          }

          echo "=== Production ledger backfill starting ==="
          echo "--- Ingesting schedule finality evidence ---"
          python scripts/ingest_schedule.py \
            --start-date "$START_DATE" \
            --end-date "$THROUGH_DATE" \
            --source starter_assignment_coverage \
            | tee "$schedule_summary_file"
          validate_summary "$schedule_summary_file" schedule

          echo "--- Backfilling verified pitcher ledgers ---"
          backfill_command=(
            python scripts/backfill_pitcher_game_logs.py
            --season "$SEASON"
            --through-date "$THROUGH_DATE"
            --source starter_assignment_coverage
            --apply
          )
          if [ -n "$PITCHER_MLB_ID" ]; then
            backfill_command+=(--pitcher-mlb-id "$PITCHER_MLB_ID")
          fi
          "${backfill_command[@]}" | tee "$backfill_summary_file"
          validate_summary "$backfill_summary_file" backfill
          echo "=== Production ledger backfill completed ==="

      - name: Run Phase 0H production snapshot audit
        if: ${{ inputs.operation == 'phase0h_snapshot_audit' }}
        working-directory: backend
        env:
          AUDIT_WINDOW: ${{ inputs.audit_window }}
          AUDIT_RECENT_ROW_LIMIT: ${{ inputs.audit_recent_row_limit }}
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/phase0h-snapshot-audit
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_OUTPUT_DIR"
          audit_json="$AUDIT_OUTPUT_DIR/phase0h-snapshot-audit.json"
          audit_stderr="$AUDIT_OUTPUT_DIR/phase0h-snapshot-audit.stderr.log"

          echo "=== Phase 0H production snapshot audit starting ==="
          set +e
          python scripts/run_internal_snapshot_audit.py \
            --window "$AUDIT_WINDOW" \
            --recent-row-limit "$AUDIT_RECENT_ROW_LIMIT" \
            --compact \
            > "$audit_json" \
            2> "$audit_stderr"
          audit_exit_code=$?
          set -e

          python - "$audit_json" "$audit_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          audit_json = Path(sys.argv[1])
          audit_exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])

          def load_audit_payload(path):
              text = path.read_text(encoding='utf-8')
              try:
                  parsed = json.loads(text)
              except json.JSONDecodeError as exc:
                  last_error = exc
              else:
                  if isinstance(parsed, dict):
                      return parsed
                  raise ValueError('Audit output JSON was not an object.')

              decoder = json.JSONDecoder()
              lines = text.splitlines()
              for index in range(len(lines) - 1, -1, -1):
                  raw_line = lines[index]
                  if not raw_line.lstrip().startswith('{'):
                      continue
                  candidate = '\n'.join(lines[index:]).strip()
                  try:
                      parsed = json.loads(candidate)
                  except json.JSONDecodeError:
                      try:
                          parsed, _ = decoder.raw_decode(candidate)
                      except json.JSONDecodeError as exc:
                          last_error = exc
                          continue
                  if isinstance(parsed, dict):
                      return parsed
              raise ValueError(
                  f'No JSON audit object found in command output: {last_error}'
              )

          try:
              payload = load_audit_payload(audit_json)
          except ValueError as exc:
              summary_path.write_text(
                  '## Phase 0H Production Snapshot Audit\n\n'
                  f'- Exit code: `{audit_exit_code}`\n'
                  '- Result: invalid JSON output\n',
                  encoding='utf-8',
              )
              raise SystemExit(f'Audit output was not valid JSON: {exc}')

          adjacency = payload.get('snapshot_adjacency_summary') or {}
          request = payload.get('request') or {}
          latest = payload.get('latest_snapshot') or {}
          recent = payload.get('recent_snapshots') or []
          diagnostics = payload.get('diagnostics') or []

          count_fields = (
              'published_snapshot_count',
              'trusted_published_snapshot_count',
              'adjacent_published_pair_count',
              'trusted_pair_count',
              'comparable_adjacent_pair_count',
              'non_comparable_count',
              'non_adjacent_comparison_count',
          )
          errors = []
          if audit_exit_code != 0:
              errors.append(f'audit_exit_code={audit_exit_code}')
          if payload.get('route_status') != 'internal_admin_only':
              errors.append(f"route_status={payload.get('route_status')!r}")
          if payload.get('response_mode') == 'fallback_db_row_metadata':
              errors.append('top-level fallback response_mode observed')
          if adjacency.get('response_mode') != 'bounded_summary':
              errors.append(
                  'snapshot_adjacency_summary.response_mode='
                  f"{adjacency.get('response_mode')!r}"
              )
          if request.get('window_days') != 14:
              errors.append(f"request.window_days={request.get('window_days')!r}")
          if not latest:
              errors.append('latest_snapshot missing')
          if not isinstance(recent, list) or not recent:
              errors.append('recent_snapshots missing or empty')
          if adjacency.get('recent_rows_truncated') is not False:
              errors.append(
                  'recent_rows_truncated='
                  f"{adjacency.get('recent_rows_truncated')!r}"
              )
          if not isinstance(adjacency.get('recent_row_query_limit'), int):
              errors.append(
                  'recent_row_query_limit='
                  f"{adjacency.get('recent_row_query_limit')!r}"
              )
          for field in count_fields:
              if not isinstance(adjacency.get(field), int):
                  errors.append(f'{field}={adjacency.get(field)!r}')
          if not isinstance(adjacency.get('non_comparable_reason_codes'), list):
              errors.append(
                  'non_comparable_reason_codes='
                  f"{adjacency.get('non_comparable_reason_codes')!r}"
              )

          lines = [
              '## Phase 0H Production Snapshot Audit',
              '',
              f'- Exit code: `{audit_exit_code}`',
              f"- Route status: `{payload.get('route_status')}`",
              f"- Audit window: `{request.get('window_days')}`",
              f"- Latest snapshot date: `{latest.get('data_through')}`",
              f"- Latest snapshot id: `{latest.get('id')}`",
              f"- Published snapshots: `{adjacency.get('published_snapshot_count')}`",
              f"- Trusted published snapshots: `{adjacency.get('trusted_published_snapshot_count')}`",
              f"- Adjacent published pairs: `{adjacency.get('adjacent_published_pair_count')}`",
              f"- Trusted pairs: `{adjacency.get('trusted_pair_count')}`",
              f"- Comparable adjacent pairs: `{adjacency.get('comparable_adjacent_pair_count')}`",
              f"- Non-comparable count: `{adjacency.get('non_comparable_count')}`",
              f"- Non-comparable reason codes: `{adjacency.get('non_comparable_reason_codes')}`",
              f"- Non-adjacent comparison count: `{adjacency.get('non_adjacent_comparison_count')}`",
              f"- Recent row query limit: `{adjacency.get('recent_row_query_limit')}`",
              f"- Recent rows truncated: `{adjacency.get('recent_rows_truncated')}`",
              f"- Diagnostics count: `{len(diagnostics)}`",
          ]
          if errors:
              lines.extend(('', '### Validation Errors'))
              lines.extend(f'- `{error}`' for error in errors)
          else:
              lines.extend(('', 'Full bounded-summary production evidence captured.'))
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if errors:
              raise SystemExit(
                  'Phase 0H production audit did not produce ratification-ready '
                  f'bounded summary evidence: {errors}'
              )
          PY

          echo "=== Phase 0H production snapshot audit completed ==="

      - name: Upload Phase 0H audit artifact
        if: ${{ always() && inputs.operation == 'phase0h_snapshot_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0h-snapshot-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/phase0h-snapshot-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Run Foundation 1 appearance-team production audit
        if: ${{ inputs.operation == 'appearance_team_audit' }}
        working-directory: backend
        env:
          AUDIT_OUTPUT_DIR: ${{ runner.temp }}/appearance-team-production-audit
          APPEARANCE_TEAM_SINCE: ${{ inputs.appearance_team_since }}
          APPEARANCE_TEAM_ROW_LIMIT: ${{ inputs.appearance_team_row_limit }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_OUTPUT_DIR"
          audit_json="$AUDIT_OUTPUT_DIR/appearance-team-production-audit.json"
          audit_stdout="$RUNNER_TEMP/appearance-team-production-audit.stdout.log"
          audit_stderr="$RUNNER_TEMP/appearance-team-production-audit.stderr.log"

          echo "=== Foundation 1 appearance-team production audit starting ==="
          set +e
          python scripts/run_appearance_team_coverage_audit.py \
            --new-row-since "$APPEARANCE_TEAM_SINCE" \
            --row-limit "$APPEARANCE_TEAM_ROW_LIMIT" \
            --compact \
            --output "$audit_json" \
            > "$audit_stdout" \
            2> "$audit_stderr"
          audit_exit_code=$?
          set -e

          python - "$audit_json" "$audit_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          audit_path = Path(sys.argv[1])
          audit_exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])

          try:
              payload = json.loads(audit_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  'Appearance-team production audit did not produce a valid '
                  f'JSON artifact: {type(exc).__name__}'
              )

          expected_exit = {'PASS': 0, 'INCONCLUSIVE': 1, 'FAIL': 2}
          result = payload.get('result')
          errors = []
          if payload.get('capability') != 'appearance_team_production_audit_v1':
              errors.append(f"capability={payload.get('capability')!r}")
          if payload.get('coverage_capability') != 'appearance_team_coverage_v1':
              errors.append(
                  f"coverage_capability={payload.get('coverage_capability')!r}"
              )
          if payload.get('status') not in ('complete', 'failed'):
              errors.append(f"status={payload.get('status')!r}")
          if result not in expected_exit:
              errors.append(f'result={result!r}')
          elif audit_exit_code != expected_exit[result]:
              errors.append(
                  f'audit_exit_code={audit_exit_code}; expected={expected_exit[result]}'
              )
          if payload.get('mode') != 'read_only':
              errors.append(f"mode={payload.get('mode')!r}")
          if payload.get('database_writes_performed') is not False:
              errors.append(
                  'database_writes_performed='
                  f"{payload.get('database_writes_performed')!r}"
              )

          migration = payload.get('migration') or {}
          coverage = payload.get('coverage') or {}
          coverage_contract = payload.get('coverage_contract') or {}
          new_rows = payload.get('new_row_attribution') or {}
          invalid_states = payload.get('invalid_states') or {}
          non_resolved = payload.get('non_resolved') or {}
          decision_reasons = payload.get('decision_reasons')

          if not isinstance(decision_reasons, list) or not decision_reasons:
              errors.append(f'decision_reasons={decision_reasons!r}')
          if payload.get('status') == 'failed':
              if result != 'FAIL':
                  errors.append('failed status must report result=FAIL')
              if not isinstance(payload.get('error_type'), str):
                  errors.append(f"error_type={payload.get('error_type')!r}")
          else:
              if migration.get('expected_head') != 'c7b3e5a91d48':
                  errors.append(
                      f"migration.expected_head={migration.get('expected_head')!r}"
                  )
              if not isinstance(migration.get('current_heads'), list):
                  errors.append(
                      f"migration.current_heads={migration.get('current_heads')!r}"
                  )
              if not isinstance(migration.get('head_matches'), bool):
                  errors.append(
                      f"migration.head_matches={migration.get('head_matches')!r}"
                  )

              # A migration-head mismatch is a complete, valid FAIL artifact even
              # when the new columns cannot safely be queried.
              if migration.get('head_matches') is True:
                  count_fields = (
                      'total_game_logs',
                      'resolved',
                      'unresolved',
                      'conflict',
                      'null_legacy',
                      'current_team_mismatch',
                  )
                  for field in count_fields:
                      value = coverage.get(field)
                      if (
                          not isinstance(value, int)
                          or isinstance(value, bool)
                          or value < 0
                      ):
                          errors.append(f'coverage.{field}={value!r}')
                  if not isinstance(coverage.get('by_source'), dict):
                      errors.append(
                          f"coverage.by_source={coverage.get('by_source')!r}"
                      )
                  if not isinstance(coverage.get('by_season'), dict):
                      errors.append(
                          f"coverage.by_season={coverage.get('by_season')!r}"
                      )
                  if not isinstance(coverage_contract.get('totals_match'), bool):
                      errors.append(
                          'coverage_contract.totals_match='
                          f"{coverage_contract.get('totals_match')!r}"
                      )
                  for field in (
                      'total',
                      'resolved',
                      'unresolved',
                      'conflict',
                      'null_legacy',
                      'status_recorded',
                  ):
                      value = new_rows.get(field)
                      if (
                          not isinstance(value, int)
                          or isinstance(value, bool)
                          or value < 0
                      ):
                          errors.append(f'new_row_attribution.{field}={value!r}')
                  if not isinstance(new_rows.get('since_utc'), str):
                      errors.append(
                          f"new_row_attribution.since_utc={new_rows.get('since_utc')!r}"
                      )
                  if (
                      not isinstance(invalid_states.get('total'), int)
                      or isinstance(invalid_states.get('total'), bool)
                      or invalid_states.get('total', -1) < 0
                  ):
                      errors.append(
                          f"invalid_states.total={invalid_states.get('total')!r}"
                      )
                  if not isinstance(invalid_states.get('counts'), dict):
                      errors.append(
                          f"invalid_states.counts={invalid_states.get('counts')!r}"
                      )
                  for field in ('total', 'row_limit', 'returned'):
                      value = non_resolved.get(field)
                      if (
                          not isinstance(value, int)
                          or isinstance(value, bool)
                          or value < 0
                      ):
                          errors.append(f'non_resolved.{field}={value!r}')
                  if not isinstance(non_resolved.get('truncated'), bool):
                      errors.append(
                          f"non_resolved.truncated={non_resolved.get('truncated')!r}"
                      )
                  if not isinstance(non_resolved.get('rows'), list):
                      errors.append(
                          f"non_resolved.rows={non_resolved.get('rows')!r}"
                      )
                  elif len(non_resolved['rows']) > int(
                      non_resolved.get('row_limit') or 0
                  ):
                      errors.append('non_resolved.rows exceeds row_limit')

          lines = [
              '## Foundation 1 Appearance-Team Production Audit',
              '',
              f'- Exit code: `{audit_exit_code}`',
              f'- Result: `{result}`',
              f"- Capability: `{payload.get('capability')}`",
              f"- Mode: `{payload.get('mode')}`",
              f"- Migration head(s): `{migration.get('current_heads')}`",
              f"- Migration head matches: `{migration.get('head_matches')}`",
              f"- Total game logs: `{coverage.get('total_game_logs')}`",
              f"- Resolved: `{coverage.get('resolved')}`",
              f"- Unresolved: `{coverage.get('unresolved')}`",
              f"- Conflict: `{coverage.get('conflict')}`",
              f"- Legacy NULL: `{coverage.get('null_legacy')}`",
              f"- Coverage totals match: `{coverage_contract.get('totals_match')}`",
              f"- New-row cutover: `{new_rows.get('since_utc')}`",
              f"- New rows: `{new_rows.get('total')}`",
              f"- New rows resolved: `{new_rows.get('resolved')}`",
              f"- New rows unresolved: `{new_rows.get('unresolved')}`",
              f"- New rows conflict: `{new_rows.get('conflict')}`",
              f"- New rows missing status: `{new_rows.get('null_legacy')}`",
              f"- Invalid stored states: `{invalid_states.get('total')}`",
              f"- Non-resolved rows: `{non_resolved.get('total')}`",
              f"- Non-resolved rows returned: `{non_resolved.get('returned')}`",
              f"- Non-resolved rows truncated: `{non_resolved.get('truncated')}`",
              f'- Decision reasons: `{decision_reasons}`',
              '- Database writes performed: `false`',
          ]
          if errors:
              lines.extend(('', '### Validation Errors'))
              lines.extend(f'- `{error}`' for error in errors)
          else:
              lines.extend((
                  '',
                  'Read-only production coverage evidence captured. '
                  'No backfill or reader migration was performed.',
              ))
          summary_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          if errors:
              raise SystemExit(
                  'Appearance-team production audit artifact failed contract '
                  f'validation: {errors}'
              )
          PY

          echo "=== Foundation 1 appearance-team production audit result: exit $audit_exit_code ==="
          exit "$audit_exit_code"

      - name: Upload Foundation 1 appearance-team audit artifact
        if: ${{ always() && inputs.operation == 'appearance_team_audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: appearance-team-production-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/appearance-team-production-audit/
          if-no-files-found: error
          retention-days: 14

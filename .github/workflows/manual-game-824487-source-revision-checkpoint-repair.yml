name: Manual Game 824487 Source Revision Checkpoint Repair

# Exact-scope checkpoint repair for ONE column on ONE existing row.
#
#   game_ingestion_work_items.source_revision  WHERE mlb_game_pk = 824487
#     from 90213dc8e42a9622e9c0dcaea80adb04507a4a5bfe054eaa9b98d2d138b804a0
#     to   a0fe2dbce8ad75ffc880e76996a6fec7bc90f86c296350898c009f97f241ecf4
#
# updated_at moves as well, because the model declares onupdate=utc_now_naive
# and that fires on any UPDATE of the row. That is an automatic bookkeeping
# side effect of the one permitted change, it is declared in the package's
# PERMITTED_CHANGED_COLUMNS, and it was deliberately not pinned back to its old
# value. Any other observed column delta is a contract violation.
#
# Every governed value — the game, the table, the column, the old value, the
# new value, the permitted column set — is a reviewed literal in code. A
# dispatch cannot select WHAT runs, only WHETHER it runs, and which of two
# operations it runs.
#
#   verify  read-only; re-observes every precondition live and reports whether
#           the change is currently required and currently safe. Writes nothing
#           under any outcome.
#   apply   performs the ONE approved change, and only after re-observing every
#           precondition again against a row it holds a FOR UPDATE lock on.
#
# Each operation has its OWN confirmation phrase, so a confirmation reviewed
# and typed for a verify run can never start an apply run.
#
# What this workflow never does: insert a work item, create a missing
# checkpoint, update more than one work item, update any other column, touch
# GameLog, ScheduledGame, SyncRun, correction provenance, dead letters,
# snapshots, publication state, serving state, team intelligence, or player
# intelligence. It changes no mode and no authority, triggers no sync,
# backfill, or replay, reruns no historical workflow, modifies no source data,
# modifies no canonical appearance row, generates no public snapshot, and
# publishes nothing.
#
# Running this workflow is NOT authorized by the merged source-revision audit.
# The audit authorizes no mutation; a recommendation is not approval. A dispatch
# of the apply operation is a separate, explicit human decision.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: >-
          verify (read-only) or apply (performs the one approved change).
          Defaults to verify. An apply dispatch is a separate human decision
          and requires the apply confirmation phrase.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply
      expected_main_sha:
        description: >-
          Full 40-character lowercase commit SHA on main this run must execute
          against. Must equal the resolved GITHUB_SHA or the run refuses.
        required: true
        type: string
      confirmation:
        description: >-
          VERIFY_GAME_824487_SOURCE_REVISION_CHECKPOINT for a verify run, or
          APPLY_GAME_824487_SOURCE_REVISION_CHECKPOINT for an apply run. The
          phrase is matched against the SELECTED operation only.
        required: true
        type: string
      operator_note:
        description: >-
          Optional note for the evidence artifact. Informational only: it can
          never affect authorization or any verdict, and is sanitized before it
          is recorded.
        required: false
        default: ''
        type: string

# The SAME group the production sync lane uses, so this run can never overlap a
# production writer. cancel-in-progress stays false: a repair that is halfway
# through its own transaction must never be cancelled by a later dispatch.
concurrency:
  group: baseballos-sync
  cancel-in-progress: false

# contents: read to check out the reviewed commit. Nothing more is added:
# nothing here writes to contents, actions, packages, pull requests,
# deployments, or id-token, and no existing deployment mechanism requires them.
permissions:
  contents: read

jobs:
  source-revision-checkpoint-repair:
    runs-on: ubuntu-latest
    # Bounded by one box-score call, two fingerprint passes, and at most one
    # single-row UPDATE.
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'NickolisK24/bullpen-intel-engine'
      && github.ref == 'refs/heads/main'
      && github.actor == github.repository_owner

    steps:
      # SHELL BOUNDARY (established in PR #604). No `${{ }}` expression may
      # appear inside any `run:` script: GitHub substitutes into the script text
      # before bash parses it, so an expression holding operator input becomes
      # shell code in a step carrying production credentials. Every input
      # crosses through env: and is read only as a quoted variable.
      #
      # This runs BEFORE checkout, Python, and dependencies, so an unauthorized
      # invocation never reaches repository code or a database session.
      - name: Refuse an unauthorized invocation
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_OPERATOR_NOTE: ${{ inputs.operator_note }}
          RESOLVED_SHA: ${{ github.sha }}
          RESOLVED_REPOSITORY: ${{ github.repository }}
          RESOLVED_REF: ${{ github.ref }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY_PRESENT: ${{ secrets.SECRET_KEY }}
          SECRET_ADMIN_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$RESOLVED_REPOSITORY" != "NickolisK24/bullpen-intel-engine" ]; then
            echo "Refused: this repair runs only in NickolisK24/bullpen-intel-engine."
            exit 1
          fi

          if [ "$RESOLVED_REF" != "refs/heads/main" ]; then
            echo "Refused: this repair runs only from main."
            exit 1
          fi

          if ! printf '%s' "$INPUT_EXPECTED_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refused: expected_main_sha must be 40 lowercase hex characters."
            exit 1
          fi

          if [ "$INPUT_EXPECTED_MAIN_SHA" != "$RESOLVED_SHA" ]; then
            echo "Refused: expected_main_sha does not match the resolved commit."
            exit 1
          fi

          # A closed vocabulary of two. Anything else refuses before the
          # confirmation is even consulted.
          case "$INPUT_OPERATION" in
            verify)
              expected_confirmation="VERIFY_GAME_824487_SOURCE_REVISION_CHECKPOINT"
              ;;
            apply)
              expected_confirmation="APPLY_GAME_824487_SOURCE_REVISION_CHECKPOINT"
              ;;
            *)
              echo "Refused: operation must be exactly verify or apply."
              exit 1
              ;;
          esac

          # Matched against the SELECTED operation's phrase only. A verify
          # confirmation cannot start an apply run, and the reverse is equally
          # refused.
          if [ "$INPUT_CONFIRMATION" != "$expected_confirmation" ]; then
            echo "Refused: confirmation does not match the selected operation."
            exit 1
          fi

          # Every secret must be present BEFORE any database session is opened.
          # Presence only: no value is echoed, compared, or recorded.
          if [ -z "${SECRET_DATABASE_URL:-}" ]; then
            echo "Refused: DATABASE_URL secret is absent."
            exit 1
          fi
          if [ -z "${SECRET_KEY_PRESENT:-}" ]; then
            echo "Refused: SECRET_KEY secret is absent."
            exit 1
          fi
          if [ -z "${SECRET_ADMIN_TOKEN:-}" ]; then
            echo "Refused: BASEBALLOS_ADMIN_API_TOKEN secret is absent."
            exit 1
          fi

          # The note is never interpreted, expanded, or used in a decision.
          printf 'Operator note supplied: %s characters.\n' \
            "$(printf '%s' "$INPUT_OPERATOR_NOTE" | wc -c)"

          echo "Authorization preconditions satisfied."
          echo "Operation: $INPUT_OPERATION"
          echo "Scope is locked in code: game 824487, table"
          echo "game_ingestion_work_items, column source_revision, one row."
          if [ "$INPUT_OPERATION" = "apply" ]; then
            echo "This is an APPLY dispatch. It will perform the one approved"
            echo "change if — and only if — every precondition is positively"
            echo "re-observed at execution time. It refuses otherwise."
          else
            echo "This is a VERIFY dispatch. It writes nothing under any outcome."
          fi

      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the checkpoint repair
        id: repair
        continue-on-error: true
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # ADMIN_API_TOKEN is required for APPLICATION STARTUP ONLY:
          #   config.py:96   APP_ENV != production refuses a non-local
          #                  DATABASE_URL, so reaching production requires
          #                  APP_ENV=production;
          #   config.py:231  APP_ENV=production refuses to boot without
          #                  ADMIN_API_TOKEN.
          # Its presence authorizes no admin endpoint and no write: this
          # package never reads the value, makes no HTTP call to this service,
          # and invokes no admin endpoint.
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          # No BASEBALLOS_SYNC_URL and no publication token: nothing here calls
          # a sync endpoint, publishes a snapshot, or dispatches a workflow.
          AUTO_SYNC: 'false'
          # The lane is never RUN by this package, but the deployed shadow
          # posture is asserted explicitly so no code path it touches can read
          # a write-capable mode from the environment.
          GAME_DRIVEN_INGESTION_MODE: 'shadow'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_OPERATOR_NOTE: ${{ inputs.operator_note }}
        run: |
          set -uo pipefail
          cd backend
          exit_code=0
          python scripts/run_game_source_revision_checkpoint_repair.py \
            --operation "$INPUT_OPERATION" \
            --expected-main-sha "$INPUT_EXPECTED_MAIN_SHA" \
            --confirmation "$INPUT_CONFIRMATION" \
            --operator-note "$INPUT_OPERATOR_NOTE" \
            --artifact-dir ../artifacts/game-824487-checkpoint-repair \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # The repository's established scanner, run BEFORE upload. This step
      # records its outcome rather than failing the job itself: the upload
      # below is conditioned on that outcome, so an unsafe artifact never
      # leaves the runner, and the final gate fails the workflow unless the
      # scan succeeded.
      - name: Scan the evidence artifact
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          exit_code=0
          python backend/scripts/scan_forbidden_artifact_content.py \
            --directory artifacts/game-824487-checkpoint-repair \
            || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      # Upload BEFORE the final gate so a REFUSED, FAILED, or UNPROVEN run
      # still leaves reviewable evidence. The gate below still preserves every
      # non-zero result — evidence survival never converts a bad result into
      # success.
      - name: Upload the evidence artifact
        id: upload
        continue-on-error: true
        if: ${{ steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: game-824487-checkpoint-repair-${{ github.run_id }}
          path: artifacts/game-824487-checkpoint-repair
          retention-days: 90
          if-no-files-found: error

      - name: Append the repair summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib

          base = pathlib.Path('artifacts/game-824487-checkpoint-repair')
          path = base / 'source-revision-checkpoint-repair.json'
          print('## Game 824487 source-revision checkpoint repair\n')
          if not path.exists():
              print('No evidence document was produced. Result: UNPROVEN.')
              raise SystemExit(0)

          doc = json.loads(path.read_text(encoding='utf-8'))
          verdict = doc.get('verdict') or {}
          scope = doc.get('scope') or {}
          pre = doc.get('preconditions') or {}
          ledger = doc.get('mutation_ledger') or {}
          proof = doc.get('read_only_proof') or {}
          lock = doc.get('advisory_lock') or {}
          completeness = doc.get('current_source_completeness') or {}

          print(f"**Result: {verdict.get('result')}** "
                f"(exit {verdict.get('exit_code')})\n")
          print('| field | value |')
          print('| :--- | :--- |')
          print(f"| operation | `{verdict.get('operation')}` |")
          print(f"| game | {scope.get('game_pk')} |")
          print(f"| table | `{scope.get('target_table')}` |")
          print(f"| column | `{scope.get('target_column')}` |")
          print(f"| preconditions satisfied | "
                f"{verdict.get('preconditions_all_satisfied')} |")
          print(f"| violated | `{pre.get('violated')}` |")
          print(f"| not observed | `{pre.get('not_observed')}` |")
          print(f"| source completeness | "
                f"`{completeness.get('completeness_state')}` |")
          print(f"| read-only transaction | "
                f"{proof.get('read_only_transaction_enabled')} |")
          print(f"| write probe refused | {proof.get('read_only_probe_refused')} |")
          print(f"| advisory lock acquired | {lock.get('guard_acquired')} |")
          print(f"| advisory lock released | {lock.get('guard_released')} |")
          print(f"| apply gate open | {ledger.get('apply_gate_open')} |")
          print(f"| apply attempted | {ledger.get('apply_attempted')} |")
          print(f"| committed | {ledger.get('committed')} |")
          print(f"| affected rows | {ledger.get('affected_row_count')} |")
          print(f"| mutation performed | {verdict.get('mutation_performed')} |")
          changed = (ledger.get('scope_evaluation') or {}).get(
              'observed_changed_columns'
          )
          print(f"| changed columns | `{changed}` |")

          for family, label in (
              ('failed_reasons', 'FAILED'),
              ('unproven_reasons', 'UNPROVEN'),
              ('refusal_reasons', 'REFUSED'),
          ):
              for reason in verdict.get(family) or ():
                  print(f'\n- {label}: `{reason}`')

          print(f"\n{doc.get('explanation')}")
          print(f"\n{verdict.get('dead_letter_backlog_note')}")
          print(f"\n{verdict.get('non_authorization_statement')}")
          PY

      # Ordered after scan and upload so a refused or failed run still leaves
      # reviewable evidence. This gate never converts a non-zero result into
      # success, and there is no continue-on-error on it.
      - name: Final repair gate
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          REPAIR_EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
          SELECTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail

          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "UNPROVEN: the evidence artifact could not be proven safe."
            exit 1
          fi

          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "UNPROVEN: the evidence artifact did not upload."
            exit 1
          fi

          if [ "${REPAIR_EXIT_CODE:-}" = "1" ]; then
            echo "FAILED: this package violated its own safety contract."
            echo "See the artifact. Nothing about the platform is claimed here."
            exit 1
          fi

          if [ "${REPAIR_EXIT_CODE:-}" = "2" ]; then
            echo "UNPROVEN: required evidence could not be obtained."
            echo "Nothing was written. See the artifact."
            exit 1
          fi

          if [ "${REPAIR_EXIT_CODE:-}" = "3" ]; then
            echo "REFUSED: a precondition was positively observed not to hold."
            echo "Nothing was written. This is a correct outcome of a correctly"
            echo "working package, not an error in the platform."
            exit 1
          fi

          if [ "$REPAIR_OUTCOME" != "success" ]; then
            echo "The repair did not complete. See the artifact."
            exit 1
          fi

          if [ "$SELECTED_OPERATION" = "apply" ]; then
            echo "Apply completed within scope: at most one row, one governed"
            echo "column, plus the automatic updated_at bookkeeping timestamp."
          else
            echo "Verify completed read-only. Nothing was written."
            echo "A verify result is evidence for a human decision, not that"
            echo "decision. Applying requires a separate explicit dispatch"
            echo "carrying the apply confirmation phrase."
          fi

          echo "This run created no work item, created no checkpoint, updated no"
          echo "other work item, updated no other column, touched no GameLog,"
          echo "ScheduledGame, SyncRun, correction provenance, dead letter,"
          echo "snapshot, publication state, serving state, team intelligence, or"
          echo "player intelligence, changed no mode or authority, triggered no"
          echo "sync, backfill, or replay, reran no historical workflow, modified"
          echo "no source data, modified no canonical appearance row, generated no"
          echo "public snapshot, and published nothing."

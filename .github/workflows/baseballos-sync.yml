name: BaseballOS Bullpen Sync

# Reliable production sync. GitHub Actions runs the daily sync as a direct
# Python process against the production database. That sync publishes the
# dashboard snapshot directly, then this workflow verifies the public dashboard
# is serving the published cache. The protected backend sync and snapshot
# endpoints remain available for manual emergency use, but scheduled automation
# does not run large jobs inside Render/Gunicorn web requests.
#
# Pipeline order (see docs/current/SYNC_PIPELINE.md):
#   1. production schedule/finality preflight inside the sync command
#   2. sync (daily gameLog lane / postgame boxscore lane, lookback sweep)
#   3. snapshot publish/withhold happens INSIDE the sync via the same ledger
#      gate; the audit step re-proves it and fails this workflow loudly on
#      any deficit
#   4. appearance ledger audit — publish-eligibility verdict (fail-closed)
#   5. dashboard snapshot cache verification
# Historical backfills are NEVER automatic: trigger mode=backfill with an
# explicit backfill_date from the Actions tab.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL                production Postgres connection URL
#   SECRET_KEY                  production Flask secret key
#   BASEBALLOS_ADMIN_API_TOKEN  must match the backend's ADMIN_API_TOKEN
#   BASEBALLOS_SYNC_URL         e.g. https://baseballos-api.onrender.com/api/bullpen/sync
#
# To disable: comment out the `schedule:` block below (manual runs still work
# via the "Run workflow" button), or disable this workflow in the Actions tab.

on:
  schedule:
    # Cron is always UTC and does NOT observe DST. 10:00 UTC is ~6 AM ET during
    # daylight time (most of the MLB season) and ~5 AM ET during standard time.
    - cron: '0 10 * * *'
    # Lightweight schedule-only morning correction pass. This uses the same
    # singleton workflow/concurrency lane and performs a full rolling-window
    # upsert so time, date, doubleheader, and status changes all stay current.
    - cron: '0 14 * * *'
    # Targeted postgame refreshes after most games are complete. 02:00/04:00/06:00
    # UTC is ~10 PM/12 AM/2 AM ET during daylight time, covering the overnight
    # window with a few passes instead of an every-30-minute cadence.
    - cron: '0 2,4,6 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Sync mode to run. intraday is a manual-only, AUDIT-ONLY check that
          reports what would change without writing any baseball data,
          publishing a snapshot, or warming caches.
        required: true
        default: daily
        type: choice
        options:
          - daily
          - postgame
          - backfill
          - intraday
      backfill_date:
        description: >-
          Slate date (YYYY-MM-DD) to replay when mode=backfill. Backfills are
          never automatic — this input is the only way to reprocess a
          historical slate.
        required: false
        default: ''
        type: string

# Never let scheduled + manual runs pile up on top of each other.
concurrency:
  group: baseballos-sync
  cancel-in-progress: false

# CI-003 / #598. Read-only by default. Repository write authority is granted to
# the ONE job that publishes generated content (static-team-story-preview) and
# to no other job in this workflow. public-sync, shadow-activation-health,
# internal-enrichment, and intraday-audit never write to the repository, so they
# no longer carry a token that could.
permissions:
  contents: read

jobs:
  public-sync:
    runs-on: ubuntu-latest
    # The intraday mode is audit-only and never publishes; it runs in the
    # isolated intraday-audit job below and must not trigger any part of this
    # publish-oriented lane (including the always() ledger/snapshot steps).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday') }}
    # Public freshness lane only: acquisition, public derived state, snapshot
    # publication, Tonight warm, appearance ledger audit, and dashboard cache
    # verification. 60 minutes covers the worst case of the step timeouts below
    # (40m sync + 10m tonight + 5m audit) plus uploads and cleanup. OPS-002
    # raised this from 40 with the daily command timeout; it must stay strictly
    # greater than that shell timeout so the shell kill is what fires first and
    # the job still gets to run its always() ledger and cache proofs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run direct daily sync
        id: daily-sync
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          # Automated game-driven shadow. Observation only: the lane plans,
          # fetches, extracts, and projects, and writes nothing. The current
          # sync and publication path remains authoritative. Set here, on the
          # step that runs the daily runner, and NOT at job scope — every other
          # step in this job must keep the deployed default of off.
          GAME_DRIVEN_INGESTION_MODE: 'shadow'
          DAILY_SYNC_SUMMARY_PATH: artifacts/game-driven-shadow/daily-sync-summary.json
          # Team State vNext production proof (D-056). Side-channel evidence only:
          # the post-publication hook writes this file after the publication has
          # already committed, and does nothing at all when the variable is unset —
          # which is every other process, including the deployed web service. It
          # deliberately does NOT live in artifacts/game-driven-shadow/, which the
          # shadow handoff step below sweeps wholesale into its own evidence lane.
          TEAM_STATE_VNEXT_PROOF_PATH: artifacts/team-state-vnext-proof/team-state-vnext-production-proof.json
          # The already-passed v3_phase_4 -> v3_phase_5 boundary publication. Its
          # frozen What Changed block is carried as historical boundary evidence,
          # because a later publication is v3_phase_5 -> v3_phase_5 and is not that
          # boundary.
          TEAM_STATE_VNEXT_BOUNDARY_SNAPSHOT_ID: '437'
          # OPS-002 last-resort kill. 40m = 2400s sits 200s above the 2200s
          # internal budget, so the Python process always reaches its own
          # governed shutdown first and this never becomes normal control flow.
          DAILY_SYNC_COMMAND_TIMEOUT: 40m
          # Whole-command runtime governance. The Python process keeps the
          # daily sync inside this total budget and reserves enough time for
          # fatigue, snapshot publish/withhold, metadata, writer-guard release,
          # and cleanup.
          #
          # OPS-002 temporary mitigation, 1080 -> 2200. The August 6 incident
          # measured five upstream stages consuming 612-628s before the
          # ingestion pool is calculated at all, leaving a combined pool of
          # 151-168s; the shadow observer then took its share and the legacy
          # GameLog writer received 112-125s for work whose corrected
          # cold-equivalent upper bound is 767-895s. This is headroom, not the
          # permanent correction: the durable fix is reducing the upstream work
          # and the 861-pitcher enumeration, tracked separately.
          DAILY_SYNC_TOTAL_BUDGET_SECONDS: '2200'
          # UNCHANGED at 300s. The final phase (fatigue, snapshot assembly and
          # publish/withhold, metadata, writer-guard release, cleanup) genuinely
          # needs it: the successful August 6 recovery spent 189.7s in its
          # snapshot phase alone. Reducing this would be the wrong lever and
          # would endanger finalisation.
          DAILY_SYNC_FINAL_PHASE_RESERVE_SECONDS: '300'
          # Safety ceiling on the COMBINED ingestion pool, not a promised
          # allocation to any one lane. The pool is the smaller of this cap and
          # the runtime remaining after the final-phase reserve, so under the
          # observed upstream range the derived pool (~1171-1272s) is what
          # actually binds and this cap does not. It sits above that derived
          # pool deliberately: a cap below the pool would silently re-create
          # the invisible constraint OPS-002 is about.
          #
          # The pool is then SHARED. The game-driven shadow observer runs first
          # and is allocated 25% of it, and its ACTUAL elapsed time (not its
          # allocation) is subtracted before the legacy GameLog writer starts.
          # Worst case at the maximum observed upstream of 628.5s:
          #   pool  = min(1500, 2200 - 628.5 - 300) = 1271.5s
          #   shadow allocation                     =  317.875s
          #   legacy GameLog floor                  =  953.625s  (>= 950s floor)
          DAILY_SYNC_INGESTION_BUDGET_SECONDS: '1500'
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Direct daily sync starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p "$(dirname "$DAILY_SYNC_SUMMARY_PATH")"
          set +e
          timeout --kill-after=30s "$DAILY_SYNC_COMMAND_TIMEOUT" python backend/scripts/run_daily_sync.py --days-back 7 --source github_actions --public-only --output "$DAILY_SYNC_SUMMARY_PATH"
          exit_code=$?
          set -e
          # Recorded before this step can exit, so the activation validator can
          # read the real runner outcome even when the step fails below.
          echo "runner_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Direct daily sync timed out after $DAILY_SYNC_COMMAND_TIMEOUT."
            else
              echo "::error::Direct daily sync failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Direct daily sync completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Refresh schedule and warm Tonight
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          TONIGHT_REFRESH_COMMAND_TIMEOUT: 10m
          TONIGHT_REFRESH_SCHEDULE_TIMEOUT_SECONDS: '180'
          TONIGHT_REFRESH_WARM_TIMEOUT_SECONDS: '300'
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Refresh schedule and warm Tonight starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --kill-after=30s "$TONIGHT_REFRESH_COMMAND_TIMEOUT" python backend/scripts/run_tonight_refresh.py --source github_actions
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Refresh schedule and warm Tonight timed out after $TONIGHT_REFRESH_COMMAND_TIMEOUT."
            else
              echo "::error::Refresh schedule and warm Tonight failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Refresh schedule and warm Tonight completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Run morning slate schedule refresh
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          SLATE_SCHEDULE_COMMAND_TIMEOUT: 5m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Morning slate schedule refresh starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          timeout --kill-after=30s "$SLATE_SCHEDULE_COMMAND_TIMEOUT" python backend/scripts/refresh_slate_schedule.py --source github_actions_morning
          echo "Morning slate schedule refresh completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Run direct postgame refresh
        id: postgame-refresh
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'postgame') || (github.event_name == 'schedule' && github.event.schedule == '0 2,4,6 * * *') }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          # Automated game-driven shadow, reactivated on exact-cycle scope.
          # The lane runs AFTER the existing completed-game writer over ONLY
          # the games this refresh cycle governs and the writer finished — not
          # the planner's rolling correction horizon, which is what exhausted
          # the first cycle's allocation at 98 of 112 games. A clean cycle here
          # projects nothing at all.
          #
          # Writing modes are refused on this cycle regardless; shadow is the
          # only mode it can observe in.
          GAME_DRIVEN_INGESTION_MODE: 'shadow'
          POSTGAME_SYNC_SUMMARY_PATH: artifacts/game-driven-shadow/postgame-sync-summary.json
          POSTGAME_REFRESH_COMMAND_TIMEOUT: 20m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Direct postgame refresh starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p "$(dirname "$POSTGAME_SYNC_SUMMARY_PATH")"
          set +e
          timeout --kill-after=30s "$POSTGAME_REFRESH_COMMAND_TIMEOUT" python backend/scripts/run_postgame_refresh.py --source github_actions --public-only --output "$POSTGAME_SYNC_SUMMARY_PATH"
          exit_code=$?
          set -e
          # Recorded before this step can exit, so the activation validator can
          # read the real runner outcome even when the step fails below.
          echo "runner_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Direct postgame refresh timed out after $POSTGAME_REFRESH_COMMAND_TIMEOUT."
            else
              echo "::error::Direct postgame refresh failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Direct postgame refresh completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Refresh schedule and warm Tonight after postgame
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'postgame') || (github.event_name == 'schedule' && github.event.schedule == '0 2,4,6 * * *') }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          TONIGHT_REFRESH_COMMAND_TIMEOUT: 10m
          TONIGHT_REFRESH_SCHEDULE_TIMEOUT_SECONDS: '180'
          TONIGHT_REFRESH_WARM_TIMEOUT_SECONDS: '300'
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Refresh schedule and warm Tonight after postgame starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --kill-after=30s "$TONIGHT_REFRESH_COMMAND_TIMEOUT" python backend/scripts/run_tonight_refresh.py --source github_actions_postgame
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Refresh schedule and warm Tonight after postgame timed out after $TONIGHT_REFRESH_COMMAND_TIMEOUT."
            else
              echo "::error::Refresh schedule and warm Tonight after postgame failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Refresh schedule and warm Tonight after postgame completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # Explicit historical backfill only. Never runs on a schedule — an
      # operator must dispatch mode=backfill with a concrete slate date.
      - name: Run explicit backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill' }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          # MANDATORY, not decorative. Backfill invokes run_postgame_refresh.py
          # — the same runner and the same service entry point the scheduled
          # postgame cycle uses — so it would otherwise be a candidate for the
          # lane. A historical replay is not an observation cycle and produces
          # no activation evidence, so the lane stays off here explicitly
          # rather than by assumed inheritance.
          GAME_DRIVEN_INGESTION_MODE: 'off'
          BACKFILL_DATE: ${{ inputs.backfill_date }}
          BACKFILL_COMMAND_TIMEOUT: 20m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          if ! [[ "${BACKFILL_DATE:-}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::mode=backfill requires backfill_date in YYYY-MM-DD form (got '${BACKFILL_DATE:-}')."
            exit 1
          fi
          echo "Explicit backfill for slate ${BACKFILL_DATE} starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --kill-after=30s "$BACKFILL_COMMAND_TIMEOUT" python backend/scripts/run_postgame_refresh.py --date "$BACKFILL_DATE" --source github_actions_backfill --public-only
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Explicit backfill timed out after $BACKFILL_COMMAND_TIMEOUT."
            else
              echo "::error::Explicit backfill failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Explicit backfill completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # Appearance Ledger audit — the publish-eligibility verdict. Runs after
      # every sync mode (daily, postgame, backfill). Exit 0 = ledger proven
      # complete; exit 1 = deficits (the snapshot publisher withheld or will
      # withhold publication); exit 2 = the audit itself could not run. Any
      # non-zero verdict fails this workflow loudly — an unprovable appearance
      # ledger is a trust incident, not a warning.
      - name: Appearance ledger audit (publish eligibility)
        if: ${{ always() }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          LEDGER_AUDIT_COMMAND_TIMEOUT: 5m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Appearance ledger audit starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --kill-after=30s "$LEDGER_AUDIT_COMMAND_TIMEOUT" \
            python backend/scripts/appearance_ledger_audit.py --days 10 --deep \
            | tee ledger_audit_report.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          case "$exit_code" in
            0)
              echo "::notice title=Appearance Ledger::Publish eligible: YES — appearance ledger proven complete for the trailing window."
              ;;
            1)
              echo "::error title=Appearance Ledger::Publish eligible: NO — appearance ledger has deficits. Snapshot publication is withheld (fail-closed). See the audit report above for missing game_pks and affected players; replay with mode=backfill and the flagged slate date."
              exit 1
              ;;
            124|137|143)
              echo "::error title=Appearance Ledger::Ledger audit timed out after $LEDGER_AUDIT_COMMAND_TIMEOUT — publish eligibility is UNPROVEN."
              exit "$exit_code"
              ;;
            *)
              echo "::error title=Appearance Ledger::Ledger audit could not run (exit $exit_code) — publish eligibility is UNPROVEN."
              exit "$exit_code"
              ;;
          esac

      - name: Upload appearance ledger audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: appearance-ledger-audit-${{ github.run_id }}
          path: ledger_audit_report.txt
          if-no-files-found: ignore

      - name: Verify dashboard snapshot cache
        if: ${{ always() }}
        env:
          SYNC_URL: ${{ secrets.BASEBALLOS_SYNC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ]; then
            echo "::error::Missing BASEBALLOS_SYNC_URL repository secret."
            exit 1
          fi

          normalized_sync_url="${SYNC_URL%/}"
          backend_base_url="${normalized_sync_url%/api/bullpen/sync}"
          if [ "$backend_base_url" = "$normalized_sync_url" ]; then
            echo "::error::BASEBALLOS_SYNC_URL must end with /api/bullpen/sync so the dashboard URL can be derived safely."
            exit 1
          fi
          dashboard_url="$backend_base_url/api/bullpen/dashboard"

          dashboard_response="$(mktemp)"
          trap 'rm -f "$dashboard_response"' EXIT

          max_attempts=4
          dashboard_max_time=60
          transient_statuses=" 502 503 504 "
          http_code="000"
          curl_exit=0

          for attempt in $(seq 1 "$max_attempts"); do
            : > "$dashboard_response"
            echo "Dashboard snapshot verification attempt $attempt/$max_attempts"

            set +e
            http_code=$(curl -sS -o "$dashboard_response" -w '%{http_code}' \
              --connect-timeout 20 --max-time "$dashboard_max_time" \
              "$dashboard_url")
            curl_exit=$?
            set -e

            if [ "$curl_exit" -ne 0 ]; then
              http_code="000"
              echo "::warning::Dashboard snapshot verification attempt $attempt failed before an HTTP response was returned (curl exit $curl_exit)."
            else
              echo "Dashboard snapshot verification attempt $attempt HTTP status: $http_code"

              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                python - "$dashboard_response" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, encoding='utf-8') as handle:
                  payload = json.load(handle)
          except json.JSONDecodeError as exc:
              print(f'::error::Dashboard snapshot verification failed: response was not valid JSON ({exc}).')
              raise SystemExit(1)

          snapshot = payload.get('snapshot') or {}
          errors = []
          if snapshot.get('served_from') != 'cache':
              errors.append(f"snapshot.served_from={snapshot.get('served_from')!r}")
          if snapshot.get('is_published') is not True:
              errors.append(f"snapshot.is_published={snapshot.get('is_published')!r}")
          if not snapshot.get('snapshot_id'):
              errors.append('snapshot.snapshot_id missing')
          if not snapshot.get('data_through'):
              errors.append('snapshot.data_through missing')
          if not snapshot.get('snapshot_generated_at'):
              errors.append('snapshot.snapshot_generated_at missing')

          if errors:
              print('::error::Dashboard snapshot verification failed: ' + '; '.join(errors))
              raise SystemExit(1)

          print(
              'Dashboard snapshot verification passed: '
              f"id={snapshot.get('snapshot_id')} "
              f"data_through={snapshot.get('data_through')} "
              f"generated_at={snapshot.get('snapshot_generated_at')}"
          )
          PY
                echo "Dashboard snapshot cache verification succeeded."
                exit 0
              fi

              if [[ "$transient_statuses" != *" $http_code "* ]]; then
                echo "::error::Dashboard snapshot verification failed with HTTP $http_code"
                echo "Response body:"
                cat "$dashboard_response" || true
                echo
                exit 1
              fi

              echo "::warning::Dashboard snapshot verification attempt $attempt hit transient HTTP $http_code."
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              delay_seconds=$((15 * attempt))
              echo "Retrying dashboard snapshot verification in ${delay_seconds}s..."
              sleep "$delay_seconds"
            fi
          done

          echo "::error::Dashboard snapshot verification failed after $max_attempts attempts. Final HTTP status: $http_code"
          echo "Final response body:"
          cat "$dashboard_response" || true
          echo
          exit 1

      # ── Shadow activation handoff (transport only) ───────────────────────
      # Everything about shadow ACTIVATION HEALTH now lives in the separate
      # shadow-activation-health job below. What remains here is transport: the
      # runner wrote its cycle summary to this filesystem, and jobs do not share
      # one, so the evidence has to be staged and uploaded to cross over.
      #
      # These two steps are deliberately non-blocking. Publication succeeded or
      # failed on the steps above; a diagnostic handoff must never be able to
      # turn a green publication red. A failed handoff instead becomes UNPROVEN
      # activation health in the observer job, which fails there.
      #
      # The staging rule matters: nothing is uploaded from the directory the
      # runner wrote to. The raw summary is scanned first and copied into an
      # empty staging directory only if it passes, so a scanner bug produces an
      # empty handoff rather than a leak.

      # The same shared scanner the shadow and generated-preview evidence use. An
      # unsafe file is quarantined on the runner and never uploaded; only its name
      # and a category are reported, never the matched content.
      - name: Scan Team State vNext proof for forbidden content
        continue-on-error: true
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')) }}
        run: |
          set -uo pipefail
          if [ -d artifacts/team-state-vnext-proof ]; then
            python backend/scripts/scan_forbidden_artifact_content.py \
              --directory artifacts/team-state-vnext-proof --quarantine \
              --label "Team State vNext Proof"
          else
            echo "No Team State vNext proof directory to scan."
          fi

      # Uploaded on always(). Evidence when an assertion fails is the entire point
      # of the mechanism, and a missing artifact is itself a signal the observer
      # job below reports.
      - name: Upload Team State vNext production proof
        continue-on-error: true
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')) }}
        uses: actions/upload-artifact@v4
        with:
          name: team-state-vnext-proof-${{ github.run_id }}
          path: artifacts/team-state-vnext-proof
          retention-days: 30
          if-no-files-found: warn

      - name: Prepare game-driven shadow handoff
        id: shadow-handoff-prepare
        continue-on-error: true
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'postgame')) || (github.event_name == 'schedule' && (github.event.schedule == '0 10 * * *' || github.event.schedule == '0 2,4,6 * * *'))) }}
        env:
          ACTIVATION_DIR: artifacts/game-driven-shadow
          HANDOFF_DIR: artifacts/game-driven-shadow-handoff
          DAILY_RUNNER_EXIT: ${{ steps.daily-sync.outputs.runner_exit_code }}
          POSTGAME_RUNNER_EXIT: ${{ steps.postgame-refresh.outputs.runner_exit_code }}
        run: |
          set -uo pipefail
          python backend/scripts/prepare_shadow_handoff.py \
            --source-dir "$ACTIVATION_DIR" \
            --staging-dir "$HANDOFF_DIR" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository-sha "${GITHUB_SHA}" \
            --daily-runner-exit "${DAILY_RUNNER_EXIT:-}" \
            --postgame-runner-exit "${POSTGAME_RUNNER_EXIT:-}"
          echo "Handoff preparation finished with exit $?. Publication-critical results for this run are unaffected."
          exit 0

      - name: Upload game-driven shadow handoff
        continue-on-error: true
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'postgame')) || (github.event_name == 'schedule' && (github.event.schedule == '0 10 * * *' || github.event.schedule == '0 2,4,6 * * *'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: game-driven-shadow-handoff-${{ github.run_id }}
          path: artifacts/game-driven-shadow-handoff
          retention-days: 7
          if-no-files-found: warn

  # ── Observer: Team State vNext production proof ─────────────────────────
  # Separated from public-sync for the same reason shadow-activation-health is:
  # internal-enrichment and static-team-story-preview both gate on public-sync
  # succeeding, so failing that job on a proof assertion would suppress the static
  # publication for a run whose sync, snapshot publication, appearance-ledger proof,
  # and dashboard verification all succeeded. The publication has already committed
  # by the time the proof is written; failing it protects nothing.
  #
  # This job holds NO production credential and runs NO production command. It reads
  # the uploaded evidence and renders a verdict. It cannot change the
  # publication-critical result of the run, and nothing downstream depends on it.
  team-state-vnext-proof:
    runs-on: ubuntu-latest
    needs: public-sync
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Team State vNext production proof
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: team-state-vnext-proof-${{ github.run_id }}
          path: artifacts/team-state-vnext-proof

      # The validator is standard library only: no database, no app context, no
      # network, and no secret. Exit 0 = valid and not FAIL, 1 = valid and FAIL,
      # 3 = the artifact itself is invalid (missing / empty / malformed / a verdict
      # softer than its own invariants).
      - name: Validate the Team State vNext production proof
        id: validate
        if: ${{ always() }}
        run: |
          set -uo pipefail
          proof=artifacts/team-state-vnext-proof/team-state-vnext-production-proof.json
          if [ ! -f "$proof" ]; then
            echo "::error::No Team State vNext proof artifact was produced by this publication."
            echo "verdict=missing" >> "$GITHUB_OUTPUT"
            exit 3
          fi
          set +e
          python backend/scripts/validate_team_state_vnext_proof.py "$proof" | tee proof-report.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "verdict_exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Append the proof verdict to the run summary
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "### Team State vNext production proof"
            echo
            if [ -f proof-report.txt ]; then
              echo '```'
              cat proof-report.txt
              echo '```'
            else
              echo "No proof report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Observer: game-driven shadow activation health ──────────────────────
  # Separated from public-sync so one red signal cannot mean two different
  # things. Before this split, a shadow-only defect failed the publication job
  # and skipped internal-enrichment and static-team-story-preview even though
  # the sync, snapshot publication, appearance-ledger proof, and dashboard
  # verification they depend on had all succeeded.
  #
  # This job holds NO production credential and runs NO production command. It
  # reads retained evidence and renders a verdict. It cannot change the
  # publication-critical result of the run, and nothing downstream depends on
  # it.
  #
  # It runs on always() rather than on public-sync succeeding: when a public
  # failure happens after the runner wrote its summary, that evidence is still
  # worth validating and preserving.
  shadow-activation-health:
    runs-on: ubuntu-latest
    needs: public-sync
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'postgame')) || (github.event_name == 'schedule' && (github.event.schedule == '0 10 * * *' || github.event.schedule == '0 2,4,6 * * *'))) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Capture rather than fail. A missing handoff is UNPROVEN activation
      # health decided by the final gate, not a job that dies before it can say
      # so.
      - name: Download game-driven shadow handoff
        id: handoff-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: game-driven-shadow-handoff-${{ github.run_id }}
          path: artifacts/game-driven-shadow-handoff

      - name: Validate game-driven shadow activation cycle
        id: activation-validate
        if: ${{ always() }}
        env:
          HANDOFF_DIR: artifacts/game-driven-shadow-handoff
          ACTIVATION_DIR: artifacts/game-driven-shadow
        run: |
          set -uo pipefail
          mkdir -p "$ACTIVATION_DIR"
          metadata="$HANDOFF_DIR/handoff-metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "::error title=Game-Driven Shadow::No handoff metadata was received. Activation evidence is missing, which is itself an activation failure."
            echo "2" > "$ACTIVATION_DIR/activation-exit-code"
            exit 0
          fi
          cycle="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("cycle_kind") or "")' "$metadata")"
          runner_exit="$(python -c 'import json,sys; v=json.load(open(sys.argv[1])).get("runner_exit_code"); print("" if v is None else v)' "$metadata")"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("handoff_status") or "")' "$metadata")"
          summary="$HANDOFF_DIR/$cycle-sync-summary.json"
          if [ "$status" != "ready" ] || [ -z "$cycle" ] || [ -z "$runner_exit" ] || [ ! -f "$summary" ]; then
            echo "::error title=Game-Driven Shadow::Handoff is not usable (status=${status:-unknown}, cycle=${cycle:-unknown}). Activation health is UNPROVEN."
            echo "2" > "$ACTIVATION_DIR/activation-exit-code"
            cp "$metadata" "$ACTIVATION_DIR/" 2>/dev/null || true
            exit 0
          fi
          cp "$summary" "$ACTIVATION_DIR/" 2>/dev/null || true
          cp "$metadata" "$ACTIVATION_DIR/" 2>/dev/null || true
          echo "cycle_kind=$cycle" >> "$GITHUB_OUTPUT"
          set +e
          python backend/scripts/validate_game_driven_shadow_cycle.py \
            --sync-summary "$summary" \
            --cycle-kind "$cycle" \
            --runner-exit-code "$runner_exit" \
            --summary-json "$ACTIVATION_DIR/$cycle-activation-summary.json" \
            --summary-markdown "$ACTIVATION_DIR/$cycle-activation-summary.md"
          validate_code=$?
          set -e
          echo "$validate_code" > "$ACTIVATION_DIR/activation-exit-code"
          case "$validate_code" in
            0) echo "::notice title=Game-Driven Shadow::$cycle cycle PASSED activation health." ;;
            1) echo "::error title=Game-Driven Shadow::$cycle cycle FAILED activation health. See the uploaded artifact." ;;
            *) echo "::error title=Game-Driven Shadow::Activation validator could not run (exit $validate_code)." ;;
          esac

      - name: Scan activation artifacts for secrets
        id: activation-scan
        if: ${{ always() }}
        env:
          ACTIVATION_DIR: artifacts/game-driven-shadow
        run: |
          set -uo pipefail
          mkdir -p "$ACTIVATION_DIR"
          # Runs BEFORE upload, through the same shared scanner the pre-handoff
          # scan uses, so one pattern list governs both. An unsafe artifact is
          # quarantined and never leaves the runner; only its filename and a
          # category are reported, never the matched content.
          set +e
          python backend/scripts/scan_forbidden_artifact_content.py \
            --directory "$ACTIVATION_DIR" --quarantine --label "Activation Artifact"
          scan_code=$?
          set -e
          if [ "$scan_code" -eq 0 ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Append activation summary
        if: ${{ always() }}
        env:
          ACTIVATION_DIR: artifacts/game-driven-shadow
          CYCLE_KIND: ${{ steps.activation-validate.outputs.cycle_kind }}
        run: |
          set -euo pipefail
          summary_file="$ACTIVATION_DIR/${CYCLE_KIND:-unknown}-activation-summary.md"
          if [ -f "$summary_file" ]; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## GAME-DRIVEN SHADOW ACTIVATION — EVIDENCE MISSING"
              echo
              echo "No activation summary was produced for this cycle."
              echo
              echo "This is an observer result only. It does not change this run's"
              echo "publication-critical outcome."
              echo
              echo "Current publication authority remains unchanged."
              echo "Automated write mode remains prohibited."
              echo "Authoritative mode remains prohibited."
              echo "Review the activation artifact before promotion or rollback."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload game-driven shadow activation artifacts
        id: activation-upload
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: game-driven-shadow-${{ github.run_id }}
          path: |
            artifacts/game-driven-shadow/*-sync-summary.json
            artifacts/game-driven-shadow/*-activation-summary.json
            artifacts/game-driven-shadow/*-activation-summary.md
            artifacts/game-driven-shadow/handoff-metadata.json
          retention-days: 30
          if-no-files-found: warn

      # Last, so every piece of evidence above is already preserved. Ten
      # conditions decide this; the helper evaluates them so the failure matrix
      # is provable rather than merely intended.
      - name: Game-driven shadow activation health gate
        if: ${{ always() }}
        env:
          HANDOFF_DIR: artifacts/game-driven-shadow-handoff
          ACTIVATION_DIR: artifacts/game-driven-shadow
          DOWNLOAD_OUTCOME: ${{ steps.handoff-download.outcome }}
          SCAN_SAFE: ${{ steps.activation-scan.outputs.safe }}
          UPLOAD_OUTCOME: ${{ steps.activation-upload.outcome }}
        run: |
          set -euo pipefail
          validator_code="$(cat "$ACTIVATION_DIR/activation-exit-code" 2>/dev/null || echo 2)"
          python backend/scripts/evaluate_shadow_activation_gate.py \
            --handoff-dir "$HANDOFF_DIR" \
            --handoff-download-outcome "${DOWNLOAD_OUTCOME:-failure}" \
            --validator-exit-code "$validator_code" \
            --final-scan-safe "${SCAN_SAFE:-false}" \
            --final-upload-outcome "${UPLOAD_OUTCOME:-failure}"
  internal-enrichment:
    runs-on: ubuntu-latest
    # Depends on the PUBLICATION-critical job only, never on observer health.
    # A failed shadow-activation-health job leaves this eligibility untouched.
    needs: public-sync
    if: ${{ needs.public-sync.result == 'success' }}
    continue-on-error: true
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run internal enrichment after daily public sync
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          INTERNAL_ENRICHMENT_COMMAND_TIMEOUT: 45m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Internal enrichment after daily public sync starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --kill-after=30s "$INTERNAL_ENRICHMENT_COMMAND_TIMEOUT" python backend/scripts/run_internal_enrichment.py --mode daily --source github_actions_internal
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Internal enrichment after daily public sync timed out after $INTERNAL_ENRICHMENT_COMMAND_TIMEOUT."
            else
              echo "::error::Internal enrichment after daily public sync failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Internal enrichment after daily public sync completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Run internal enrichment after postgame public sync
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'postgame') || (github.event_name == 'schedule' && github.event.schedule != '0 10 * * *') }}
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          INTERNAL_ENRICHMENT_COMMAND_TIMEOUT: 20m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Internal enrichment after postgame public sync starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          set +e
          timeout --kill-after=30s "$INTERNAL_ENRICHMENT_COMMAND_TIMEOUT" python backend/scripts/run_internal_enrichment.py --mode postgame --source github_actions_internal --skip-backtest
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ] || [ "$exit_code" -eq 143 ]; then
              echo "::error::Internal enrichment after postgame public sync timed out after $INTERNAL_ENRICHMENT_COMMAND_TIMEOUT."
            else
              echo "::error::Internal enrichment after postgame public sync failed with exit code $exit_code."
            fi
            exit "$exit_code"
          fi
          echo "Internal enrichment after postgame public sync completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  static-team-story-preview:
    runs-on: ubuntu-latest
    # Depends on the PUBLICATION-critical job only, never on observer health.
    # The success requirement is stated explicitly rather than left to the
    # implicit needs behaviour, so the actual prerequisite is readable here and
    # a shadow-only failure can never be mistaken for a reason to skip.
    needs: public-sync
    if: ${{ needs.public-sync.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')) }}
    # CI-003 / #598. The ONLY job in this workflow with repository write
    # authority. The workflow default is contents: read; this grant is the whole
    # reason the default could be narrowed.
    permissions:
      contents: write
    # CI-003 / #598 raised this from 15, by five minutes, for measured reasons.
    # The job now runs the required frontend gate — npm ci, the frontend test
    # suite, and the production build — against the exact generated tree before
    # that tree may become a commit on main. Measured on this repository at the
    # time of the change: npm ci 4s warm, npm test 34s over 920 tests, npm run
    # build 3s. Call it two minutes with a cold npm cache and Node setup. Twenty
    # leaves the previous generation budget completely intact and adds roughly
    # five minutes of headroom for about two minutes of new work.
    #
    # Deliberately bounded. This is publication validation, not an OPS-002-style
    # runtime expansion: it must stay small enough that a hung gate is killed by
    # the job rather than noticed by a human the next morning.
    timeout-minutes: 20
    env:
      # Runner-local evidence for this run. Never staged, never committed — the
      # staging step proves that directly by refusing any staged path outside
      # the generated team pages.
      GENERATED_EVIDENCE_DIR: artifacts/generated-team-preview
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # ── 1. GENERATE ─────────────────────────────────────────────────────────
      # Unchanged authority. The exporter resolves ONE trusted published
      # dashboard snapshot and fails closed with no live-builder fallback. Its
      # structured result is captured here because every downstream proof — the
      # delivery gate and the commit provenance — reads that result rather than
      # re-deriving anything about baseball.
      - name: Export static team story preview pages
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          BASEBALLOS_SITE_URL: https://baseballos.app
        run: |
          set -euo pipefail
          mkdir -p "$GENERATED_EVIDENCE_DIR"
          # The exporter writes its structured result itself, to the path named
          # by --result-out. stdout is NOT that channel and must never be
          # captured as one: scheduled run 31693516516 proved it in production.
          # The exporter's own imports print "[scheduler] AUTO_SYNC disabled" to
          # stdout before main() runs, so `| tee export-result.json` produced a
          # file whose first byte was not JSON, and the delivery gate correctly
          # refused to publish from evidence it could not read. stdout stays
          # visible in this log as the human diagnostic stream it always was.
          #
          # No pipeline, so the exporter's exit status is the step's directly: a
          # count mismatch (1), an unprovable trusted publication (2), or a
          # result file that could not be written (3) all still fail here,
          # before anything is validated or committed.
          python backend/scripts/export_team_story_pages.py \
            --output frontend/public \
            --site-url "$BASEBALLOS_SITE_URL" \
            --result-out "$GENERATED_EVIDENCE_DIR/export-result.json"

      # ── 2. DELIVERY GATE ────────────────────────────────────────────────────
      # Fail closed on delivery integrity only. It proves the filesystem agrees
      # with what the exporter declared it published: every declared page
      # present and non-empty, no stale page left behind, receipts present on
      # every dated claim, and ONE publication snapshot across the whole set. It
      # decides no baseball meaning — that stays with the generator.
      - name: Verify generated preview delivery contract
        id: delivery-gate
        run: |
          set -euo pipefail
          python backend/scripts/verify_generated_team_previews.py \
            --export-result "$GENERATED_EVIDENCE_DIR/export-result.json" \
            --output-root frontend/public \
            --digest-out "$GENERATED_EVIDENCE_DIR/generated-digest.json" \
            --summary-out "$GENERATED_EVIDENCE_DIR/delivery-verification.json"

      # ── 3. FRONTEND GATE ────────────────────────────────────────────────────
      # The same three commands canonical CI runs, in the same order, mirrored
      # from the frontend-tests job in .github/workflows/ci.yml. They run HERE,
      # after generation, so what they validate is the exact filesystem state
      # that is about to become a commit — not an earlier tree that never
      # contained these pages.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        id: frontend-tests
        working-directory: frontend
        run: npm test

      # Unit tests exercise modules; they do not prove the production bundle
      # compiles with these generated files in the public root. Both are
      # required, and neither may be soft-failed — no continue-on-error appears
      # on any gate in this job.
      - name: Build the production frontend bundle
        id: frontend-build
        working-directory: frontend
        run: npm run build

      # ── 4. STAGE THE VALIDATED TREE ─────────────────────────────────────────
      - name: Stage the validated generated tree
        id: stage
        run: |
          set -euo pipefail

          # Re-prove delivery against the post-build filesystem and compare the
          # digest byte for byte with the pre-gate digest. This is what makes
          # "the validated tree is the committed tree" a proof: the bytes that
          # passed npm test and npm run build are provably the bytes staged.
          python backend/scripts/verify_generated_team_previews.py \
            --export-result "$GENERATED_EVIDENCE_DIR/export-result.json" \
            --output-root frontend/public \
            --digest-out "$GENERATED_EVIDENCE_DIR/generated-digest-postbuild.json"
          if ! diff -u \
            "$GENERATED_EVIDENCE_DIR/generated-digest.json" \
            "$GENERATED_EVIDENCE_DIR/generated-digest-postbuild.json"; then
            echo "::error title=Generated Preview Publication::The generated files changed between validation and staging. The validated tree is not the tree that would be committed. Nothing is published."
            exit 1
          fi

          # Exact scope. Never `git add .` / `git add -A`: only the governed
          # generated delivery paths may enter this commit.
          # frontend/public/og/baseballos-card.svg is deliberately NOT staged —
          # it is a static committed asset that this generator never writes
          # (write_team_story_pages only emits team/**), so including it only
          # widened the commit's blast radius.
          git add -- frontend/public/team

          # Staged-diff detection, not worktree-diff detection. `git diff` is
          # blind to untracked files, so a newly generated page — a relocated
          # club, a changed abbreviation — used to look like "no changes" and
          # was silently never published. Comparing the INDEX to HEAD sees adds,
          # modifications, and deletions alike.
          if git diff --cached --quiet; then
            echo "No generated preview changes to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected="$(git diff --cached --name-only | grep -v '^frontend/public/team/' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error title=Generated Preview Publication::Refusing to publish: paths outside the generated delivery scope are staged:"
            echo "$unexpected"
            exit 1
          fi

          # The tree object the index represents, computed WITHOUT creating a
          # commit. This is the identity the generated commit must reproduce
          # exactly before anything is pushed.
          validated_tree_sha="$(git write-tree)"
          staged_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "validated_tree_sha=$validated_tree_sha" >> "$GITHUB_OUTPUT"
          echo "staged_count=$staged_count" >> "$GITHUB_OUTPUT"
          {
            echo "### Generated team preview publication"
            echo ""
            echo "- staged generated files: \`${staged_count}\`"
            echo "- validated tree: \`${validated_tree_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5. COMMIT UNDER THE MACHINE IDENTITY ────────────────────────────────
      # BaseballOS Automation is a machine identity, not a person and not a
      # vendor. It exists so automated repository history is separable from
      # human-authored history at a glance and by `git log --format=%an`.
      # Automated publication must never again be attributed to a human who did
      # not write it.
      - name: Commit generated team preview pages
        id: commit
        if: ${{ github.ref == 'refs/heads/main' && steps.stage.outputs.publish == 'true' }}
        env:
          VALIDATED_TREE_SHA: ${{ steps.stage.outputs.validated_tree_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "BaseballOS Automation"
          git config user.email "baseballoshq@gmail.com"

          # Provenance comes from the exporter's structured result, never from
          # scraping the rendered HTML.
          python - <<'PY' > "$GENERATED_EVIDENCE_DIR/commit-message.txt"
          import json
          import os

          summary_path = os.path.join(
              os.environ['GENERATED_EVIDENCE_DIR'], 'delivery-verification.json'
          )
          with open(summary_path, encoding='utf-8') as handle:
              summary = json.load(handle)

          lines = [
              'docs: publish generated team preview pages',
              '',
              'Generated by the BaseballOS Bullpen Sync scheduled daily publication',
              'from one trusted published dashboard snapshot. The staged tree passed',
              'the generated-delivery gate, the frontend test suite, and the',
              'production frontend build before this commit was created.',
              '',
              f"Workflow-Run: {os.environ['WORKFLOW_RUN_ID']}",
              f"Workflow-Run-Attempt: {os.environ['WORKFLOW_RUN_ATTEMPT']}",
              f"Source-SHA: {os.environ['WORKFLOW_SOURCE_SHA']}",
              f"Validated-Tree: {os.environ['VALIDATED_TREE_SHA']}",
          ]
          snapshot_id = summary.get('snapshot_id')
          if snapshot_id not in (None, ''):
              lines.append(f'Snapshot-ID: {snapshot_id}')
          data_through = summary.get('data_through')
          if data_through not in (None, ''):
              lines.append(f'Data-Through: {data_through}')
          print('\n'.join(lines))
          PY

          git commit -F "$GENERATED_EVIDENCE_DIR/commit-message.txt"

          generated_commit_sha="$(git rev-parse HEAD)"
          generated_commit_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          echo "generated_commit_sha=$generated_commit_sha" >> "$GITHUB_OUTPUT"
          echo "generated_commit_tree_sha=$generated_commit_tree_sha" >> "$GITHUB_OUTPUT"

          # THE TREE-EXACT CLOSE. The commit must reproduce the validated tree
          # object exactly. If it does not, the thing that was tested is not the
          # thing that would be published, and nothing is pushed.
          if [ "$generated_commit_tree_sha" != "$VALIDATED_TREE_SHA" ]; then
            echo "::error title=Generated Preview Publication::Tree mismatch. Validated tree ${VALIDATED_TREE_SHA} but the generated commit carries tree ${generated_commit_tree_sha}. The validated tree is not the committed tree; refusing to push."
            exit 1
          fi
          echo "Tree-exact validation proven: ${generated_commit_tree_sha}"
          {
            echo "- generated commit: \`${generated_commit_sha}\`"
            echo "- generated commit tree: \`${generated_commit_tree_sha}\` (matches validated tree)"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 6. PUBLISH ──────────────────────────────────────────────────────────
      # Fast-forward only. No --force, no --force-with-lease, no reset, no
      # automatic rebase or merge. If main advanced while this run was
      # generating, the push is refused and this job fails loudly. That is the
      # correct outcome: the previously published pages stay in place and keep
      # stating the baseball date they actually describe, and no human work is
      # ever overwritten to publish a preview.
      - name: Publish generated team preview pages to main
        id: publish
        if: ${{ github.ref == 'refs/heads/main' && steps.stage.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/main

      # ── 7. PROVENANCE EVIDENCE ──────────────────────────────────────────────
      # Runs on always() so a FAILED publication is as well evidenced as a
      # successful one. Non-secret metadata only.
      - name: Record generated publication provenance
        if: ${{ always() }}
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
          DELIVERY_RESULT: ${{ steps.delivery-gate.outcome }}
          FRONTEND_TEST_RESULT: ${{ steps.frontend-tests.outcome }}
          FRONTEND_BUILD_RESULT: ${{ steps.frontend-build.outcome }}
          PUBLISH_DECISION: ${{ steps.stage.outputs.publish }}
          VALIDATED_TREE_SHA: ${{ steps.stage.outputs.validated_tree_sha }}
          GENERATED_COMMIT_SHA: ${{ steps.commit.outputs.generated_commit_sha }}
          GENERATED_COMMIT_TREE_SHA: ${{ steps.commit.outputs.generated_commit_tree_sha }}
          PUSH_RESULT: ${{ steps.publish.outcome }}
          GENERATED_FILE_COUNT: ${{ steps.stage.outputs.staged_count }}
        run: |
          set -euo pipefail
          mkdir -p "$GENERATED_EVIDENCE_DIR"
          python - <<'PY'
          import json
          import os

          evidence_dir = os.environ['GENERATED_EVIDENCE_DIR']
          summary = {}
          summary_path = os.path.join(evidence_dir, 'delivery-verification.json')
          try:
              with open(summary_path, encoding='utf-8') as handle:
                  summary = json.load(handle)
          except (OSError, ValueError):
              summary = {}

          def value(name):
              raw = os.environ.get(name) or ''
              return raw or None

          record = {
              'workflow_run_id': value('WORKFLOW_RUN_ID'),
              'workflow_run_attempt': value('WORKFLOW_RUN_ATTEMPT'),
              'workflow_source_sha': value('WORKFLOW_SOURCE_SHA'),
              'generated_commit_sha': value('GENERATED_COMMIT_SHA'),
              'validated_tree_sha': value('VALIDATED_TREE_SHA'),
              'generated_commit_tree_sha': value('GENERATED_COMMIT_TREE_SHA'),
              'tree_exact': (
                  value('VALIDATED_TREE_SHA') is not None
                  and value('VALIDATED_TREE_SHA') == value('GENERATED_COMMIT_TREE_SHA')
              ),
              'snapshot_id': summary.get('snapshot_id'),
              'data_through': summary.get('data_through'),
              'validation_result': value('DELIVERY_RESULT'),
              'frontend_test_result': value('FRONTEND_TEST_RESULT'),
              'frontend_build_result': value('FRONTEND_BUILD_RESULT'),
              'publish_decision': value('PUBLISH_DECISION'),
              'push_result': value('PUSH_RESULT'),
              'generated_file_count': summary.get('generated_file_count'),
              'staged_file_count': value('GENERATED_FILE_COUNT'),
              'timestamp': summary.get('generated_at'),
          }
          path = os.path.join(evidence_dir, 'publication-provenance.json')
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(record, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      # The same shared scanner the shadow-activation artifacts use. An unsafe
      # file is quarantined on the runner and never uploaded; only its name and
      # a category are reported, never the matched content.
      - name: Scan generated publication evidence for secrets
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f "$GENERATED_EVIDENCE_DIR/commit-message.txt"
          python backend/scripts/scan_forbidden_artifact_content.py \
            --directory "$GENERATED_EVIDENCE_DIR" --quarantine \
            --label "Generated Preview Evidence"

      - name: Upload generated publication validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-team-preview-validation-${{ github.run_id }}
          path: |
            artifacts/generated-team-preview/export-result.json
            artifacts/generated-team-preview/delivery-verification.json
            artifacts/generated-team-preview/generated-digest.json
            artifacts/generated-team-preview/publication-provenance.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload team story preview pages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: team-story-preview-pages-${{ github.run_id }}
          path: frontend/public/team
          retention-days: 30
          if-no-files-found: warn

  # Manual-only, AUDIT-ONLY intraday reconciliation (Phase 1). This job never
  # runs on a schedule — there is deliberately no cron entry for it. It reads
  # authoritative source state, compares it with stored BaseballOS state, and
  # uploads a structured JSON audit of what would need to change. It performs no
  # canonical baseball-data writes, publishes no snapshot, runs no fatigue/story
  # work, and warms no public cache, so it is fully isolated from the publish
  # lane above (no ledger gate, no snapshot-cache verification).
  intraday-audit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'intraday' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run intraday reconciliation audit (check-only, no writes)
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Production Flask initialization (create_app under APP_ENV=production)
          # requires the admin token so operational write endpoints are never
          # exposed to anonymous callers. The audit itself remains read-only;
          # supplying this token neither authorizes nor triggers any write.
          ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
          AUTO_SYNC: 'false'
          INTRADAY_AUDIT_COMMAND_TIMEOUT: 15m
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing DATABASE_URL, SECRET_KEY, or BASEBALLOS_ADMIN_API_TOKEN repository secret."
            exit 1
          fi
          echo "Intraday reconciliation audit starting at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # The command writes the JSON artifact to --output and also prints the
          # single JSON object to stdout (workflow log). We capture its exit code
          # but do NOT fail the step here, so the always() validate + upload steps
          # below run first; the original exit code is re-applied afterward. Even
          # a bootstrap failure produces a valid failed JSON artifact.
          set +e
          timeout --kill-after=30s "$INTRADAY_AUDIT_COMMAND_TIMEOUT" \
            python backend/scripts/run_intraday_reconcile.py \
            --source github_actions --json --output intraday-reconciliation-audit.json
          exit_code=$?
          set -e
          echo "$exit_code" > intraday-audit-exit-code
          case "$exit_code" in
            0) echo "Intraday reconciliation audit completed (success/skipped) at $(date -u +'%Y-%m-%dT%H:%M:%SZ')." ;;
            1) echo "::warning::Intraday reconciliation audit returned partial/failed verification (exit 1). See the uploaded artifact." ;;
            124|137|143) echo "::error::Intraday reconciliation audit timed out after $INTRADAY_AUDIT_COMMAND_TIMEOUT." ;;
            *) echo "::error::Intraday reconciliation audit failed with exit code $exit_code." ;;
          esac

      # Validate the audit artifact BEFORE upload, without hiding the command's
      # original exit code. A missing / empty / malformed / wrong-capability
      # artifact is an artifact-contract failure, distinct from a normal
      # partial/failed audit (which still produces a valid, recognized JSON
      # report). The result is recorded for the exit-code step below.
      - name: Validate intraday audit artifact contract
        if: ${{ always() }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/validate_intraday_artifact.py intraday-reconciliation-audit.json
          validate_code=$?
          set -e
          if [ "$validate_code" -eq 0 ]; then
            echo "1" > intraday-audit-artifact-valid
            echo "Intraday audit artifact passed the output-contract check."
          else
            echo "0" > intraday-audit-artifact-valid
            echo "::error::Intraday audit artifact failed the output-contract check (missing, empty, malformed, or wrong capability/mode/check_only/status)."
          fi

      - name: Upload intraday audit artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: intraday-reconciliation-audit-${{ github.run_id }}
          path: intraday-reconciliation-audit.json
          if-no-files-found: ignore

      - name: Preserve intraday audit exit code
        if: ${{ always() }}
        run: |
          set -euo pipefail
          code="$(cat intraday-audit-exit-code 2>/dev/null || echo 1)"
          artifact_valid="$(cat intraday-audit-artifact-valid 2>/dev/null || echo 0)"
          # A genuine failed/partial audit keeps its own exit code (never turned
          # green). If no valid artifact was produced at all, report an
          # artifact-contract failure rather than a normal partial audit.
          if [ "$artifact_valid" != "1" ]; then
            echo "::error::Intraday audit artifact-contract failure: no valid intraday-reconciliation-audit.json was produced. This is an artifact-contract failure, not a normal partial audit."
            if [ "$code" = "0" ]; then
              code=1
            fi
          fi
          echo "Re-applying intraday audit exit code: $code"
          exit "$code"

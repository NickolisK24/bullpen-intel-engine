name: Foundation 3C Read-Only Ingestion Profile

# TEMPORARY Foundation 3C diagnostic. Manual dispatch only — never on a
# schedule, push, or pull request. It runs
# backend/scripts/profile_daily_ingestion_readonly.py, which:
#
#   * reproduces the exact current daily pitcher universe query and classifies
#     every selected row with the canonical roster/role/appearance authorities;
#   * profiles the real MLB gameLog request and the real parse / window-filter /
#     existing-row comparison for a bounded deterministic sample;
#   * opens every database session with SET TRANSACTION READ ONLY, actively
#     probes that a write is refused, and compares table fingerprints before and
#     after, failing the run on any drift.
#
# It never invokes the sync writer, never creates a SyncRun or dead letter,
# never migrates, and never runs the daily sync. Structure, secret usage, Python
# setup, and artifact conventions are copied from
# .github/workflows/official-starter-alignment-audit.yml so this introduces no
# second production-access architecture. ADMIN_API_TOKEN is required even though
# this diagnostic calls no write endpoint: ProductionConfig.init_app refuses to
# build the app without it, and importing app.py builds the app.
#
# Delete this workflow once the Foundation 3C evidence has been reviewed.

on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: 'Represented baseball date (YYYY-MM-DD). Defaults to today UTC.'
        required: false
        type: string
      sample_size:
        description: 'Pitchers to profile against the MLB API (max 60).'
        required: false
        default: '60'
        type: string
      skip_profile:
        description: 'Classification only — makes no MLB request.'
        required: false
        default: false
        type: boolean

concurrency:
  group: foundation-3c-readonly-profile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate required secrets are present
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] \
             || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          echo "Required production secrets are present."

      - name: Bound the requested sample size
        id: bounds
        env:
          REQUESTED: ${{ inputs.sample_size }}
        run: |
          set -euo pipefail
          requested="${REQUESTED:-60}"
          case "$requested" in
            ''|*[!0-9]*) requested=60 ;;
          esac
          if [ "$requested" -gt 60 ]; then requested=60; fi
          if [ "$requested" -lt 1 ]; then requested=1; fi
          echo "sample_size=$requested" >> "$GITHUB_OUTPUT"
          echo "Profiling at most $requested pitchers."

      - name: Run the read-only ingestion diagnostic
        id: diagnostic
        working-directory: backend
        env:
          OUT_DIR: ${{ runner.temp }}/foundation-3c-readonly-profile
          SAMPLE_SIZE: ${{ steps.bounds.outputs.sample_size }}
          REFERENCE_DATE: ${{ inputs.reference_date }}
          SKIP_PROFILE: ${{ inputs.skip_profile }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          args=(--read-only --require-engine-read-only
                --sample-size "$SAMPLE_SIZE"
                --output "$OUT_DIR/foundation-3c-readonly-profile.json"
                --markdown-output "$OUT_DIR/foundation-3c-readonly-profile.md")
          if [ -n "${REFERENCE_DATE:-}" ]; then
            args+=(--reference-date "$REFERENCE_DATE")
          fi
          if [ "${SKIP_PROFILE:-false}" = "true" ]; then
            args+=(--skip-profile)
          fi

          # Raw stdout is suppressed by --output. A nonzero exit must still
          # reach the artifact upload, so the exit code is captured, not thrown.
          set +e
          python scripts/profile_daily_ingestion_readonly.py "${args[@]}"
          diagnostic_exit=$?
          set -e
          echo "diagnostic_exit=$diagnostic_exit" >> "$GITHUB_OUTPUT"

      - name: Verify sanitization and build the run summary
        if: ${{ always() }}
        env:
          OUT_DIR: ${{ runner.temp }}/foundation-3c-readonly-profile
          DIAGNOSTIC_EXIT: ${{ steps.diagnostic.outputs.diagnostic_exit }}
          RUN_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          out_dir = Path(os.environ['OUT_DIR'])
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          classification = {'0': 'OK', '1': 'RECONCILIATION_FAILED', '2': 'ERROR'}
          exit_code = os.environ.get('DIAGNOSTIC_EXIT', '2')

          json_path = out_dir / 'foundation-3c-readonly-profile.json'
          report = {}
          if json_path.exists():
              try:
                  report = json.loads(json_path.read_text())
              except Exception:
                  report = {}

          # Fail closed on any credential-shaped content reaching an artifact.
          forbidden = re.compile(
              r'postgres(ql)?://|password=|X-Admin-Token|Authorization:|SECRET_KEY',
              re.IGNORECASE,
          )
          leaked = []
          for path in sorted(out_dir.glob('*')):
              if path.is_file() and forbidden.search(path.read_text(errors='ignore')):
                  leaked.append(path.name)
          if leaked:
              print(f"::error::Sanitization check failed for: {', '.join(leaked)}")
              for path in leaked:
                  (out_dir / path).unlink()
              raise SystemExit(1)

          # An import failure is reported by stage and target so the next
          # repair is exact. No exception message or path is ever printed.
          if report.get('reason') == 'import_failed':
              lines = [
                  '## Foundation 3C read-only ingestion profile',
                  '',
                  f"- Result: **{report.get('result')}** (exit {exit_code})",
                  f"- Commit: `{os.environ.get('RUN_COMMIT', '')}`",
                  '',
                  '### Import failure',
                  '',
                  f"- Exception type: `{report.get('exception_type')}`",
                  f"- Import stage: `{report.get('import_stage')}`",
                  f"- Module: `{report.get('module_name')}`",
                  f"- Missing symbol: `{report.get('missing_name')}`",
                  f"- Import target: `{report.get('import_target')}`",
                  f"- Sanitized: **{report.get('sanitized')}**",
                  '',
                  'No exception message, traceback, or filesystem path is reported.',
              ]
              summary_path.write_text('\n'.join(lines) + '\n')
              raise SystemExit(0)

          universe = report.get('universe') or {}
          profile = report.get('profile') or {}
          accounting = universe.get('accounting') or {}
          lines = [
              '## Foundation 3C read-only ingestion profile',
              '',
              f"- Result: **{classification.get(exit_code, 'UNKNOWN')}** (exit {exit_code})",
              f"- Commit: `{os.environ.get('RUN_COMMIT', '')}`",
              f"- Run: {os.environ.get('RUN_ID', '')} attempt {os.environ.get('RUN_ATTEMPT', '')}",
              f"- Read-only protection: `{report.get('read_only_protection')}`",
              f"- Write probe refused: **{(report.get('write_probe') or {}).get('refused')}**",
              f"- Table drift detected: **{len(report.get('write_drift') or [])}**",
              f"- Sanitization check: **passed**",
              '',
              f"- Pitchers selected: **{universe.get('selected_total')}**",
              f"- Category sum reconciles: **{accounting.get('category_sum_equals_selected')}**",
              f"- Criticality sum reconciles: **{accounting.get('criticality_sum_equals_selected')}**",
              f"- Criticality: `{universe.get('criticality_counts')}`",
              f"- Profiled sample: **{profile.get('succeeded')}** succeeded / "
              f"**{profile.get('failed')}** failed of {profile.get('sample_size')}",
              '',
              'Full evidence is in the uploaded artifact.',
          ]
          summary_path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-3c-readonly-profile
          path: ${{ runner.temp }}/foundation-3c-readonly-profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job when the diagnostic did not reconcile
        if: ${{ always() }}
        env:
          DIAGNOSTIC_EXIT: ${{ steps.diagnostic.outputs.diagnostic_exit }}
        run: |
          set -euo pipefail
          if [ "${DIAGNOSTIC_EXIT:-2}" != "0" ]; then
            echo "::error::Diagnostic exited ${DIAGNOSTIC_EXIT:-2}; see the artifact."
            exit 1
          fi
          echo "Diagnostic reconciled."

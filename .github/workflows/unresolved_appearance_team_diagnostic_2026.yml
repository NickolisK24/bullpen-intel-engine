name: 2026 Unresolved Appearance-Team Diagnostic

on:
  workflow_dispatch:
    inputs:
      game_log_id:
        description: Exact GameLog primary key
        required: true
        default: '41040'
        type: string
      game_pk:
        description: Expected MLB gamePk guard
        required: true
        default: '824262'
        type: string
      game_date:
        description: Expected official game date guard (YYYY-MM-DD)
        required: true
        default: '2026-06-23'
        type: string

concurrency:
  group: unresolved-appearance-team-diagnostic-2026
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      FLASK_APP: app.py
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate diagnostic inputs
        env:
          GAME_LOG_ID: ${{ inputs.game_log_id }}
          GAME_PK: ${{ inputs.game_pk }}
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          if ! [[ "$GAME_LOG_ID" =~ ^[0-9]+$ ]] || ! [[ "$GAME_PK" =~ ^[0-9]+$ ]]; then
            echo "::error::game_log_id and game_pk must contain only digits."
            exit 1
          fi
          if ! [[ "$GAME_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::game_date must be YYYY-MM-DD."
            exit 1
          fi
          echo "Read-only unresolved appearance-team diagnostic inputs validated."

      - name: Run read-only identity diagnostic
        working-directory: backend
        env:
          GAME_LOG_ID: ${{ inputs.game_log_id }}
          GAME_PK: ${{ inputs.game_pk }}
          GAME_DATE: ${{ inputs.game_date }}
          DIAGNOSTIC_OUTPUT_DIR: ${{ runner.temp }}/unresolved-appearance-team-diagnostic-2026
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_OUTPUT_DIR"
          report_json="$DIAGNOSTIC_OUTPUT_DIR/unresolved-appearance-team-diagnostic-2026.json"

          set +e
          python scripts/run_unresolved_appearance_team_diagnostic_2026.py \
            --game-log-id "$GAME_LOG_ID" \
            --game-pk "$GAME_PK" \
            --game-date "$GAME_DATE" \
            --compact \
            --output "$report_json"
          diagnostic_exit_code=$?
          set -e

          python - "$report_json" "$diagnostic_exit_code" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          summary_path = Path(sys.argv[3])
          payload = json.loads(path.read_text(encoding='utf-8'))
          target = payload.get('target') or {}
          teams = payload.get('official_game_teams') or []
          lines = payload.get('official_pitching_lines') or []
          stat_matches = payload.get('exact_stat_matches') or []

          summary = [
              '## 2026 Unresolved Appearance-Team Diagnostic',
              '',
              f"- Result: `{payload.get('result')}`",
              f"- Exit code: `{exit_code}`",
              f"- Decision reasons: `{payload.get('decision_reasons')}`",
              f"- GameLog id: `{target.get('game_log_id')}`",
              f"- Internal pitcher id: `{target.get('pitcher_id')}`",
              f"- Stored pitcher MLB id: `{target.get('pitcher_mlb_id')}`",
              f"- Stored pitcher name: `{target.get('pitcher_name')}`",
              f"- Target MLB id present in official lines: `{payload.get('target_mlb_id_present')}`",
              f"- Target MLB id match count: `{payload.get('target_mlb_id_match_count')}`",
              f"- Exact stat match count: `{payload.get('exact_stat_match_count')}`",
              f"- Official pitching line count: `{payload.get('official_pitching_line_count')}`",
              f"- Official teams: `{teams}`",
              f"- Database writes performed: `{payload.get('database_writes_performed')}`",
              '',
              '### Exact stat matches',
          ]
          summary.extend(f"- `{item}`" for item in stat_matches)
          summary.extend(('', '### Official pitching identities'))
          summary.extend(
              f"- `{item.get('player_id')}` · {item.get('name')} · {item.get('side')} · team `{item.get('team_id')}`"
              for item in lines
          )
          summary_path.write_text('\n'.join(summary) + '\n', encoding='utf-8')

          if payload.get('database_writes_performed') is not False:
              raise SystemExit('Diagnostic must not perform database writes.')
          PY

          exit "$diagnostic_exit_code"

      - name: Upload private diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unresolved-appearance-team-diagnostic-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/unresolved-appearance-team-diagnostic-2026/
          if-no-files-found: error
          retention-days: 14

name: Phantom GameLog Guard

on:
  pull_request:
    paths:
      - 'backend/services/appearance_team_authority.py'
      - 'backend/services/phantom_game_log_reconciliation.py'
      - 'backend/scripts/run_phantom_game_log_reconciliation.py'
      - 'backend/tests/test_phantom_game_log_reconciliation.py'
      - 'backend/tests/test_zero_out_game_log_ingestion_guard.py'
      - '.github/workflows/phantom_game_log_reconciliation.yml'
      - '.github/workflows/phantom_game_log_guard.yml'

concurrency:
  group: phantom-game-log-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  focused-postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseballos_phantom_guard_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseballos_phantom_guard_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AUTO_SYNC: 'false'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_phantom_guard_tests
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baseballos_phantom_guard_tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run focused phantom reconciliation tests
        id: focused_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -u -m pytest \
            tests/test_phantom_game_log_reconciliation.py \
            tests/test_zero_out_game_log_ingestion_guard.py \
            -vv -ra --tb=short 2>&1 | tee phantom_guard_pytest.txt

      - name: Report focused failure on the pull request
        if: ${{ steps.focused_tests.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/phantom_guard_pytest.txt', 'utf8');
            const tail = report.split('\n').slice(-160).join('\n');
            const body = [
              '## Phantom GameLog Guard failure',
              '',
              '```text',
              tail,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce focused guard result
        if: ${{ steps.focused_tests.outcome == 'failure' }}
        run: exit 1

name: Foundation 3C R2 Full-Window Shadow Review

# ONE operation, fully pinned: a read-only shadow reconciliation of the COMPLETE
# governed July 22-29 ingestion window, at reference date 2026-07-29.
#
# R1 proved the D-008 innings repair against the five games the first controlled
# write already reconciled: 38 rows replayed to zero mutations with 14 decimal
# companion differences recognised and ignored. R2 asks the harder question —
# does that repair hold across the whole window, and is anything still
# outstanding there safe enough for a human to review?
#
# R2 gathers evidence. It decides nothing. A run that ends REVIEW REQUIRED is a
# successful run that approves no write: R3/R4 stay blocked until the update
# manifest is reviewed. A run that ends FAILED is a rollout stop, never a
# warning.
#
# Nothing here is an input. The date and the mode are hard-coded so the run
# cannot be misconfigured from a phone — there is nothing to type and nothing to
# get wrong.
#
# It writes no baseball data. It relies on the merged Foundation 3C shadow path,
# which is logically read-only before any transaction handling, and adds no
# compensating write, cleanup, or write-and-roll-back of its own.

on:
  workflow_dispatch:

concurrency:
  group: foundation-3c-r2-full-window-shadow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r2-full-window-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      AUTO_SYNC: 'false'
      # Defense in depth. The CLI is given --mode shadow explicitly; this
      # additionally proves the run does not enable the automated lane.
      GAME_DRIVEN_INGESTION_MODE: 'off'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ADMIN_API_TOKEN: ${{ secrets.BASEBALLOS_ADMIN_API_TOKEN }}
      REPORT_PATH: artifacts/r2-full-window-shadow.json
      SUMMARY_JSON_PATH: artifacts/r2-validation-summary.json
      SUMMARY_MARKDOWN_PATH: artifacts/r2-validation-summary.md
      MANIFEST_JSON_PATH: artifacts/r2-update-review.json
      MANIFEST_MARKDOWN_PATH: artifacts/r2-update-review.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate required secrets are present
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${SECRET_KEY:-}" ] \
             || [ -z "${ADMIN_API_TOKEN:-}" ]; then
            echo "::error::Missing required production repository secret."
            exit 1
          fi
          echo "Required production secrets are present."

      - name: Run the R2 full-window shadow reconciliation
        id: shadow
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # A nonzero exit must still reach validation and artifact upload, so
          # the code is captured rather than thrown.
          set +e
          python backend/scripts/game_driven_ingestion.py --mode shadow --reference-date 2026-07-29 --output "$REPORT_PATH"
          shadow_exit=$?
          set -e
          echo "shadow_exit=$shadow_exit" >> "$GITHUB_OUTPUT"

      - name: Validate the R2 report
        id: validate
        if: ${{ always() }}
        env:
          REPOSITORY_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          set +e
          python backend/scripts/validate_r2_shadow_report.py \
            --report "$REPORT_PATH" \
            --summary-json "$SUMMARY_JSON_PATH" \
            --summary-markdown "$SUMMARY_MARKDOWN_PATH" \
            --manifest-json "$MANIFEST_JSON_PATH" \
            --manifest-markdown "$MANIFEST_MARKDOWN_PATH" \
            --repository-sha "$REPOSITORY_SHA" \
            --run-id "$WORKFLOW_RUN_ID"
          validation_exit=$?
          set -e
          echo "validation_exit=$validation_exit" >> "$GITHUB_OUTPUT"

      - name: Scan artifacts for credential-shaped content
        id: scan
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          # Fail closed on anything credential-shaped reaching an artifact. The
          # matched text is never printed — only the filename and the category.
          forbidden = re.compile(
              r'postgresql://|postgres://|password\s*=|Authorization\s*:'
              r'|X-Admin-Token|ADMIN_API_TOKEN|SECRET_KEY|DATABASE_URL'
              r'|BASEBALLOS_ADMIN_API_TOKEN'
              r'|token\s*=|api[_-]?key\s*=|secret\s*=',
              re.IGNORECASE,
          )
          leaked = []
          for path in sorted(Path('artifacts').glob('*')):
              if path.is_file() and forbidden.search(path.read_text(errors='ignore')):
                  leaked.append(path.name)
                  path.unlink()
          if leaked:
              print(f"::error::Sanitization check failed for: {', '.join(leaked)}")
              raise SystemExit(1)
          print('Artifact sanitization check passed.')
          PY

      - name: Write the job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f "$SUMMARY_MARKDOWN_PATH" ]; then
            cat "$SUMMARY_MARKDOWN_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## FOUNDATION 3C R2 — FAILED'
              echo
              echo '- Failed invariant: `shadow_command_produced_no_report`'
              echo '- Artifact: `r2-full-window-shadow.json`'
              echo
              echo 'This is a rollout stop. R3/R4 must not begin.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the R2 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-3c-r2-full-window-shadow-review
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Report the R2 result
        if: ${{ always() }}
        env:
          SHADOW_EXIT: ${{ steps.shadow.outputs.shadow_exit }}
          VALIDATION_EXIT: ${{ steps.validate.outputs.validation_exit }}
        run: |
          set -euo pipefail
          if [ "${SHADOW_EXIT:-2}" != "0" ]; then
            echo "::error::R2 shadow reconciliation exited ${SHADOW_EXIT:-2}. Rollout stops here."
            exit 1
          fi
          if [ "${VALIDATION_EXIT:-2}" != "0" ]; then
            echo "::error::R2 validation failed; see the job summary. Rollout stops here."
            exit 1
          fi
          echo "R2 completed safely. R3/R4 remain blocked until review when updates are present."

            4LRCXSlQsDgQ1LZ4KHsl4cq7K51N6FOXQBLB5q4lMKhs0VUhCT8Pdsj12+84laCV
            c22q6p2mdT9SaernCSRnWazXWisgpjv3H7Ex4S1DCYjJIwn3PUToGFv1r8YRN2/S
            O19yVSxxCIf64Sg=
            -----END CERTIFICATE-----
          TARGET_HOST: ${{ vars.BASEBALLOS_V3_REHEARSAL_TARGET_HOST }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -eu
          umask 077
          python3 - <<'PY'
          import os, re, socket, ssl, struct, subprocess, tempfile
          from urllib.parse import unquote, urlsplit

          ref = "jbhzvzlqrledmlqrlzim"
          host = "aws-1-us-east-2.pooler.supabase.com"
          ca = os.environ["ROOT_CA"]
          context = ssl.create_default_context()
          if ca:
              context.load_verify_locations(cadata=ca)
          def probe(endpoint, address):
              with socket.create_connection((address, 5432), timeout=10) as sock:
                  print(f"TCP connected to {endpoint}:5432", flush=True)
                  sock.sendall(struct.pack("!II", 8, 80877103))
                  if sock.recv(1) != b"S":
                      raise SystemExit("PostgreSQL TLS negotiation refused.")
                  with context.wrap_socket(sock, server_hostname=endpoint) as tls:
                      print(f"{tls.version()} certificate chain and hostname verified for {endpoint}", flush=True)

          address = socket.getaddrinfo(host, 5432, socket.AF_INET, socket.SOCK_STREAM)[0][4][0]
          print(f"IPv4 DNS resolved {host} to {address}", flush=True)
          probe(host, address)
          target = os.environ["TARGET_HOST"]
          if target:
              if not re.fullmatch(r"db\.[a-z0-9]{20}\.supabase\.co", target) or target == f"db.{ref}.supabase.co":
                  raise SystemExit("Expected an independent destination direct hostname.")
              probe(target, target)
              print("Destination direct DNS and TLS passed.")
          else:
              print("Destination connectivity pending assignment of a project reference.")

          if os.environ["PHASE"] == "source-snapshot":
              url = urlsplit(os.environ["EXPORT_URL"])
              if url.hostname != host:
                  raise SystemExit("Dedicated export route differs from the preflight route.")
              user = unquote(url.username or "")
              if user != f"baseballos_v3_export.{ref}" or (url.port or 5432) != 5432:
                  raise SystemExit("Expected the dedicated export login on the session pooler at port 5432.")
              if not target:
                  raise SystemExit("Destination endpoint required for source snapshot phase.")
              with tempfile.NamedTemporaryFile(mode="w") as cert:
                  cert.write(ca)
                  cert.flush()
                  env = dict(PATH=os.environ["PATH"], PGHOST=host, PGPORT="5432",
                             PGUSER=user, PGDATABASE="postgres", PGPASSWORD=unquote(url.password or ""),
                             PGSSLMODE="verify-full", PGCONNECT_TIMEOUT="10",
                             PGSSLROOTCERT=cert.name if ca else ssl.get_default_verify_paths().cafile)
                  def psql():
                      return subprocess.Popen(["psql","-XqAt","-v","ON_ERROR_STOP=1"],
                          env=env, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                          stderr=subprocess.DEVNULL, text=True)
                  with psql() as exporter:
                      try:
                          exporter.stdin.write("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;\nSELECT pg_export_snapshot();\n")
                          exporter.stdin.flush()
                          snapshot = exporter.stdout.readline().strip()
                          if not re.fullmatch(r"[0-9A-Fa-f-]+", snapshot):
                              raise SystemExit("Dedicated login or snapshot export failed.")
                          with psql() as reader:
                              reader.communicate("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;\n"
                                  f"SET TRANSACTION SNAPSHOT '{snapshot}';\nSELECT 1;\nROLLBACK;\n", timeout=30)
                              if reader.returncode:
                                  raise SystemExit("Independent session could not import snapshot.")
                      finally:
                          exporter.stdin.close()
                          exporter.wait(timeout=15)
                  print("Two dedicated read-only sessions shared a snapshot.")
          PY
      - name: Measure available archive space and memory
        if: ${{ !cancelled() }}
        run: |
          df -B1 --output=avail "$RUNNER_TEMP"
          awk '/MemAvailable:/ {print "Available memory (KiB):", $2}' /proc/meminfo
          echo "A full copy must fit one hosted job (360 minutes including verification)."
      - name: Exercise snapshot lifetime and private archive handling with synthetic data
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/sync-v3.XXXXXXXX")
          cleanup() {
            docker rm -fv sync-v3-fixture >/dev/null 2>&1 || true
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          # No network interface or published port. Local trust is confined to the fixture.
          docker run -d --network none --name sync-v3-fixture -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17 >/dev/null
          for attempt in {1..60}; do
            if docker exec sync-v3-fixture pg_isready -h 127.0.0.1 -U postgres >/dev/null; then break; fi
            sleep 1
          done
          sql() { docker exec -i sync-v3-fixture psql -XqAt -v ON_ERROR_STOP=1 -U postgres "$@"; }
          sql -c 'CREATE TABLE fixture AS SELECT 1 AS n'
          coproc HOLDER { sql; }
          holder_pid=$HOLDER_PID
          printf '%s\n' 'BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;' 'SELECT pg_export_snapshot();' >&"${HOLDER[1]}"
          read -r -t 30 snapshot <&"${HOLDER[0]}"
          sql -c 'INSERT INTO fixture VALUES (2)'
          docker exec sync-v3-fixture pg_dump -U postgres -Fc -t fixture --snapshot="$snapshot" postgres > "$scratch/fixture.dump"
          sql -c 'CREATE DATABASE restored'
          docker exec -i sync-v3-fixture pg_restore -U postgres -d restored --exit-on-error < "$scratch/fixture.dump"
          test "$(sql -d restored -c 'SELECT count(*) FROM fixture')" = 1
          printf '%s\n' 'ROLLBACK;' '\q' >&"${HOLDER[1]}"
          wait "$holder_pid"
          test "$(stat -c %a "$scratch")" = 700
          test "$(stat -c %a "$scratch/fixture.dump")" = 600
          cleanup
          test ! -e "$scratch"
          test -z "$(docker ps -aq --filter name=^/sync-v3-fixture$)"
          trap - EXIT
          echo "Synthetic restore preserved the held snapshot. Private archive and fixture removed."

  replacement:
    if: inputs.phase == 'disposable-copy' || (inputs.phase == 'full-size' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 350
    defaults:
      run:
        working-directory: backend
    env:
      SYNC_V3_DEPLOYMENT: production
      AUTO_SYNC: 'false'
      REHEARSAL_REVISION: 6e4da10c6ce57eaa3bf6be3e0f8c4f23b96785a5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REHEARSAL_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL 17 tools and application dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REHEARSAL_REVISION"
          if [[ ! -x /usr/lib/postgresql/17/bin/initdb ]]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          echo SYNC_V3_TEST_PG_BIN=/usr/lib/postgresql/17/bin >> "$GITHUB_ENV"
          python -m pip install -r requirements-dev.txt
      - name: Exercise the complete private copy on disposable socket-only databases
        if: inputs.phase == 'disposable-copy'
        run: python -m tests.managed_rehearsal_fixture
      - name: Run the approved full-size replacement rehearsal
        if: inputs.phase == 'full-size'
        env:
          EXPORT_URL: ${{ secrets.BASEBALLOS_V3_EXPORT_URL }}
          DESTINATION_URL: ${{ secrets.BASEBALLOS_V3_REHEARSAL_DESTINATION_URL }}
          REHEARSAL_PROJECT_REF: ${{ vars.BASEBALLOS_V3_REHEARSAL_REF }}
          REHEARSAL_CLUSTER_ID: ${{ vars.BASEBALLOS_V3_REHEARSAL_CLUSTER_ID }}
          REHEARSAL_STARTED_AT: ${{ vars.BASEBALLOS_V3_REHEARSAL_STARTED_AT }}
        run: |
          set -euo pipefail
          started=$(date --date="$REHEARSAL_STARTED_AT" +%s)
          remaining=$((started + 7 * 3600 - $(date +%s)))
          (( remaining > 0 && remaining <= 7 * 3600 ))
          timeout --kill-after=10s "${remaining}s" python -m scripts.managed_replacement_rehearsal
